name: CI

on:
  push:
    branches: [main]
    # 推送 v 开头的标签（比如 v0.0.1）时，全部通过以后自动发布预览版（最后的 release 作业）
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: 数据、引擎与界面（Linux）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 安装 Tauri 的 Linux 依赖（界面与后端接线测试要用）
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust 工具链（版本见 rust-toolchain.toml）
        run: |
          rustup toolchain install
          rustup show

      - name: 格式
        run: cargo fmt --all --check

      - name: 数据和脚本校验
        run: cargo run -q -p medkit-data -- check

      - name: JSON Schema 是最新的
        run: cargo run -q -p medkit-data -- schema --check

      - name: 功能清单是最新的（docs/features.md、README 里的总表）
        run: cargo run -q -p medkit-data -- features --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: 引擎测试（含 pwsh 跑宿主协议）
        run: cargo test

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 安装前端依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 界面类型检查和构建
        run: pnpm --dir app build

      - name: 界面与后端接线测试（所有命令的权限和序列化）
        run: cargo test -p medkit --features test-helpers

  windows-test:
    name: Windows 测试（PowerShell 5.1、真实系统）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 脚本语法（Windows PowerShell 5.1 解析器）
        shell: powershell
        run: |
          $PSVersionTable.PSVersion
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              $rel = Resolve-Path -Relative $_.FullName
              Write-Output "::error file=$rel,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $settings = @{
            Severity     = @('Error', 'Warning')
            ExcludeRules = @(
              'PSUseShouldProcessForStateChangingFunctions',
              'PSAvoidUsingWriteHost',
              'PSUseSingularNouns'
            )
            Rules        = @{
              PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1') }
            }
          }
          $results = Invoke-ScriptAnalyzer -Path scripts -Recurse -Settings $settings
          foreach ($r in $results) {
            $rel = Resolve-Path -Relative $r.ScriptPath
            $level = if ($r.Severity -eq 'Error') { 'error' } else { 'warning' }
            Write-Output "::$level file=$rel,line=$($r.Line)::[$($r.RuleName)] $($r.Message)"
          }
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Rust 工具链（版本见 rust-toolchain.toml）
        run: |
          rustup toolchain install
          rustup show

      - name: 引擎测试（真实注册表、服务、powershell.exe；含所有检测的冒烟测试和修复的往返测试）
        env:
          # CI 的运行环境是 Windows Server 虚拟机，这些检测在那里本来就查不了（只提示，不算失败）：
          # - system.os-support：只判断桌面版 Windows 的支持期限，服务器版会明确报「不在范围内」
          MEDKIT_SMOKE_EXPECTED_FAILURES: system.os-support
        run: cargo test -p medkit-core -- --include-ignored --nocapture

  windows-build:
    name: Windows 构建（安装包）
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust 工具链（版本见 rust-toolchain.toml）
        run: |
          rustup toolchain install
          rustup show

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: 安装前端依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: 构建界面
        run: pnpm --dir app build

      - name: Clippy（桌面外壳）
        run: cargo clippy -p medkit -- -D warnings

      - name: 构建安装包
        # 构建日期用提交时间：系统时间检测（system.clock）把它当作「今天至少是这一天」，同一次提交构建出来的程序也一样
        run: |
          $env:SOURCE_DATE_EPOCH = git log -1 --format=%ct
          pnpm tauri build

      - name: 整理产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/bundle/nsis/*-setup.exe dist/
          Copy-Item target/release/medkit.exe dist/medkit-portable.exe
          Get-ChildItem dist | ForEach-Object {
            "{0}  {1:N1} MB  {2}" -f $_.Name, ($_.Length / 1MB), (Get-FileHash $_.FullName -Algorithm SHA256).Hash
          }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medkit-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: 启动冒烟测试（真实程序：主窗口、WebView2、单实例）
        shell: pwsh
        run: ./.github/scripts/launch-smoke.ps1 -Exe (Resolve-Path target/release/medkit.exe).Path -Screenshot "$PWD/launch.png"

      - name: 上传启动截图
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: medkit-launch-screenshot
          path: launch.png
          if-no-files-found: ignore

      - name: 构建来源证明
        if: github.event_name == 'push' && github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  release:
    name: 发布预览版
    # 只在推送 v 开头的标签时运行（在 Releases 页面新建版本、填一个新的 v 标签也算），上面的作业全部通过才发布
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-test, windows-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: 下载这次构建的安装包和便携版
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name medkit-windows-x64 --dir dist

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PUBLIC: ${{ github.event.repository.visibility == 'public' }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          setup=(dist/*_"${version}"_x64-setup.exe)
          if [ ! -f "${setup[0]}" ]; then
            echo "::error::标签 $TAG 和程序的版本号对不上（Cargo.toml 的 workspace.package.version）：$(ls dist | tr '\n' ' ')"
            exit 1
          fi
          mkdir release
          # 附件名用英文：GitHub 会改掉附件名里的中文这类特殊字符
          cp "${setup[0]}" "release/medkit-${version}-x64-setup.exe"
          cp dist/medkit-portable.exe "release/medkit-${version}-x64-portable.exe"
          (cd release && sha256sum -- *.exe > SHA256SUMS.txt)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          {
            echo "电脑小药箱的预览版，只供测试：诊断和修复还在真机上验证，建议先在虚拟机或者不要紧的电脑上试。"
            echo
            echo "**下载哪个**"
            echo
            echo "- \`medkit-${version}-x64-setup.exe\`：安装版，装好以后在开始菜单里打开；电脑上没有 WebView2 运行时的，安装时会联网装上。"
            echo "- \`medkit-${version}-x64-portable.exe\`：便携版，不用安装，双击直接运行，可以放在 U 盘里带着走；要用电脑上已有的 WebView2 运行时（Windows 11 自带，大多数 Windows 10 也有）。"
            echo
            echo "**打开之前**"
            echo
            echo "- 要求 64 位的 Windows 10 或 Windows 11；小药箱启动时会请求管理员权限。"
            echo "- 还没有代码签名，Windows 会提示「Windows 已保护你的电脑」：点「更多信息」→「仍要运行」。"
            echo "- 改设置之前都会先预览，改完能在「修改日志」里撤销；不能撤销的会事先说明。"
            echo
            echo "**核对文件**"
            echo
            echo "- \`SHA256SUMS.txt\` 里是两个文件的 SHA-256。"
            echo "- 由 GitHub Actions 从提交 \`${GITHUB_SHA}\` 构建，所有检查都通过了：[构建记录](${run_url})。"
            if [ "$PUBLIC" = "true" ]; then
              echo "- 可以用 \`gh attestation verify <文件> --repo ${GITHUB_REPOSITORY}\` 核对构建来源证明。"
            fi
            echo
            echo "能做什么见[功能清单](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${TAG}/docs/features.md)。"
          } > notes.md
          files=(release/*.exe release/SHA256SUMS.txt)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 已经在 Releases 页面上建好了这个版本（新建版本时填了新标签，标签也会触发这里）：只把文件传上去；
            # 说明是空的才填上，写了的不动
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
            if [ -z "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
              --title "电脑小药箱 ${TAG}（预览版）" --notes-file notes.md "${files[@]}"
          fi
