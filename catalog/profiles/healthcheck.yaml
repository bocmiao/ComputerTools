# 系统体检：按用户最关心的顺序排列。存储与硬盘 → 系统与更新 → 网络 → 安全 → 硬件。
id: healthcheck
schema_version: 1
title: { zh-CN: 系统体检 }
checks:
  # 存储与硬盘
  - disk.system-free-space
  - disk.smart-health
  - disk.error-events
  # 系统与更新（时间放最前面：时间不对时，支持期这些和日期有关的结论也不准；WMI 紧跟着：它坏了，后面很多检查都查不了）
  - system.clock
  - system.wmi
  - system.os-support
  - update.blocked
  - system.pending-reboot
  - system.reliability-recent
  - boot.last-boot-duration
  - system.winre-status
  - system.windows-search
  - system.shell-folders
  - system.managed-device
  # 网络（DNS 只在「上不了网」里查：断网时它只会说「查不了」）
  - network.connectivity
  - network.proxy-dead
  - network.hosts
  - network.winsock
  # 安全
  - security.browser-shortcuts
  - security.uac
  - security.firewall
  - security.ifeo-hijack
  - system.disabled-tools
  - security.bitlocker-status
  - security.secureboot-ca2023
  - security.tpm
  # 硬件
  - hardware.device-problems
  - display.resolution
  - hardware.class-filters
  - hardware.system-disk-type
  - hardware.memory-size
  - system.pagefile
  # 显卡：台式机显示器插在主板上、独立显卡被停用或者没驱动
  - display.gpus
  - hardware.battery-health
  - hardware.cpu-features
