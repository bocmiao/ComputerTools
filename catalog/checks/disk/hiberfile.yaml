# 休眠文件（C 盘根目录的 hiberfil.sys）占了多少、能不能缩小。脚本：scripts/checks/disk/hiberfile.ps1
# 完整版休眠文件默认是内存的 40% 左右，支持「休眠」「混合睡眠」和快速启动；精简版是 20% 左右，只给快速启动用
# （微软文档：System power states → Hibernation file types）。powercfg /hibernate /type reduced 换成精简版。
# 判断是哪一种：注册表 HKLM\SYSTEM\CurrentControlSet\Control\Power 的 HibernateEnabled、HiberFileType
# （1 精简、2 完整）、HiberFileSizePercent（手动设过的大小）；没有 HiberFileType 时按文件大小占内存的比例判断
# （不到 30% 算精简版）。这段代码和 disk.reduce-hiberfile 的脚本共用（shared block hiberfile-state）。
# 结果（按这个顺序判断）：
#   off：没有休眠文件（休眠关着，或者这台电脑用不了休眠，虚拟机常见）→ na
#   custom：大小是手动设过的（powercfg 要先把大小改回系统管理才能换成精简版），小药箱不动 → na
#   reduced：已经是精简版 → ok
#   battery：完整版，但这台电脑有电池（笔记本、平板，或者接了会报告成电池的 UPS）：电量快用完时要靠它
#            把正在做的事存下来，不建议缩小 → na
#   small：完整版，但缩小也腾不出 1 GB（内存不到 5 GB 左右）→ ok
#   full：完整版、没有电池、缩小能腾出 1 GB 以上 → advice，给「缩小休眠文件」的按钮
# 功能 disk.reduce-hiberfile 用这个检测复查（verify）：na 的几种情况引擎不让执行，理由就是这里的结论。
# 待真机验证：接了 USB 不间断电源（UPS）的台式机，Win32_Battery 是否会把 UPS 当成电池（是的话只是不给按钮）。
id: disk.hiberfile
schema_version: 1
title: { zh-CN: 休眠文件 }
description:
  zh-CN: 看看休眠文件（C 盘根目录下的 hiberfil.sys）占了多少空间，能不能缩小。
category: disk
requires_admin: false
probe:
  script: checks/disk/hiberfile.ps1
results:
  off:
    status: na
    message:
      zh-CN: C 盘上没有休眠文件（休眠关着，或者这台电脑用不了休眠），它不占空间。
  custom:
    status: na
    message:
      zh-CN: "休眠文件的大小是专门设置过的（内存的 {percent}%），占 {size_gb} GB。小药箱不改这种设置。"
    next:
      zh-CN: 想缩小的话请懂哥看看：要先把大小改回由系统管理，再换成精简版。
  reduced:
    status: ok
    message:
      zh-CN: "休眠文件已经是只给快速启动用的精简版，占 {size_gb} GB，不能再小了。"
  battery:
    status: na
    message:
      zh-CN: "休眠文件占 {size_gb} GB。这台电脑有电池（笔记本、平板，或者接了不间断电源）：电量快用完时，系统靠它把正在做的事存下来，所以不建议缩小。"
  small:
    status: ok
    message:
      zh-CN: "休眠文件占 {size_gb} GB，缩小也腾不出 1 GB，不值得为此放弃「休眠」，不用动它。"
  full:
    status: advice
    message:
      zh-CN: "休眠文件占 {size_gb} GB。换成只给快速启动用的精简版，大约能腾出 {save_gb} GB。"
    fixer: medkit
    next:
      zh-CN: 换成精简版以后不能再用「休眠」，「混合睡眠」也会失效（睡眠时突然停电，没保存的东西就没了）；关机、睡眠和快速启动照常。平时不用「休眠」的，可以点下面的按钮缩小；以后想恢复，在修改日志里撤销就行。
    links: ["feature:disk.reduce-hiberfile"]
  unknown:
    status: unknown
    message:
      zh-CN: "有休眠文件（{size_gb} GB），但没查出是完整版还是精简版。"
references:
  - https://learn.microsoft.com/en-us/windows/win32/power/system-power-states
  - https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options
  - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-battery
