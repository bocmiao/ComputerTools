# 系统版本是否还在支持期内。脚本：scripts/checks/system/os-support.ps1
# 读 HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion 的 CurrentBuild、DisplayVersion、EditionID、
# ProductName、InstallationType。Win11 的 ProductName 仍然写 Windows 10，所以按 build ≥ 22000 判断。
# 脚本里有一张「build → 支持截止日期」的表，2026-09-26 按微软生命周期页面核对过（页面是太平洋时间，
# 表里写的是最后一个受支持的日子）：
#   Win11 家庭版/专业版：21H2 2023-10-10、22H2 2024-10-08、23H2 2025-11-11、24H2 2026-10-13、
#                        25H2 2027-10-12、26H1 2028-03-14（26H1 只预装在骁龙 X2 新机上）
#   Win11 企业版/教育版：21H2 2024-10-08、22H2 2025-10-14、23H2 2026-11-10、24H2 2027-10-12、
#                        25H2 2028-10-10、26H1 2029-03-13（任务只要求家庭版/专业版，企业版/教育版的日期
#                        不同，按家庭版的表会误报，所以一并加上）
#   Win10 22H2：2025-10-14 停止支持；消费者扩展安全更新（ESU，只限家庭版、专业版、专业教育版、
#               专业工作站版的 22H2）到 2027-10-12
#   长期服务版（EditionID 以 EnterpriseS / IoTEnterpriseS 开头，含 N 版）单独一张表：
#     LTSB 2015 2025-10-14、LTSB 2016 2026-10-13、LTSC 2019 2029-01-09、
#     LTSC 2021 2027-01-12（IoT 2032-01-13）、LTSC 2024 2029-10-09（IoT 2034-10-10）
# 结果：supported（Win11 在支持期内）/ ending-soon（Win11，但 60 天内就到期：现在就装最新的功能更新）/
#       newer（Win11，比表里的版本都新：刚发布、表里还没有的版本，或者预览版，还在支持期内）/
#       ltsc（长期服务版且没过期）/ ltsc-ending-soon（长期服务版，60 天内到期）/
#       win10（Win10 22H2 家庭版、专业版一族，ESU 还没结束，可以登记）/
#       expired（22H2 之前的 Win10 家庭版、专业版一族：先更新到 22H2 再登记 ESU）/
#       expired-win11（Win11 的这个版本过期了：装最新的功能更新）/
#       expired-no-esu（过期而且没有免费 ESU：Win10 企业版、教育版、IoT 版，过期的长期服务版，ESU 结束以后的 Win10）。
# 「家庭版、专业版一族」指 EditionID 不以 Enterprise、Education、IoTEnterprise、ServerRdsh 开头的版本
# （含家庭中文版 CoreCountrySpecific、专业教育版、专业工作站版），和微软 ESU 页面列的可登记版本一致。
# 比表里最新的主线版本（25H2，build 26200，脚本里的 $win11Newest）还新、表里又没有的 build（比如 2026 年 10 月
# 才正式发布的 26H2，build 26300），算 newer：新版本至少支持两年，只是具体日期还不知道。比它旧、表里又没有的 build
# 脚本会报错，显示「没查出来」，不去猜。每次微软发布新版本都要更新这张表和 $win11Newest。
# Windows Server 也报错（不在本检测范围内）。
# 已经登记了 ESU 的 Win10 也返回 win10：微软没有公开能让脚本读的登记状态（社区工具用的是
# HKCU\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\ConsumerESU 的 ESUEligibility，格式没有官方说明），
# 所以文案不说「你没登记」，只说「还没登记的话……」，登记状态以「Windows 更新」页面为准。
# 能不能升级 Windows 11 不在这里下结论：同一屏的「TPM 安全芯片」「CPU 是否支持新版 Windows 11」两项会说，
# 最终以「Windows 更新」页面为准（Win11 还要求 CPU 在支持列表里，小药箱没有查这一项）。
# 待真机验证：国内（区域为中国、用微软账户登录）能否在「Windows 更新」里看到并完成免费 ESU 登记（计划书第一节）；
# 登记前后 ConsumerESU 键的变化，见 docs/real-machine-checklist.md。
id: system.os-support
schema_version: 1
title: { zh-CN: 系统是否还在支持期 }
description:
  zh-CN: 看看你的 Windows 版本微软还管不管。过了支持期就收不到安全更新，中毒、被攻击的风险会变大。
category: system
requires_admin: false
probe:
  script: checks/system/os-support.ps1
results:
  supported:
    status: ok
    message:
      zh-CN: "你的系统是 {os} {version}，微软会提供安全更新到 {end_date}。"
  newer:
    status: ok
    message:
      zh-CN: "你的系统是 {os} {version}（版本号 {build}），比小药箱认识的版本都新，还在微软的支持期内。具体支持到哪天，以微软公布的为准。"
  ending-soon:
    status: advice
    message:
      zh-CN: "你的系统是 {os} {version}，微软只提供安全更新到 {end_date}，还剩 {days_left} 天。"
    fixer: user
    next:
      zh-CN: 打开「设置 → Windows 更新」（点下面的按钮就能直接打开），安装最新的功能更新（大版本更新），装好以后就能继续收到安全更新。Windows 更新一般也会自动推送，先保存好手头的文件，按提示重启就行。如果提示这台电脑不满足要求，请懂哥或售后帮忙看看。
    links: ["tool:settings.windows-update"]
  win10:
    status: advice
    message:
      zh-CN: "你的系统是 Windows 10，微软已在 {end_date} 停止常规支持。登记了免费的「扩展安全更新」，就能继续收到安全补丁到 {esu_end}。"
    fixer: user
    next:
      zh-CN: "如果还没登记：打开「设置 → 更新和安全 → Windows 更新」（点下面的按钮就能直接打开），按页面上的提示登记（需要登录微软账户）。这个页面上也能看到这台电脑是不是已经登记好了，已经登记的就不用再做什么。想免费升级到 Windows 11 的话，先看看体检里「TPM 安全芯片」「CPU 是否支持新版 Windows 11」这两项，能不能升级以「Windows 更新」页面上说的为准。"
    links: ["tool:settings.windows-update"]
  expired:
    status: advice
    message:
      zh-CN: "你的系统（{os} {version}）已经停止支持，微软不再提供安全更新。"
    fixer: user
    next:
      zh-CN: "先打开「设置 → 更新和安全 → Windows 更新」（点下面的按钮就能直接打开），把系统更新到 Windows 10 22H2，再按页面上的提示免费登记「扩展安全更新」，就能继续收到安全补丁到 {esu_end}（需要登录微软账户）。想免费升级到 Windows 11 的话，先看看体检里「TPM 安全芯片」「CPU 是否支持新版 Windows 11」这两项，能不能升级以「Windows 更新」页面上说的为准。"
    links: ["tool:settings.windows-update"]
  expired-win11:
    status: advice
    message:
      zh-CN: "你的系统（{os} {version}）已经停止支持，微软不再提供安全更新。"
    fixer: user
    next:
      zh-CN: 打开「设置 → Windows 更新」（点下面的按钮就能直接打开），安装最新的功能更新（大版本更新），装好以后就能继续收到安全更新。如果提示这台电脑不满足要求，请懂哥或售后帮忙看看。
    links: ["tool:settings.windows-update"]
  expired-no-esu:
    status: advice
    message:
      zh-CN: "你的系统（{os} {version}）已经停止支持，微软不再提供安全更新，也没有可以免费登记的「扩展安全更新」。"
    fixer: helper
    next:
      zh-CN: 能不能升级到 Windows 11，先看看体检里「TPM 安全芯片」「CPU 是否支持新版 Windows 11」这两项，再请懂哥或售后帮忙确认；升级不了的，请他们帮忙换成还在支持期内的 Windows 版本。升级或换系统之前，一定要先备份重要文件。
  ltsc-ending-soon:
    status: advice
    message:
      zh-CN: "你的系统是 Windows 长期服务版（{version}），微软只提供安全更新到 {end_date}，还剩 {days_left} 天。长期服务版不会自动升级到新版本。"
    fixer: helper
    next:
      zh-CN: 到期以后就收不到安全更新了。请懂哥或单位的电脑管理员帮忙换成还在支持期内的版本；换系统之前，一定要先备份重要文件。
  ltsc:
    status: ok
    message:
      zh-CN: "你的系统是 Windows 长期服务版（{version}），微软会提供安全更新到 {end_date}。长期服务版不会升级到新的功能版本，这是正常的。"
references:
  - https://learn.microsoft.com/en-us/lifecycle/products/windows-11-home-and-pro
  - https://learn.microsoft.com/en-us/lifecycle/products/windows-11-enterprise-and-education
  - https://learn.microsoft.com/en-us/lifecycle/products/windows-10-home-and-pro
  - https://www.microsoft.com/en-us/windows/extended-security-updates
  - https://learn.microsoft.com/en-us/lifecycle/products/windows-10-enterprise-ltsc-2021
  - https://learn.microsoft.com/en-us/lifecycle/products/windows-11-enterprise-ltsc-2024
  - https://support.microsoft.com/en-us/windows/windows-10-support-has-ended-on-october-14-2025-2ca8b313-1946-43d3-b55c-2b95b107f281
