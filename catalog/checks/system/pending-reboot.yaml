# 是否在等待重启。脚本：scripts/checks/system/pending-reboot.ps1
# 判断依据（键存在即表示要重启）：
#   HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending
#   HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired
# PendingFileRenameOperations 只作为事实（file_rename_pending）：很多安装程序都会留下它，
# 不代表有更新在等重启。
# 待真机验证：普通用户权限下能否读到 Component Based Servicing 键（读不到会报错，显示「没查出来」）。
id: system.pending-reboot
schema_version: 1
title: { zh-CN: 是否在等待重启 }
description:
  zh-CN: 看看系统是不是装了更新、正等着重启。没重启之前，更新不算装完，有些问题也修不好。
category: system
requires_admin: false
probe:
  script: checks/system/pending-reboot.ps1
results:
  none:
    status: ok
    message:
      zh-CN: 没有等待重启的更新。
  pending:
    status: advice
    message:
      zh-CN: 系统装了更新，正等着你重启电脑。
    fixer: user
    next:
      zh-CN: 先保存好手头的文件，重启一下电脑再继续。很多问题（包括更新装不上）重启以后就好了。
references:
  - https://learn.microsoft.com/en-us/powershell/dsc/reference/resources/microsoft/windows/rebootpending/
  - https://learn.microsoft.com/en-us/answers/questions/3876101/what-causes-registry-that-indicates-reboot-pending
