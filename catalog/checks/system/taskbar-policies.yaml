# 任务栏、右下角的图标、开始菜单有没有被策略去掉或者锁住。脚本：scripts/checks/system/taskbar-policies.ps1（user_hive：读登录用户的设置）
# 读的是组策略「「开始」菜单和任务栏」写的那些值（微软 ADMX 文档 ADMX_StartMenu、ADMX_Taskbar，和 StartMenu.admx、Taskbar.admx
# 原文对照过）；「优化」软件、网上的教程、病毒常直接写注册表，有时连整台电脑（HKLM）一起写，所以登录用户和整台电脑的两份都读：
#   Policies\Explorer：NoTrayItemsDisplay（隐藏通知区域）、HideSCAVolume / HideSCANetwork / HideSCAPower（删除音量、网络、电池图标）、
#     HideClock（删除时钟）、NoTrayContextMenu（任务栏的右键菜单）、NoSetTaskbar（任务栏和开始菜单的设置）、LockTaskbar、
#     TaskbarLockAll（锁定任务栏）、NoStartMenuMorePrograms（开始菜单的「所有应用」）、NoChangeStartMenu（不许改开始菜单）
#   Software\Policies\Microsoft\Windows\Explorer：DisableNotificationCenter（删除通知中心）、TaskbarNoPinnedList（去掉任务栏上固定的程序）、
#     NoPinningToTaskbar（不许固定到任务栏）、LockedStartLayout（固定的开始菜单布局）
# DWORD 不是 0 就算。Win 键、「运行」、关机按钮的策略在 system.disabled-tools 里查。只读：小药箱不改策略（计划书第五节）。
# 结果：set（advice）、ok。事实：items（代码）、where（user / machine / both）、values（哪些值，HKCU / HKLM 开头）。
id: system.taskbar-policies
schema_version: 1
title: { zh-CN: 被策略改动的任务栏和开始菜单 }
description:
  zh-CN: 看看右下角的音量、网络、电池图标和时间，任务栏的右键菜单、设置，开始菜单的「所有应用」这些，有没有被策略去掉或者锁住。「优化」软件、网上的教程、病毒常这么改，改完「设置」里对应的开关是灰的。
category: system
requires_admin: false
user_hive: true
probe:
  script: checks/system/taskbar-policies.ps1
results:
  ok:
    status: ok
    message:
      zh-CN: 任务栏、右下角的图标和开始菜单都没有被策略改动。
  set:
    status: advice
    message:
      zh-CN: "这些被策略去掉或者锁住了：{items_text}。这些策略{where_text}，「设置」里对应的开关会是灰的、改不了。"
    fixer: helper
    next:
      zh-CN: 单位、学校的电脑是管理员有意设置的，不要改，找管理员。个人电脑上出现这些，多半是「优化」软件、网上的教程或者病毒改的：先用「Windows 安全中心」全盘扫描一次；专业版可以在「本地组策略编辑器」（gpedit.msc）的「用户配置 → 管理模板 →「开始」菜单和任务栏」里把对应的项改回「未配置」（「计算机配置」下面同名的也看一看），家庭版请懂哥在注册表里删掉详情里列出的这几个值；改完点「重启资源管理器」或者注销再登录。小药箱不改策略。
    links: ["tool:settings.windows-security", "tool:system.restart-explorer"]
fact_labels:
  items_text:
    from: items
    values:
      tray-all: { zh-CN: 「右下角的所有小图标」 }
      volume: { zh-CN: 「音量图标」 }
      network: { zh-CN: 「网络图标」 }
      battery: { zh-CN: 「电池图标」 }
      clock: { zh-CN: 「时间和日期」 }
      notification-center: { zh-CN: 「通知中心」（Windows 10 叫操作中心） }
      taskbar-menu: { zh-CN: 「任务栏的右键菜单」 }
      taskbar-settings: { zh-CN: 「任务栏和开始菜单的设置」 }
      taskbar-locked: { zh-CN: 「任务栏」（锁定了，拖不动、不能调大小） }
      pinned-removed: { zh-CN: 「任务栏上固定的程序」 }
      no-pinning: { zh-CN: 「固定到任务栏」 }
      all-apps: { zh-CN: 「开始菜单里的所有应用」 }
      start-locked: { zh-CN: 「开始菜单」（锁定了，不能固定、取消固定） }
  where_text:
    from: where
    values:
      user: { zh-CN: 设在当前登录的用户上 }
      machine: { zh-CN: 设在整台电脑上 }
      both: { zh-CN: 当前用户和整台电脑上都设了 }
references:
  - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-taskbar
  - https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csp-admx-startmenu
