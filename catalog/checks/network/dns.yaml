# 查网站地址（DNS）：电脑能不能通过系统自己的 DNS 查到常用网站的地址。脚本：scripts/checks/network/dns.ps1
# 用 Windows 设置好的 DNS 服务器（不用我们自己指定的服务器），查两个国内能访问的网址（www.baidu.com、www.qq.com、
# www.msftconnecttest.com、www.163.com 里选，已经在 DNS 缓存里的排到后面：缓存里的结果说明不了现在的 DNS 服务器）：
# Resolve-DnsName -Type A -DnsOnly -NoHostsFile -QuickTimeout，跳过 hosts 文件，只测 DNS 服务器本身。
# 每个网址放进单独的 runspace 同时查，整个过程最多等 4.5 秒左右（和 network.connectivity 共用 dns-probe 代码块）。
# 网络本身不通时不怪 DNS：
#   offline：没有默认路由（没拿到路由器地址），根本出不去，不查，unknown；
#   ok：至少查到一个；
#   no-server：一个 DNS 服务器也没有（数不到，或者系统报 DNS_ERROR_NO_DNS_SERVERS）；
#   failed-manual：都没查到，而且 DNS 服务器是手动设置的（连着的网卡在 Tcpip / Tcpip6 Parameters\Interfaces\<GUID> 下有 NameServer；
#     从 DHCP 拿到的在 DhcpNameServer 里）；
#   failed：都没查到，但 Windows 自己的检测（NCSI，Get-NetConnectionProfile）说能上网：是 DNS 的问题；
#   unreachable：都没查到，Windows 也说上不了网：多半是网络本身不通，unknown，交给 network.connectivity。
# 查不了时（精简系统上没有 Resolve-DnsName，或者一个也没查成）脚本报错，界面显示「没查出来」。
# 事实（不输出任何地址）：internet、has_route、server_count、manual_dns、tried、resolved、cached（事先已经在缓存里的个数）、
#   error（no-servers / server-failure / not-found / bogus-answer / timeout / failed / not-run）、error_code（Win32 / DNS 错误号）。
id: network.dns
schema_version: 1
title: { zh-CN: 查网站地址（DNS） }
description:
  zh-CN: 看看电脑能不能通过 DNS 查到常用网站的地址。查不到时，网页都打不开，微信、QQ 这类软件却可能还能用。
category: network
requires_admin: false
timeout_sec: 20
probe:
  script: checks/network/dns.ps1
results:
  ok:
    status: ok
    message:
      zh-CN: DNS 正常：能查到常用网站的地址。
  offline:
    status: unknown
    message:
      zh-CN: 电脑现在没有连上网络（或者没拿到路由器的地址），查不了 DNS。
    next:
      zh-CN: 先按「网络通不通」这一项的提示把网络连上，再查一次。
  unreachable:
    status: unknown
    message:
      zh-CN: 查不到网站的地址，但 Windows 显示这台电脑现在连不上互联网，所以多半是网络本身不通，不一定是 DNS 的问题。
    next:
      zh-CN: 先按「网络通不通」这一项的提示处理，网络通了以后再查一次。
  no-server:
    status: advice
    message:
      zh-CN: 这台电脑没有能用的 DNS 服务器，查不到任何网站的地址，所以网页都打不开（微信、QQ 这类软件可能还能用）。
    fixer: user
    next:
      zh-CN: 先把路由器拔掉电源，等 30 秒再插上，等两三分钟再试。还不行的话，把 DNS 改回自动获取：Windows 11 打开「设置 → 网络和 Internet」，点正在用的「WLAN」或「以太网」（WiFi 还要再点连着的那个网络的「属性」），在「DNS 服务器分配」旁边点「编辑」，选「自动(DHCP)」保存；Windows 10 在「更改适配器选项」里右键网卡，选「属性」，双击「Internet 协议版本 4 (TCP/IPv4)」，选「自动获得 DNS 服务器地址」。拿不准就请懂哥帮忙。
    links: ["tool:settings.network"]
  failed:
    status: advice
    message:
      zh-CN: 网络是通的，但查不到网站的地址（DNS 出了问题），所以网页打不开；微信、QQ 这类软件可能还能用。
    fixer: user
    next:
      zh-CN: 先点下面的「刷新 DNS 缓存」，再把路由器拔掉电源，等 30 秒再插上，等两三分钟后再试。还不行，多半是宽带给的 DNS 服务器出了问题，可以请懂哥把 DNS 改成国内的公共 DNS（比如阿里的 223.5.5.5、腾讯的 119.29.29.29），改之前记下原来的设置，以后能改回来。
    links: ["tool:network.flush-dns", "tool:settings.network"]
  failed-manual:
    status: advice
    message:
      zh-CN: 这台电脑的 DNS 服务器是手动设置的，但现在查不到网站的地址，所以网页都打不开。多半是这个 DNS 服务器用不了了（比如设成了国外的 DNS，或者被 VPN、加速器改过）。
    fixer: user
    next:
      zh-CN: 单位的电脑、DNS 是网管设置的，请找网管。不是的话，可以改回自动获取：Windows 11 打开「设置 → 网络和 Internet」，点正在用的「WLAN」或「以太网」（WiFi 还要再点连着的那个网络的「属性」），在「DNS 服务器分配」旁边点「编辑」，选「自动(DHCP)」保存；Windows 10 在「更改适配器选项」里右键网卡，选「属性」，双击「Internet 协议版本 4 (TCP/IPv4)」，选「自动获得 DNS 服务器地址」。改完再点下面的「刷新 DNS 缓存」。拿不准就请懂哥帮忙。
    links: ["tool:settings.network", "tool:network.flush-dns"]
