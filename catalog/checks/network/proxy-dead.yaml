# 系统代理是否指向一个已经不在运行的本机程序。脚本：scripts/checks/network/proxy-dead.ps1
# 读登录用户（-UserHive）的两处设置：
#   1. Internet Settings\Connections\DefaultConnectionSettings（二进制值，WinINet 和 .NET 实际读的是它）：
#      存在且不少于 16 字节时解析——偏移 8 的 DWORD 是标志，0x02 表示开了手动代理；偏移 12 的 DWORD 是
#      代理地址的长度 N，后面跟 N 字节的 ANSI 文本。格式是社区逆向出来的，微软没有公开。
#   2. 旧式的 Internet Settings\ProxyEnable、ProxyServer（WinINet 会同步，很多软件也直接写它们）。
# 两处任意一处开着代理就算开着；试连的地址优先用二进制值里的（它开着且有地址时），否则用 ProxyServer。
# 地址可能是「127.0.0.1:7890」，也可能按协议写「http=127.0.0.1:7890;https=…;socks=…」，有时还带「http://」。
# 指向本机（127.x、localhost、::1）时，用 TcpClient 试连端口，超时 500 毫秒；本机任意一个端口能连上就算 alive。
# 结果：none（没开代理）/ remote（代理在别的机器上）/ alive（本机代理在运行）/ dead（本机代理没人监听）。
# 事实：proxy_enabled、proxy_server（实际用来判断的地址）、proxy_source（blob 或 legacy）、
#       legacy_proxy_enabled、blob_proxy_enabled（二进制值存在时）、settings_mismatch（两处开关不一致，
#       或者都开着但地址不同时为 true，一致时不出现）、pac_url、proxy_address。
# AutoConfigURL（PAC 自动配置脚本）只作为事实 pac_url，不参与判断：修复 network.proxy-off 只关手动代理。
# 所以「没开手动代理、但 PAC 指向本机失效端口」目前也显示 none，以后可以单独做一个检测和修复。
id: network.proxy-dead
schema_version: 1
title: { zh-CN: 失效的系统代理 }
description:
  zh-CN: 看看系统代理是不是指向了一个已经不在运行的程序（梯子、加速器卸载后常见），这会导致网页打不开。
category: network
requires_admin: false
user_hive: true
probe:
  script: checks/network/proxy-dead.ps1
results:
  none:
    status: ok
    message:
      zh-CN: 系统没有开启代理，网络设置正常。
  remote:
    status: ok
    message:
      zh-CN: "系统设置了代理服务器 {proxy_address}（不在这台电脑上）。如果是单位或学校要求设置的，这是正常的。"
  alive:
    status: ok
    message:
      zh-CN: "系统代理指向本机 {proxy_address}，那里有程序在运行（一般是梯子或加速器），代理可以正常使用。"
  dead:
    status: advice
    message:
      zh-CN: "代理指向本机 {proxy_address}，但那里没有程序在运行，所以网页打不开。多半是梯子或加速器卸载后留下的。"
    fixer: medkit
    next:
      zh-CN: 点下面的按钮关掉这个失效的代理。关掉以后，已经打开的浏览器可能要关掉重开。以后再用梯子时，它会自己重新打开代理。
    links: ["feature:network.proxy-off"]
references:
  - https://learn.microsoft.com/en-us/windows/win32/wininet/enabling-internet-functionality
  - https://learn.microsoft.com/en-us/archive/blogs/ieinternals/understanding-web-proxy-configuration
  - https://support.microsoft.com/en-us/windows/use-a-proxy-server-in-windows-03096c53-0554-4ffe-b6ab-8b1deee8dae1
  - https://learn.microsoft.com/en-us/dotnet/api/system.net.sockets.tcpclient
