# BitLocker 加密状态。脚本：scripts/checks/security/bitlocker-status.ps1
# 数据来源：root\cimv2\Security\MicrosoftVolumeEncryption 的 Win32_EncryptableVolume，
# 只看有盘符的固定磁盘（VolumeType 0 系统盘、1 数据盘；2 可移动盘跳过）。
# 下面任一情况就算「已加密」：ProtectionStatus 为 1（保护已开）或 2（状态未知，比如分区被锁住）；
# ConversionStatus 不为 0（全部或部分已加密，包括「保护已暂停」和 24H2 设备加密「等待激活」的状态）。
# 事实：encrypted_volumes（如「C:, D:」）、encrypted_count、volume_count、protection_on、converting。
# WMI 命名空间不存在等错误由脚本抛出，界面显示「没查出来」。
# 结果代码 "off" / "on" 特意加了引号：按 YAML 1.1 解析的工具（比如 PyYAML、部分编辑器插件）
# 会把不带引号的 on / off 当成布尔值。
id: security.bitlocker-status
schema_version: 1
title: { zh-CN: BitLocker 加密 }
description:
  zh-CN: 看看硬盘有没有开启 BitLocker 加密（Windows 11 24H2 起很多新电脑会自动开启）。开了加密，重装系统、换主板之前一定要先备份恢复密钥。
category: security
requires_admin: true
timeout_sec: 30
probe:
  script: checks/security/bitlocker-status.ps1
results:
  "off":
    status: ok
    message:
      zh-CN: 硬盘没有开启 BitLocker 加密，重装系统时不需要恢复密钥。
  "on":
    status: advice
    message:
      zh-CN: "硬盘分区 {encrypted_volumes} 已开启 BitLocker 加密。数据更安全，但重装系统、换主板或刷 BIOS 以后，开机可能要求输入 48 位恢复密钥，输不出来就打不开硬盘。"
    fixer: user
    next:
      zh-CN: "请确认恢复密钥已经备份：用手机或电脑打开 aka.ms/myrecoverykey，登录你的微软账户就能看到。那里没有的话，专业版可以在开始菜单搜索「管理 BitLocker」，点「备份恢复密钥」存到 U 盘或打印出来。重装系统、换主板或刷 BIOS 之前，一定要先备份好恢复密钥。"
references:
  - https://learn.microsoft.com/en-us/windows/win32/secprov/win32-encryptablevolume
  - https://support.microsoft.com/en-us/windows/find-your-bitlocker-recovery-key-6b71ad27-0b89-ea08-f143-056f5ab347d6
  - https://support.microsoft.com/en-us/windows/device-encryption-in-windows-cf7e2b6f-3e70-4882-9532-18633605b7df
