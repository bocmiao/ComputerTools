# 内存大小和插槽。脚本：scripts/checks/hardware/memory-size.ps1
# 总内存：Win32_PhysicalMemory 各条的 Capacity 之和（拿不到时退回 Win32_ComputerSystem.TotalPhysicalMemory）；
# 插槽总数：Win32_PhysicalMemoryArray.MemoryDevices（只算 Use = 3 的系统内存）；已用插槽：Win32_PhysicalMemory 的条数。
# 结果：ok（大于 4 GB）/ low（4 GB 及以下）。
# 待真机验证：板载（焊死）内存、部分品牌机的 BIOS 报的插槽数和实际不符；主板报的插槽数比内存条还少时，
# 脚本按「插满了」处理（free_slots = 0）。拿不到内存条信息（部分虚拟机）时插槽数都是 0。
id: hardware.memory-size
schema_version: 1
title: { zh-CN: 内存大小 }
description:
  zh-CN: 看看内存有多大、还有没有空的内存插槽。内存只有 4 GB 的电脑，现在用起来会很卡。
category: hardware
requires_admin: false
probe:
  script: checks/hardware/memory-size.ps1
results:
  ok:
    status: ok
    message:
      zh-CN: "内存 {total_gb} GB，够用。"
  low:
    status: advice
    message:
      zh-CN: "内存只有 {total_gb} GB，同时开浏览器、微信和办公软件就会很卡。"
    fixer: hardware
    next:
      zh-CN: "主板有 {slots_total} 个内存插槽，已经插了 {slots_used} 条，还空着 {free_slots} 个。有空插槽的话，加一条内存（加到 8 GB 或以上）是提速最明显的办法；插槽都满了，就换成容量更大的内存条。笔记本的内存有时是焊在主板上的，加之前先问懂哥或售后。"
references:
  - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-physicalmemory
  - https://learn.microsoft.com/en-us/windows/win32/cimwin32prov/win32-physicalmemoryarray
