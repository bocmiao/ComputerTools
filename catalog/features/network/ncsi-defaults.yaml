      key: HKLM\SYSTEM\CurrentControlSet\Services\NlaSvc\Parameters\Internet
      name: EnableActiveProbing
      type: dword
      value: 0
  - registry:
      key: HKLM\SYSTEM\CurrentControlSet\Services\NlaSvc\Parameters\Internet
      name: ActiveWebProbeHost
      type: string
      value: "www.msftncsi.com"
undo: auto
references:
