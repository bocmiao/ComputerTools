# 插着电源时合上笔记本盖子不睡眠（脚本类功能）：当前电源计划的「合上盖子时」（LIDACTION）插电时改成 0（不采取任何操作），
# 用电池时的不变（放进包里还是会睡眠）。脚本在 scripts/features/power/ 下，共享块 power-plan；powercfg 改完 /setactive，马上生效。
# 状态看检测 system.lid-action（verify）：不是笔记本时它是 na，这个功能就不给执行。
#   lid-close-do-nothing-detect.ps1  插电时是 0 → applied；不是 → not-applied；读不到 → unknown
#   lid-close-do-nothing-run.ps1    -Prepare：before = { plan, ac, dc }；执行：计划或者值变了、本来就是 0 → 跳过；改成 0，读回来不对就报错
#   lid-close-do-nothing-undo.ps1   当前计划还是原来那个的，改回原来的值
#   lid-close-do-nothing-break.ps1  只在测试中使用：插电时改成睡眠（1）
# 做法和 akarcode/TempDisablePowerSettings（没写许可证，只照思路）一样用 LIDACTION；它会改所有电源计划，这里和「关掉唤醒定时器」
# 一样只改当前计划。CI 的机器不是笔记本（na），往返测试会跳过，写在真机验证清单里。
id: power.lid-close-do-nothing
schema_version: 1
title: { zh-CN: 插着电源时，合上笔记本盖子不睡眠 }
description:
  zh-CN: 笔记本接了显示器、键盘鼠标，想把盖子合上接着用：插着电源时合上盖子电脑什么都不做、照常运行。用电池时照旧睡眠，免得放进包里还开着发烫。马上生效，能撤销。
category: power
risk: safe
level: light
recommend: optional
subjective: true
requires_admin: true
reboot: none
target: machine
detect:
  script: features/power/lid-close-do-nothing-detect.ps1
prepare:
  script: features/power/lid-close-do-nothing-run.ps1
run:
  script: features/power/lid-close-do-nothing-run.ps1
undo:
  script: features/power/lid-close-do-nothing-undo.ps1
break:
  script: features/power/lid-close-do-nothing-break.ps1
verify: system.lid-action
references:
  - https://learn.microsoft.com/en-us/windows-hardware/customize/power-settings/power-button-and-lid-settings-lid-switch-close-action
  - https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options
