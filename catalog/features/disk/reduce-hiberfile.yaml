# 缩小休眠文件（脚本类功能）。脚本在 scripts/features/disk/ 下；判断休眠文件是哪一种的代码和检测
# disk.hiberfile 共用（shared block hiberfile-state），调用 powercfg 的代码在三个改动脚本里共用
# （shared block hiberfile-powercfg）。
# 用系统自己的 powercfg /hibernate /type reduced：休眠文件换成只给快速启动用的精简版（内存的 20% 左右，
# 完整版是 40% 左右），马上生效，不用重启。精简版不支持「休眠」和「混合睡眠」（微软文档：System power states）。
# 能不能执行、改好没有都看 disk.hiberfile（verify）：没有休眠文件、有电池或者是笔记本、大小是手动设过的、
# 腾不出 1 GB，检测给 na，引擎不让执行，理由就是检测的结论；精简版是 ok；完整版是 advice。
# 检测没跑成（出错、超时）时引擎照常让执行，所以执行脚本自己再按同样的规则核对（Get-HiberBlock）。
#   reduce-hiberfile-detect.ps1  撤销前核对：精简版或者没有休眠文件 → applied，完整版 → not-applied
#   reduce-hiberfile-run.ps1     -Prepare：记下 before = { kind, enabled, type, percent }（注册表里的原值，没有就是 null）；
#                                执行：状态和 before 不一样、不是完整版、有电池或是笔记本、腾不出 1 GB，就跳过
#                                （什么都不改）；否则运行
#                                powercfg /hibernate /type reduced，再读回来：不是精简版（HiberFileType 为 1，
#                                powercfg 没写这个值时按文件大小判断）就报错（引擎会用撤销脚本退回）。
#   reduce-hiberfile-undo.ps1    休眠还开着：powercfg /hibernate /type full，再把 HiberFileType、HiberFileSizePercent 恢复成
#                                原值（原来没有就删掉；删不掉、写不进就报错，不说撤销成功）；休眠后来被关掉了：只恢复这两个值，
#                                不重新打开休眠。
#   reduce-hiberfile-break.ps1   只在测试中使用：powercfg /hibernate /type full。
# 待真机验证（虚拟机一般没有休眠文件，CI 上测不到执行和撤销）：见 docs/real-machine-checklist.md。
id: disk.reduce-hiberfile
schema_version: 1
title: { zh-CN: 缩小休眠文件 }
description:
  zh-CN: 把 C 盘根目录下的休眠文件（hiberfil.sys）换成只给快速启动用的精简版，能腾出大约内存两成那么大的空间（16 GB 内存大约 3 GB），马上生效，不用重启。代价是不能再用「休眠」，「混合睡眠」也会失效（睡眠时突然停电，没保存的东西就没了）；关机、睡眠和快速启动照常。有电池的电脑（笔记本、平板）要靠完整的休眠文件在电量快用完时保存正在做的事，小药箱在这些电脑上不做这一项。
category: disk
risk: caution
level: light
recommend: optional
subjective: false
requires_admin: true
reboot: none
target: machine
detect:
  script: features/disk/reduce-hiberfile-detect.ps1
prepare:
  script: features/disk/reduce-hiberfile-run.ps1
run:
  script: features/disk/reduce-hiberfile-run.ps1
undo:
  script: features/disk/reduce-hiberfile-undo.ps1
break:
  script: features/disk/reduce-hiberfile-break.ps1
verify: disk.hiberfile
references:
  - https://learn.microsoft.com/en-us/windows/win32/power/system-power-states
  - https://learn.microsoft.com/en-us/windows-hardware/design/device-experiences/powercfg-command-line-options
