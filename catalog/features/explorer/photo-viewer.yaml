# 找回 Windows 照片查看器（Windows 10、11）。
# Windows 10 起看图默认用「照片」应用；老的「Windows 照片查看器」（%ProgramFiles%\Windows Photo Viewer\PhotoViewer.dll，
# 用 rundll32 打开）其实还在，只是只给 TIFF 登记了（PhotoViewer.FileAssoc.Tiff），「打开方式」里找不到它。
# 这里照着 Windows 自己的 PhotoViewer.FileAssoc.Tiff 给 JPEG、PNG、BMP、GIF 各建一个同样的类型：EditFlags、
# ImageOptionFlags、类型名（FriendlyTypeName）和图标用系统自带的 jpegfile、pngfile、Paint.Picture、giffile 的，所以资源
# 管理器里显示的类型和图标不变（网上常见的做法是全都指到 Tiff 那个类型，结果所有图片都显示成 TIFF 的图标）；打开命令、
# 「预览」这个菜单文字和拖放处理和 Tiff 的一样。再在它的 Capabilities\FileAssociations 里登记这些扩展名：「打开方式 →
# 选择其他应用」和「默认应用」里就有它（名字是它登记的 ApplicationName：Windows 照片查看器）。不往各扩展名的
# OpenWithProgids 里加：打开命令是 rundll32，Windows 列「打开方式」时不列 rundll32 这类宿主程序（CI 上查过，Windows
# 自己给 TIFF 的登记也不在 SHAssocEnumHandlers 的结果里），加了没用，还可能多出一项叫 Rundll32 的。
# 只是登记，不改默认程序：Windows 10 起默认程序只能由用户自己选（「打开方式 → 选择其他应用 → 始终使用」或「默认应用」）。
# 这些值是在 Windows CI（Windows Server 2025，和 Win11 24H2 同一版本）上读出来的（tests/facts/photo-viewer-and-new-menu.ps1）。
# 能不能执行、改好没有看 system.photo-viewer（verify）：PhotoViewer.dll 不在（精简版系统）是 na，不给执行。
# 恢复默认（windows_default）删掉这里写的值；撤销时引擎连同新建的键一起删掉。
id: explorer.photo-viewer
schema_version: 1
title: { zh-CN: 找回 Windows 照片查看器 }
description:
  zh-CN: 老的「Windows 照片查看器」打开快、占内存少，其实还在系统里，只是 Windows 10 以后没登记成能打开 JPG、PNG 这些图片。这里把它登记回来（图片的类型和图标不变），之后在图片上点右键「打开方式 → 选择其他应用」就能选它；勾上「始终使用」，以后双击就用它打开。不改默认程序，不装任何东西，随时可以撤销。
category: explorer
risk: safe
level: light
recommend: optional
subjective: true
requires_admin: true
reboot: none
target: machine
actions:
  - registry:
      key: 'HKLM\SOFTWARE\Classes\PhotoViewer.FileAssoc.Jpeg'
      name: 'EditFlags'
      type: dword
      value: 2162688
  - registry:
      key: 'HKLM\SOFTWARE\Classes\PhotoViewer.FileAssoc.Jpeg'
      name: 'FriendlyTypeName'
      type: expand-string
      value: '@%SystemRoot%\System32\shell32.dll,-30596'
  - registry:
      key: 'HKLM\SOFTWARE\Classes\PhotoViewer.FileAssoc.Jpeg'
      name: 'ImageOptionFlags'
      type: dword
      value: 1
  - registry:
      key: 'HKLM\SOFTWARE\Classes\PhotoViewer.FileAssoc.Jpeg\DefaultIcon'
      name: ''
      type: expand-string
      value: '%SystemRoot%\System32\imageres.dll,-72'
