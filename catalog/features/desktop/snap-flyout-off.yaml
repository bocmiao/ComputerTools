# 鼠标停在「最大化」按钮上时不弹出贴靠布局（Win11）：HKCU\…\Explorer\Advanced 的 EnableSnapAssistFlyout = 0，就是
# 「设置 → 系统 → 多任务处理 → 贴靠窗口」里的「将鼠标悬停在窗口的最大化按钮上时显示贴靠布局」。没有这个值 = 开（系统默认）。
# 只关这个弹框，把窗口拖到屏幕边上贴靠照样能用。
id: desktop.snap-flyout-off
schema_version: 1
title: { zh-CN: 最大化按钮上不弹出贴靠布局（Win11） }
description:
  zh-CN: 鼠标停在窗口右上角的「最大化」按钮上时，不再弹出分屏排列的小方框（老人家常被它挡住、点错）。把窗口拖到屏幕边上分屏照样能用。对应「设置 → 系统 → 多任务处理 → 贴靠窗口」里的这一项。
category: desktop
risk: safe
level: light
recommend: optional
subjective: true
requires_admin: false
reboot: explorer
target: current-user
applies_to:
  min_build: 22000
  max_build: null
  editions: []
actions:
  - registry:
      key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      name: EnableSnapAssistFlyout
      type: dword
      value: 0
windows_default:
  - registry:
      key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced
      name: EnableSnapAssistFlyout
      delete: true
undo: auto
references:
  - https://www.elevenforum.com/t/enable-or-disable-snap-layouts-for-maximize-button-in-windows-11.61/
  - https://winaero.com/how-to-disable-snap-layouts-for-maximize-button-in-windows-11/
