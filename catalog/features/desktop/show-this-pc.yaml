# 桌面显示「此电脑」。HKCU\…\Explorer\HideDesktopIcons\NewStartPanel 下，
# 名为 {20D04FE0-3AEA-1069-A2D8-08002B30309D}（「此电脑」的 CLSID）的 DWORD：0 = 显示，1 = 隐藏。
# 全新安装的系统里这个值不存在，桌面上也没有「此电脑」，所以 windows_default 写 delete: true。
# 对应「设置 → 个性化 → 主题 → 桌面图标设置」里的「计算机」勾选框。各版本（含家庭版）都有效。
# 注意：CLSID 以 { 开头，必须加引号，否则 YAML 会把它当成映射。
id: desktop.show-this-pc
schema_version: 1
title: { zh-CN: 桌面显示「此电脑」 }
description:
  zh-CN: 在桌面上放一个「此电脑」图标，双击就能看到 C 盘、D 盘和 U 盘，不用再到开始菜单里找。
category: desktop
risk: safe
level: light
recommend: recommended
subjective: false
requires_admin: false
reboot: explorer
target: current-user
actions:
  - registry:
      key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel
      name: "{20D04FE0-3AEA-1069-A2D8-08002B30309D}"
      type: dword
      value: 0
windows_default:
  - registry:
      key: HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel
      name: "{20D04FE0-3AEA-1069-A2D8-08002B30309D}"
      delete: true
undo: auto
references:
  - https://support.microsoft.com/en-us/windows/customize-the-desktop-icons-in-windows-c13270f0-3812-c71d-f27e-29aa32588b20
  - https://learn.microsoft.com/en-us/archive/blogs/askds/controlling-usmt-desktop-shell-icon-behavior-from-xp-and-how-to-create-registry-values-out-of-thin-air
