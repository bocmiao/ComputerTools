# 打开「设置」里的一页（open）：ms-settings:display-advancedgraphics（微软《Launch the Windows Settings app》：「Graphics
# Settings」，只有支持的设备上有）。Windows 11 是「系统 → 屏幕 → 显示卡」，Windows 10 是「系统 → 显示 → 图形设置」。
# 在这里给某个程序选「节能」（集成显卡）、「高性能」（独立显卡）或者「让 Windows 决定」。NVIDIA 说从 Windows 10 2004
# 起用哪块显卡由 Windows 决定，这里的设置比 NVIDIA 控制面板里的「首选图形处理器」优先。
# 设置存在 HKCU\Software\Microsoft\DirectX\UserGpuPreferences 里（值名是程序的完整路径，内容像 GpuPreference=2;，
# 同一个值里还可能有别的设置）。小药箱不替用户写：要选哪个程序，由用户在这一页里「浏览」找到；照 SetGpuPreference（MIT）、
# GPUPrefSwitcher（GPL-3.0）这些开源工具的写法记在调研文档里，以后要批量设置再做。
