title: { zh-CN: 图形设置（让游戏用独立显卡） }
description:
  zh-CN: 打开「设置」里的图形设置（Windows 11 叫「显示卡」），给游戏、剪辑软件选「高性能」，让它用独立显卡；选「节能」就用集成显卡、更省电。改完要把这个程序关掉重新打开才生效。
