# 打开「设置」里的一页（open）：ms-settings:easeofaccess-colorfilter（辅助功能 → 颜色滤镜），由系统打开。
# 「颜色滤镜」开着时屏幕会变成黑白（灰度）、反色，或者用色弱滤镜；「颜色滤镜的键盘快捷方式」开着时 Win + Ctrl + C 能开关它。
