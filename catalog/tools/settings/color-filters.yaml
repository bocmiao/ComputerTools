  zh-CN: 打开「设置」里的辅助功能 → 颜色滤镜：屏幕变成黑白、颜色反了，在这里把「颜色滤镜」关掉；不想再被 Win + Ctrl + C 误开，关掉下面的「键盘快捷方式」。
