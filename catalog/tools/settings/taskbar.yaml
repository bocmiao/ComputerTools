# 打开「设置」里的一页（open）：ms-settings:taskbar（「个性化 → 任务栏」），由系统打开。
# Windows 11 在这里打开或关掉右下角「其他系统托盘图标」、任务栏上的搜索、任务视图、小组件，改任务栏的对齐方式和自动隐藏；
# Windows 10 在这里「选择哪些图标显示在任务栏上」「打开或关闭系统图标」（时钟、音量、网络、电源、输入指示），也能锁定任务栏、
# 改位置。被策略锁住的开关是灰的（检测 system.taskbar-policies）。
