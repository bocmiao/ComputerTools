# 打开「设置」里照片的「高级选项」（open）：ms-settings:appsfeatures-app?Microsoft.Windows.Photos_8wekyb3d8bbwe，由系统打开。这一页有「终止」「修复」「重置」，
# 办法照微软《修复 Windows 中的应用和程序》：先修复（不删数据），不行再重置。包系列名照微软《Keep removed apps from returning
# during an update》。应用被删掉了的电脑上打开的是什么页面，写在真机验证清单里。
id: settings.app-photos
schema_version: 1
group: open
title: { zh-CN: 照片应用的高级选项 }
description:
  zh-CN: 照片应用打不开、一打开就闪退、一直停在启动画面上转圈时用：打开「设置」里照片应用的「高级选项」，先点「终止」再点「修复」（不删数据）；还不行点「重置」（会清掉照片应用自己的设置，图片文件不会删）。
category: settings
open: { settings: "appsfeatures-app?Microsoft.Windows.Photos_8wekyb3d8bbwe" }
