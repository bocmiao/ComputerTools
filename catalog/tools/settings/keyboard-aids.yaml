# 打开「设置」里的一页（open）：ms-settings:easeofaccess-keyboard（辅助功能 → 键盘），由系统打开。
# 筛选键、粘滞键的开关都在这一页；鼠标键在「鼠标」那一页（settings.mouse-keys）。
id: settings.keyboard-aids
schema_version: 1
