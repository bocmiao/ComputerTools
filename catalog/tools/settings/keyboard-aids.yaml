title: { zh-CN: 键盘的辅助功能 }
description:
  zh-CN: 打开「设置」里的辅助功能 → 键盘：在这里关掉「筛选键」（按键要按住一会儿才算数）和「粘滞键」（Shift、Ctrl 按一下就算按着，字母莫名变成大写）。键盘按了没反应、字母莫名变成大写时，先来这里看看。
