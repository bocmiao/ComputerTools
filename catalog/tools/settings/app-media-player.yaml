description:
  zh-CN: 媒体播放器（Windows 10 上叫 Groove 音乐）打不开、放不了歌时用：打开「设置」里它的「高级选项」，先点「终止」再点「修复」；还不行点「重置」（播放列表会清掉，音乐文件不会删）。
