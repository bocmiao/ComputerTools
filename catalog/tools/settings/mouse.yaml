# 打开「设置」里的一页（open）：ms-settings:mousetouchpad，由系统打开。「蓝牙和其他设备 → 鼠标」：主鼠标按钮（左、右）、鼠标指针
# 速度、一次滚动多少行；有触摸板的电脑上这一页还有触摸板的设置（微软《Launch the Windows Settings app》、《更改鼠标设置》）。
