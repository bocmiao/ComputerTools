# 打开「设置」里的一页（open）：ms-settings:windowsdefender（隐私和安全性 → Windows 安全中心），由系统打开。
# 从这里进「病毒和威胁防护」→「扫描选项」→「完全扫描」。小药箱不改 Defender 的任何设置（计划书第五节第 4 条），只给入口。
