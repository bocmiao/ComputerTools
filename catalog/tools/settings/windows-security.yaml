description:
  zh-CN: 打开 Windows 自带的杀毒软件「Windows 安全中心」。怀疑中了病毒时，点「病毒和威胁防护」→「扫描选项」→「完全扫描」→「立即扫描」；装了别的杀毒软件的，用那个软件全盘扫描。
