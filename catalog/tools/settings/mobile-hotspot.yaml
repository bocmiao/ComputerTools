# 打开「设置」里的一页（open）：ms-settings:network-mobilehotspot，由系统打开。「网络和 Internet → 移动热点」：选共享哪个连接、
# 网络名称和密码（「属性 → 编辑」）、网络频段，最上面是开关（微软《将 Windows 设备用作移动热点》）。
