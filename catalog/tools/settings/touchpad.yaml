title: { zh-CN: 触摸板设置 }
description:
  zh-CN: 打开「设置」里的触摸板：看触摸板的开关是不是开着，接了鼠标触摸板就不能用的，勾上「连接鼠标时让触摸板保持打开状态」；还能调灵敏度和手势。只有笔记本有这一页。
