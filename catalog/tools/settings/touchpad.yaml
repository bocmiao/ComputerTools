# 打开「设置」里的一页（open）：ms-settings:devices-touchpad，由系统打开（微软：只有带触摸板的电脑有这一页）。「蓝牙和其他设备 →
# 触摸板」：触摸板的开关、「连接鼠标时让触摸板保持打开状态」、灵敏度和手势。
id: settings.touchpad
