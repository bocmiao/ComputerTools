  zh-CN: 打开控制面板的「网络连接」：看每个网卡连着没有；在网卡上点右键「禁用」再「启用」，能让它重新连一次；右键「属性」→「配置」里有「电源管理」和「高级」两页，网卡的省电设置都在这里。
