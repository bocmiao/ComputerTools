# 打开「高级共享设置」（open）：control.exe /name Microsoft.NetworkAndSharingCenter /page Advanced。Win11 22H2 起控制面板的这一页
# 转到「设置 → 网络和 Internet → 高级网络设置 → 高级共享设置」。这里按网络类型（专用、公用、所有网络）开关「网络发现」「文件和
# 打印机共享」「密码保护的共享」。检测 network.sharing-firewall 报这两项没开时给这个按钮（小药箱只查不改防火墙规则）。
