# 查看保存过的 WiFi 密码（info）。脚本：scripts/tools/network/wifi-passwords.ps1
# 1. 无线网络服务（WLAN AutoConfig，wlansvc）没装或没运行，或者没有一块没被禁用的物理无线网卡 → no-wifi
#    （没有无线网卡的台式机、服务器、CI 机器都是这样），不报错。
# 2. 用 netsh wlan export profile key=clear folder=<临时文件夹> 导出所有保存过的 WiFi（管理员导出时密码是明文），
#    读导出的 XML 文件，不解析 netsh 的中文或英文输出；按退出码判断成没成功。
# 3. 导出的文件里是明文密码，所以：临时文件夹放在临时目录下、名字是随机的；导出之前先把它的权限改成只有 SYSTEM 和
#    Administrators 能访问（不继承上级的权限），再读回来确认；读完以后不管成功失败都把整个文件夹删掉，
#    删不掉就报错，提醒用户手动删。密码和 XML 的内容不会出现在事实和报错信息里。
#    脚本被强行结束时（超时、小药箱被关掉）finally 来不及执行，所以每次运行一开始先删掉以前留下的导出文件夹：
#    只删临时目录下名字正好是 medkit-wifi-<32 位小写十六进制> 的、真正的文件夹（不是链接）、里面只有文件的；
#    别的一律不碰。删不掉同样报错。
# 每个 WiFi 一张表（两块无线网卡上的同一个 WiFi 只列一次）：
#   密码：遮住，点「显示」才看得到，也不会被「复制全部」带上；没有密码时写明原因（开放网络、用账号登录的网络、
#         没保存、读不出来）；
#   加密方式：按配置里的 authentication / encryption / useOneX 分类。
# 结果：found（事实 count）/ found-partial（有的导出文件没读出来，事实 skipped）/ none / no-wifi，都是 ok；
#       none-readable：导出了 skipped 个，一个都没读出来（unknown，不能说成「没有保存过 WiFi」）。
# 待真机验证：中文名字的 WiFi 显示是否正常；有无线网卡但一个 WiFi 都没保存过时 netsh 的退出码（现在按 0 处理，
# 不是 0 会显示「没能读出来」），见 docs/real-machine-checklist.md。
id: network.wifi-passwords
schema_version: 1
group: info
title: { zh-CN: 查看 WiFi 密码 }
description:
  zh-CN: 看看这台电脑连过哪些 WiFi，以及它们的密码。家里来了新手机、新电脑，一时想不起 WiFi 密码时用得上。
category: network
requires_admin: true
timeout_sec: 30
run:
  script: tools/network/wifi-passwords.ps1
results:
  found:
    status: ok
    message:
      zh-CN: "找到 {count} 个保存过的 WiFi。密码先遮住了，点「显示」才能看到；「复制全部」不会带上密码。"
    next:
      zh-CN: 给新手机连 WiFi 时，在手机上选同一个名字的 WiFi，输入这里的密码就行。密码只告诉信得过的人。
  found-partial:
    status: ok
    message:
      zh-CN: "找到 {count} 个保存过的 WiFi，另外还有 {skipped} 个没能读出来，没有列在下面。密码先遮住了，点「显示」才能看到；「复制全部」不会带上密码。"
    next:
      zh-CN: 给新手机连 WiFi 时，在手机上选同一个名字的 WiFi，输入这里的密码就行。密码只告诉信得过的人。要找的 WiFi 不在下面的话，可以过一会儿再点一次试试。
  none-readable:
    status: unknown
    message:
      zh-CN: "这台电脑上保存过 {skipped} 个 WiFi，但一个都没能读出来，所以这里看不到它们的密码。"
    next:
      zh-CN: 可以过一会儿再点一次试试；还是不行的话，请懂哥帮忙看看。
  none:
    status: ok
    message:
      zh-CN: 这台电脑上没有保存过 WiFi（可能一直是插网线上网，或者连过的 WiFi 都被删掉了）。
  no-wifi:
    status: ok
    message:
      zh-CN: 没有找到能用的无线网卡：可能是台式机本来就没有无线网卡，或者无线网卡被禁用了，也可能是系统的无线网络服务没有运行。这种情况下查不了保存过的 WiFi 密码。
    next:
      zh-CN: 如果这台电脑平时能连 WiFi，可以请懂哥在「设备管理器」里看看无线网卡，再看看「WLAN AutoConfig」服务有没有开着。
labels:
  sections:
    wifi: { zh-CN: WiFi }
  rows:
    password: { zh-CN: 密码 }
    security: { zh-CN: 加密方式 }
    join: { zh-CN: 手机扫码连接 }
  values:
    no-password: { zh-CN: 不需要密码（开放网络） }
    account-login: { zh-CN: 没有统一的密码，要用各自的账号登录（一般是单位或学校的网络） }
    not-saved: { zh-CN: 没有保存密码 }
    unreadable: { zh-CN: 保存了密码，但读不出来 }
    wpa3-personal: { zh-CN: WPA3-个人 }
    wpa2-personal: { zh-CN: WPA2-个人 }
    wpa-personal: { zh-CN: WPA-个人（比较旧） }
    wep: { zh-CN: WEP（很旧，不安全） }
    open: { zh-CN: 不加密（开放网络） }
    owe: { zh-CN: 增强型开放（不用密码，但会加密） }
    enterprise: { zh-CN: 企业级（用账号登录） }
    other: { zh-CN: 其他 }
references:
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/netsh-wlan
  - https://learn.microsoft.com/en-us/windows/win32/nativewifi/wlan-profileschema-elements
  - https://learn.microsoft.com/en-us/windows/win32/nativewifi/wlan-profileschema-authencryption-security-element
  - https://learn.microsoft.com/en-us/windows/win32/nativewifi/wlan-profileschema-sharedkey-security-element
  - https://learn.microsoft.com/en-us/windows/win32/fwp/wmi/netadaptercimprov/msft-netadapter
