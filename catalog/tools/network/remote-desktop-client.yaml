  zh-CN: 打开 Windows 自带的「远程桌面连接」：在「计算机」里填要连的那台电脑的名字（在那台电脑的「设置 → 系统 → 远程桌面」里能看到），点「连接」，再输入那台电脑上的用户名和密码。
