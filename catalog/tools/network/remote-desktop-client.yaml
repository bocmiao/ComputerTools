# 打开「远程桌面连接」（open：mstsc.exe），Windows 自带的远程桌面客户端：填要连的那台电脑的名字（或者 IP 地址），点「连接」，
# 再输入那台电脑上账户的用户名和密码（微软《在电脑上启用远程桌面》「远程连接到设备」）。「显示选项」里能删掉保存错的凭据。
