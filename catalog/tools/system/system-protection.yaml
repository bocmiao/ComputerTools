# 打开「系统属性」的「系统保护」页（open：SystemPropertiesProtection.exe，微软《Executing Control Panel Items》里的命令）。
# 在这里给 C 盘打开系统保护（「配置 → 启用系统保护」，调最大使用量），也能手动「创建」还原点、打开「系统还原」。
# 小工具「创建还原点」建不了（系统保护没开）时给这个按钮。
