# 打开「ClearType 文本调谐器」（open：System32 下的 cttune.exe，控制面板里「调整 ClearType 文本」打开的就是它；
# Windows 测试里核对它在不在、能不能打开）。ClearType 是 Windows 让屏幕上的字边缘更平滑、更清楚的技术（微软 Learn
# 《ClearType Antialiasing》），被「优化」软件关掉或者没调好时，字看起来发虚、边上带彩色毛边。用法照微软问答里的回答：
# 勾上「启用 ClearType」，每一页点看着最清楚的那段字，最后点「完成」。症状「字发虚、软件界面模糊」里用。
