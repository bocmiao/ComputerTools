# 打开「系统属性」的「高级」页（open：SystemPropertiesAdvanced.exe，微软《Executing Control Panel Items》里的命令）。
# 点下面的「环境变量」改 Path、PATHEXT 这些：上面是当前用户的，下面是整台电脑的（改下面的要管理员权限）。
# 检测 system.command-path 查出用户自己的 PATHEXT、软件的文件夹被 Path 覆盖掉时给这个按钮。
