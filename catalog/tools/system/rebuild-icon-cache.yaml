  - https://learn.microsoft.com/en-us/answers/questions/3907166/deleted-my-iconcache-db-and-now-i-dont-have-any-ic
  - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-2000-server/cc939703(v=technet.10)
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.management/stop-process
