title: { zh-CN: 检查并修复系统文件 }
description:
  zh-CN: 打开一个命令行窗口，依次运行 Windows 自带的两个修复工具：先用 DISM 修复系统映像（从 Windows 更新下载好的文件，要联网），再用 SFC 检查系统文件，把坏了的换成好的。一共要 10 到 30 分钟，进度一直显示在窗口里，中途别关窗口。系统自带的程序打不开、老是报错、更新总装不上时用。最后看到「未找到任何完整性冲突」是没问题；「找到了损坏文件并成功修复了它们」要重启电脑；「无法修复其中某些文件」请懂哥看看。
