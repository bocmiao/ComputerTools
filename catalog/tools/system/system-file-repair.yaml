# 检查并修复系统文件：在一个新的命令行窗口里依次运行 Windows 自带的两个修复工具（微软《使用系统文件检查器工具修复
# 丢失或损坏的系统文件》推荐的顺序）：先 DISM /Online /Cleanup-Image /RestoreHealth（用 Windows 更新修复系统映像，
# 要联网），再 sfc /scannow（检查受保护的系统文件，坏了的换成映像里好的）。命令行窗口一直开着，进度和结果都在里面；
# 程序都用 System32 下的绝对路径（见 tools.rs 的 console_command_line）。DISM 失败了（比如没联网）sfc 照样运行。
id: open.system-file-repair
