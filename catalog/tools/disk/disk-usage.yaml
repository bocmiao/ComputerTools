  values:
    elsewhere: { zh-CN: 在别的盘上 }
    unknown: { zh-CN: 没查出来 }
    not-counted: { zh-CN: 没来得及数 }
    unfinished:
      zh-CN: 文件太多，1 分钟内没数完。标着「没数完」的几项实际比写的还多；过一会儿再点「重新查看」，第二次一般快得多。
    no-profile:
      zh-CN: 没找到正在用这台电脑的账户的文件夹，所以下面没有桌面、下载、微信这些，只列出了系统的部分。
    wechat-both:
      zh-CN: 新旧两版微信的文件夹都还在。升级到 4.x 以后，旧版的文件夹不会自动删掉：先确认新版微信里能看到以前的聊天记录，再在新版微信的「设置 → 存储空间」里清理旧版本的数据，不要直接删文件夹。
    advice-cleanup:
      zh-CN: 打开「设置 → 系统 → 存储 → 临时文件」勾选后删除，或者用「磁盘清理」→「清理系统文件」。「下载」那一项是你自己下载的东西，别跟着勾。
    advice-recycle-bin:
      zh-CN: 先打开回收站看看有没有还要的，确认都不要了再清空。清空以后就找不回来了。
    advice-hibernation:
      zh-CN: 给「休眠」和「快速启动」用的。小药箱以后会加一键「缩小休眠文件」；现在想缩小，可以请懂哥在管理员终端里运行 powercfg /h /type reduced（缩小以后不能再「休眠」，快速启动照常）。
    advice-windows-old:
      zh-CN: 升级或重装系统时留下的旧系统。先打开 Windows.old 里的 Users 文件夹，看看有没有自己的文件，要的先拷出来；再用「磁盘清理」→「清理系统文件」勾选「以前的 Windows 安装」删掉。删了就找不回来了。
    advice-chat:
      zh-CN: 在微信、QQ 自己的「设置」里清理缓存，或者把存储位置换到别的盘（微信在「存储空间」或「文件管理」里，QQ 在「存储管理」里）。聊天记录不要自己到文件夹里删。
    advice-user-files:
      zh-CN: 打开这几个文件夹按大小排序，不要的大文件删掉，要留的搬到别的盘（比如 D 盘）。
