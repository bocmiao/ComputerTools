    wechat3_partial: { zh-CN: 微信（3.x 旧版；没数完，至少有） }
    wechat4: { zh-CN: 微信（4.x 新版） }
    wechat4_partial: { zh-CN: 微信（4.x 新版；没数完，至少有） }
