    windows_old_partial: { zh-CN: 旧系统（Windows.old；没数完，至少有） }
    memory_dump: { zh-CN: 内存转储文件（蓝屏时留下的） }
    memory_dump_partial: { zh-CN: 内存转储文件（没数完，至少有） }
