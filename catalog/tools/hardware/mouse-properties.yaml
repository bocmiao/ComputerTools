# 打开控制面板的「鼠标属性」（open：control.exe /name Microsoft.Mouse，微软《Canonical Names of Control Panel Items》）。「按钮」页有
# 双击速度（旁边的文件夹图标能试双击）、单击锁定；「指针选项」页有指针速度、提高指针精确度、自动移到默认按钮、显示指针轨迹。
