# 症状：输入法不见了、打不出中文（调研 S03 的一部分）。检测 system.input-method 查三样：登录时启动输入法的
# 计划任务 MsCtfMonitor 有没有被「优化」软件关掉（能一键恢复，能撤销）、输入法的后台程序 ctfmon 在不在运行
# （小工具「重启输入法」）、语言列表里有没有中文（给「设置」的入口）。其余给图文指引。
id: input-method
schema_version: 1
title: { zh-CN: 输入法不见了、打不出中文 }
summary:
  zh-CN: 右下角的输入法图标不见了，切换不出中文，只能打英文，或者输入法的候选框卡住不动。
keywords:
  - 输入法不见了
  - 输入法没了
  - 输入法消失
  - 输入法图标不见了
  - 打不出中文
  - 不能打中文
  - 打不了中文
  - 只能打英文
  - 切换不了输入法
  - 输入法切换不出来
  - 输入法切不出来
  - 中文输入法没了
  - 拼音输入法不见了
  - 微软拼音不见了
  - 搜狗输入法不见了
  - 输入法卡住
  - 候选框不见了
causes:
  - zh-CN: 登录时启动输入法的计划任务被「优化」类软件关掉了
  - zh-CN: 输入法的后台程序（ctfmon）卡住或者没在运行
  - zh-CN: 语言列表里没有中文，或者中文输入法被删掉了
  - zh-CN: 不小心切到了英文模式（按了 Shift 或者 Ctrl + 空格）
maturity: semi
steps:
  - check: system.input-method
guide:
  zh-CN: |
    先看上面的检查结果，按提示处理。

    检查都正常的话，试试这几样：

    1. 先点一下要打字的地方，再按 Win + 空格（或者 Ctrl + Shift）切换输入法；输入法里按一下 Shift 切换中英文（输入法图标上显示「中」才是中文）。
    2. 用的是搜狗、QQ、微信输入法这类的：在它自己的设置里点「修复」，或者重新安装一遍。
    3. 只在某一个软件里打不了中文、别的地方正常：把这个软件关掉重开；以管理员身份运行的软件有时切不了输入法。
    4. 输入法的候选框卡住不动：点小药箱的「重启输入法」，或者注销再登录。
    5. 还是不行，请懂哥帮忙看看。
links: ["tool:system.restart-ime"]
