# 症状：软件、游戏闪退、卡死（「已停止工作」「没有响应」、玩着玩着就退回桌面）。查可靠性记录里最近的闪退次数、VC++ 运行库、
# 设备和驱动（显卡没驱动、出错）；小工具「最近闪退的软件」按出错的模块说出多半是显卡驱动、运行库、叠加层、输入法、反作弊
# 还是软件自己。指引按这些原因分开写，另加游戏平台的「验证文件完整性」、杀毒拦截、温度和超频、兼容模式。
id: app-crash
schema_version: 1
title: { zh-CN: 软件、游戏闪退、卡死 }
summary:
  zh-CN: 软件、游戏用着用着就退回桌面，弹出「已停止工作」，或者窗口卡住、标题上写着「未响应」。
keywords:
  - 闪退
  - 软件闪退
  - 游戏闪退
  - 打开就闪退
  - 玩着玩着闪退
  - 自动关闭
  - 自己关掉
  - 退回桌面
  - 崩溃
  - 软件崩溃
  - 游戏崩溃
  - 已停止工作
  - 停止工作
  - 未响应
  - 没有响应
  - 程序没有响应
  - 卡死
  - 游戏卡死
  - appcrash
  - 应用程序错误
  - c0000005
  - "0xc0000005"
  - c0000409
  - "0xc0000409"
  - c000001d
  - e0434352
causes:
  - zh-CN: 显卡驱动太老、没装好，或者新驱动和游戏不兼容
  - zh-CN: VC++ 运行库、DirectX 老组件、.NET 缺了或者坏了
  - zh-CN: 叠加层和录屏、音效软件插进了游戏（Steam、Discord、NVIDIA、RivaTuner、OBS、微星的 Nahimic 音效）
  - zh-CN: 输入法和游戏冲突（第三方输入法常见）
  - zh-CN: 软件、游戏的文件缺了或者坏了，或者被杀毒软件拦了
  - zh-CN: 电脑过热、超频、内存不稳定
maturity: semi
steps:
  - check: system.reliability-recent
  - check: system.vc-runtime
  - check: hardware.device-problems
guide:
  zh-CN: |
    先点下面的「最近闪退的软件」，看闪退的是哪个软件、「多半是」哪一类原因，再按下面对应的一条处理：

    1. 显卡驱动：先用 Windows 更新（「可选更新」里的「驱动程序更新」）；游戏常闪退的，到显卡厂商（NVIDIA、AMD、Intel）官网下载最新的驱动装上；刚更新完驱动就开始闪退的，在设备管理器里显卡的「属性 → 驱动程序」点「回退驱动程序」。
    2. 运行库：点「安装微软 VC++ 运行库」；缺 d3dx9、xinput1_3 这类文件的，装「DirectX 最终用户运行时」；.NET 的，更新这个软件，或者在「启用或关闭 Windows 功能」里确认 .NET 装着。
    3. 叠加层、录屏、音效软件：先把 Steam、Discord、NVIDIA GeForce Experience 的游戏内叠加层关掉，退出 RivaTuner / 微星小飞机、OBS、雷蛇和微星的音效软件（Nahimic）再试。
    4. 输入法：进游戏前按 Shift 切到英文，或者把默认输入法换成微软拼音再试。
    5. 软件自己的问题：更新到最新版；游戏在 Steam、WeGame、Epic 这些平台里「验证游戏文件完整性」或者「修复」；还不行就卸载重装。杀毒软件拦了的，在它的「隔离区」「信任区」里看看。
    6. 处理器不支持（错误代码 c000001d）：这个版本的软件要比较新的处理器（比如支持 AVX），换老一点的版本，或者换电脑。
    7. 各种软件都闪退、还经常蓝屏：可能是过热、超频或者内存的问题。把超频改回默认，清一清风扇的灰，用小工具「Windows 内存诊断」查一下内存。
    8. 老游戏：右键游戏的快捷方式 →「属性」→「兼容性」，勾上「以兼容模式运行这个程序」，选 Windows 7 试试；也可以勾上「以管理员身份运行此程序」。

    都不行的话，把「最近闪退的软件」里那个软件的出错模块和错误代码截图，发给懂哥或者游戏的客服。
