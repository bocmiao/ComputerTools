# 症状：双击程序提示「此应用无法在你的电脑上运行」（报错截图对症状时 20 条常见报错里没对上的一条）。页面上有「看看这个程序
# 能不能在这台电脑上运行」（界面按症状 id 放进来，见 app/src/views/SymptomsView.vue；后端 medkit_core::exe_info 照微软
# 《PE Format》只读文件头）：没下载完整、16 位的老程序（微软：64 位和 ARM 版的 Windows 没有 NTVDM）、DLL、给别的处理器的
# 版本（ARM64 的在 x64 电脑上、x64 的在 32 位 Windows 或者 Windows 10 的 ARM 电脑上）、根本不是程序（网页、压缩包、MSI）。
id: app-cannot-run
schema_version: 1
title: { zh-CN: 双击程序提示「此应用无法在你的电脑上运行」 }
summary:
  zh-CN: 打开刚下载的软件、安装包时弹出「此应用无法在你的电脑上运行。若要找到适用于你的电脑的版本，请咨询软件发布者」，或者「不是有效的 Win32 应用程序」「不支持的 16 位应用程序」。
keywords:
  - 此应用无法在你的电脑上运行
  - 此应用无法在您的电脑上运行
  - 若要找到适用于你的电脑的版本，请咨询软件发布者
  - 请咨询软件发布者
  - 应用无法在你的电脑上运行
  - 不是有效的 Win32 应用程序
  - 不是有效的win32应用程序
  - 不支持的 16 位应用程序
  - 16位应用程序
  - 与 64 位版本的 Windows 不兼容
  - 安装包打不开
  - 软件装不上
  - arm64版本
  - 32位和64位
  - this app can't run on your pc
  - is not a valid win32 application
  - unsupported 16-bit application
causes:
  - zh-CN: 下载的版本和电脑对不上：ARM64 版装在普通电脑上，或者 64 位的程序装在 32 位的 Windows 上
  - zh-CN: 文件没下载完整，或者下载、拷贝的时候坏了（常见的是文件大小不对、只有几 KB）
  - zh-CN: 下载下来的其实不是程序：下载站的跳转网页、压缩包被存成了 .exe
  - zh-CN: 16 位的老程序（DOS、Windows 3.x 时代的），64 位的 Windows 不能运行
  - zh-CN: 安全软件拦住了，或者程序被病毒感染、改坏了
maturity: guide
guide:
  zh-CN: |
    先用上面的「看看这个程序能不能在这台电脑上运行」选一下那个程序文件，它会说出是哪一种问题、该下载哪个版本。只读文件，不会运行它。

    1. 版本不对：到软件的官网重新下载。普通的 Intel、AMD 电脑选「x64」「64 位」的；电脑是 32 位 Windows 的选「x86」「32 位」的；「ARM64」是给高通骁龙这类 ARM 电脑的。不知道自己的电脑是哪种，看小工具「电脑配置」。
    2. 文件不完整、不是程序：到官网重新下载，别点下载站的「高速下载」「安全下载」按钮（下下来的常是下载器或者网页）。
    3. 16 位的老程序：64 位的 Windows 运行不了，用 DOSBox 这类模拟器，或者找它的新版本。
    4. 文件本身没问题：右键它 →「属性」→「兼容性」，勾上「以兼容模式运行这个程序」试试，或者用下面的「程序兼容性疑难解答」；再用杀毒软件扫一下这个文件。
