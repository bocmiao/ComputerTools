# 症状：软件打不开，提示缺少 dll（「由于找不到 VCRUNTIME140.dll，无法继续执行代码」「计算机中丢失 MSVCP140.dll」
# 「应用程序无法正常启动(0xc000007b)」）。最常见的是没装微软 VC++ 运行库，或者文件被「清理」软件删了：
# 查 system.vc-runtime，给小工具「安装微软 VC++ 运行库」（从微软官网下载，核对签名再装；只自动装 VC++ v14）。
# 别的情况按缺的文件名给图文指引（对照表见 docs/feature-gap-research.md 7.5）：老版本的运行库（120、110、100、90、80，
# 在微软「最新受支持的 VC++ 可再发行程序包」页面里按年份找）、调试版（文件名以 d 结尾，微软不允许分发，没有官方下载）、
# DirectX 的老组件（d3dx9、xinput1_3、xaudio2_7，装「DirectX 最终用户运行时」）、Windows 自带的（d3d11、d3dcompiler_47、
# xinput1_4：查显卡驱动和系统文件）、.NET Framework 3.5 和 DirectPlay（查 system.old-components，给小工具「安装 .NET Framework 3.5」「打开 DirectPlay」）、新的 .NET（hostfxr.dll）、
# api-ms-win-crt 和 ucrtbase（系统文件坏了）、api-ms-win-core（是接口名不是文件：软件要更新版本的 Windows）、
# XNA、OpenAL、PhysX、VB6 的 ocx 控件、软件自己的文件；0xc000007b、并行配置不正确（14001）。
# 提醒别从「dll 下载站」下载单个文件：常夹带病毒，版本不对还会让更多软件打不开。
id: app-missing-dll
