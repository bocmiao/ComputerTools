# 症状：软件打不开，提示缺少 dll（「由于找不到 VCRUNTIME140.dll，无法继续执行代码」「计算机中丢失 MSVCP140.dll」
# 「应用程序无法正常启动(0xc000007b)」）。最常见的是没装微软 VC++ 运行库，或者文件被「清理」软件删了：
# 查 system.vc-runtime，给小工具「安装微软 VC++ 运行库」（从微软官网下载，核对签名再装）。
# 别的情况按缺的文件名给图文指引：老版本的运行库（120、110、100）、DirectX 的老组件（d3dx9、xinput1_3）、
# .NET Framework 3.5（「启用或关闭 Windows 功能」）、新的 .NET、api-ms-win 开头的（系统文件坏了）、软件自己的文件。
# 提醒别从「dll 下载站」下载单个文件：常夹带病毒，版本不对还会让更多软件打不开。
id: app-missing-dll
schema_version: 1
title: { zh-CN: 软件打不开，提示缺少 dll }
summary:
  zh-CN: 打开软件、游戏时弹出「找不到 VCRUNTIME140.dll」「丢失 MSVCP140.dll」「应用程序无法正常启动(0xc000007b)」，或者提示要装 .NET Framework。
