# 症状：某个设备用不了，设备管理器里有黄色感叹号，或者弹出「这个设备无法启动（代码 10）」「Windows 已停止此设备（代码 43）」
# 这类提示。检查就是 hardware.device-problems：哪些设备出错、没装驱动、被禁用、等重启，出错的代码各是什么意思、该怎么办
# （微软《Error codes in Device Manager》，写在那个检测的 fact_labels.error_notes 里）。别的写在图文指引里。
# 关键词里放了设备管理器常见的原话，「按症状修」粘贴报错截图时也靠它们对上。
id: device-error
schema_version: 1
title: { zh-CN: 设备用不了、设备管理器里有黄色感叹号 }
category: hardware
summary:
  zh-CN: 某个设备（网卡、声卡、显卡、摄像头、USB 设备……）用不了，设备管理器里它上面有黄色感叹号，属性里写着「代码 10」「代码 43」「代码 28」这类提示。
