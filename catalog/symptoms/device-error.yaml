causes:
  - zh-CN: 驱动没装、装错了或者坏了（刚重装完系统、刚更新完 Windows 最常见）
  - zh-CN: 设备被人禁用了，或者在 BIOS 里关掉了
  - zh-CN: 插在 USB 口上的设备接触不好、线坏了、供电不够
  - zh-CN: 设备本身坏了（少见，换了驱动、换了口都不行时才这么想）
maturity: semi
steps:
  - check: hardware.device-problems
guide:
  zh-CN: |
    先看上面的检查结果：它会说出是哪几个设备、代码是多少、各该怎么办。

    通用的顺序：

    1. 先重启一次电脑。刚装完驱动、刚更新完 Windows 的，很多是重启一下就好。
    2. 插在 USB 口上的设备（U 盘、手机、摄像头、「未知 USB 设备」）：拔下来，换一个 USB 口、换一根线再插；台式机插到主机背后的口上。
    3. 打开「Windows 更新」检查更新，再看「高级选项 → 可选更新」里有没有这个设备的驱动，有就装上。
    4. 还不行，到电脑（或者主板、显卡）品牌的官网，按型号下载这个设备的驱动重新安装。网卡出问题上不了网的，用手机或另一台电脑下载好再拷过来。
    5. 设备管理器里找不到出问题的设备时，点「查看 → 显示隐藏的设备」。

    换了驱动、换了口都不行，可能是硬件坏了，请懂哥或者售后看看。
links: ["tool:open.device-manager", "tool:settings.windows-update", "tool:settings.optional-updates", "tool:web.oem-drivers"]
