# 症状：快捷键没反应。先查：常用的快捷键有没有被别的程序登记成全局快捷键（system.hotkeys：QQ、微信、钉钉的截图，显卡的热键这些
# 挨个试出来）、粘滞键这些辅助功能（system.keyboard-aids）、Win 键组合键有没有被策略关掉（system.disabled-tools）。
# 指引里再讲：Print Screen 键（微软 KB5028185：Windows 11 更新以后按它默认打开截图工具，在「设置 → 辅助功能 → 键盘」里改；
# 没开的时候按它是把整个屏幕复制到剪贴板，看不到任何反应）、Fn 锁（F1～F12 变成了调音量、调亮度）、笔记本的 Fn 功能键要装品牌的
# 热键驱动、游戏键盘的 Win 键锁、输入法的热键（微软拼音的 Ctrl + Shift + F 是简繁切换）、Ctrl + C / Ctrl + V 不好使。
# 只查不改：占着快捷键的是哪个软件、要不要改，由用户在那个软件里决定。
