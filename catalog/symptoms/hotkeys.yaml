causes:
  - zh-CN: 别的软件把这个快捷键登记成了全局快捷键：QQ、微信、钉钉的截图，截图软件、显卡的热键最常见，按下去只有它收得到
  - zh-CN: Windows 11 更新以后，按 Print Screen 默认打开截图工具；没开这个设置的，按它是把整个屏幕复制到剪贴板，看起来什么都没发生
  - zh-CN: 笔记本按了 Fn 锁，F1～F12 变成了调音量、调亮度（或者反过来）；Fn 组合的功能键要装品牌的热键驱动才管用
  - zh-CN: 游戏键盘开了「锁 Win 键」，或者 Win 键组合键被策略关掉了
  - zh-CN: 输入法把快捷键抢走了（比如微软拼音的 Ctrl + Shift + F 是简繁切换）
  - zh-CN: 粘滞键、筛选键这些辅助功能开着
