guide:
  zh-CN: |
    先看上面的检查：快捷键被别的程序占着的，照提示找到是哪个软件、在它的设置里改掉；粘滞键这些开着的，按提示关掉。

    1. 按 Print Screen（PrtSc）截不了图：Windows 11 更新以后，按它默认打开截图工具，框一块就截下来了；这个设置没开的，按它是把整个屏幕复制到剪贴板，看起来什么都没发生，到微信、画图、Word 里按 Ctrl + V 就粘贴出来了。想改的，在下面的「键盘的辅助功能」里找「使用 Print Screen 键打开屏幕截图」这一项（不同版本的叫法略有不同）。截图软件（QQ、Snipaste 这些）也可能把它占了，在那个软件的设置里看。
    2. F1～F12 按了是调音量、调亮度（或者想调音量却出来 F1～F12）：笔记本多半有 Fn 锁，按一下 Fn + Esc（有的是 Fn + Shift，或者键盘上印着锁和 Fn 的键）切换；有的要在开机进 BIOS 设置里改「Hotkey Mode」「Action Keys Mode」这类选项。
    3. 笔记本 Fn 加功能键调亮度、音量、开关 WiFi 没反应：多半是没装电脑品牌的热键驱动（联想、惠普、戴尔、华硕都有），点下面的「打开电脑品牌官网的驱动下载页」下载安装。
    4. 只有 Win 键、Win + E、Win + D 这些没反应：游戏键盘多半有「锁 Win 键」（键盘上带锁、手柄图标的键，或者 Fn + Win），按一下解开；上面「被停用的系统工具」列出了「Win 键组合键」的，是被策略关掉了，按那里的说法处理。
    5. 快捷键变成了输入法的功能（比如按 Ctrl + Shift + F 字变成了繁体）：在输入法的设置里把用不上的热键关掉；微软拼音的在下面的「语言和输入法」→「中文（简体）」→「语言选项」→「微软拼音」→「按键」里。
    6. Ctrl + C、Ctrl + V 复制粘贴不好使：先在记事本里试一下，记事本里好使的是那个软件自己的问题；都不好使的，关掉最近装的剪贴板、翻译、截图类软件再试，或者重启一次电脑。
    7. 在远程桌面、虚拟机、全屏游戏里按快捷键：Win 键、Alt + Tab 这些可能被发到了那边的电脑上，退出全屏再试。

    都不行的话，把检查结果和你按的是哪个快捷键发给懂哥。
