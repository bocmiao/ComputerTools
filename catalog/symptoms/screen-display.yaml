# 症状：屏幕模糊、字太大太小、分辨率不对或者调不了、接投影仪和第二个显示器没画面、屏幕闪、突然黑一下、屏幕倒过来、调不了亮度。
# 先查显卡驱动（hardware.device-problems：用的是「基本显示适配器」或者没驱动时，分辨率只有几档、调不了亮度、不能接第二个显示器；
# 微软《Windows 中的 Microsoft 基本显示适配器》）。别的给图文指引：分辨率和缩放选「推荐」、个别软件模糊用「替代高 DPI 缩放行为」、
# Win + P 和「检测」、显示器的输入源和独立显卡的接口、闪屏用任务管理器判断是驱动还是软件（微软《排查 Windows 中的屏幕闪烁》）、
# Win + Ctrl + Shift + B 重启显卡驱动（微软的键盘快捷方式列表）、显示方向、亮度键、HDR；颜色不对的转到 screen-colors。
