guide:
  zh-CN: |
    先看上面的检查结果：显卡驱动没装好的，先按提示装好驱动（点「可选更新（驱动程序）」看看有没有显卡的驱动）。驱动没装好之前，分辨率、亮度、第二个显示器很多都调不了。

    然后按遇到的情况处理（「屏幕」设置页、「可选更新」点最下面的按钮就能打开）：

    1. 字、图标发虚：打开「屏幕（分辨率、缩放、多显示器）」，「显示分辨率」选后面写着「推荐」的那一项。只有个别软件发虚的：右键这个软件的快捷方式 →「属性」→「兼容性」→「更改高 DPI 设置」，勾上「替代高 DPI 缩放行为」，下面选「应用程序」，点「确定」以后重新打开这个软件。
    2. 字、图标太大或者太小：同一页里的「缩放」选「推荐」的那一项（一般是 100%、125%、150%），想大一点、小一点再往上下调一档。有的软件要注销再登录才跟着变。
    3. 接了投影仪、第二个显示器没画面，或者两个屏幕显示得不对：按 Win + P，选「复制」（两个屏幕一样）或者「扩展」（两个屏幕接起来用）；在「屏幕」设置里的「多显示器」下面点「检测」。还没有画面：用显示器上的按钮把「输入源」切到线插着的那个口（HDMI、DP 这些）；换一根线、换一个口；台式机有独立显卡的，线要插在独立显卡上（机箱背面靠下、横着的那一排口），不是主板上竖着的那几个口。
    4. 屏幕闪：按 Ctrl + Shift + Esc 打开任务管理器，看它跟着闪不闪。任务管理器也闪，多半是显卡驱动的问题，更新或者重装显卡驱动；任务管理器不闪、别的地方闪，多半是某个软件不兼容（最近装的软件、杀毒软件、桌面美化软件），更新或者卸载它（这是微软给的判断办法）。外接显示器闪的，在「屏幕 → 高级显示设置」里把刷新率选成显示器支持的一档（一般是 60Hz），再换一根线试试。
    5. 突然黑一下、画面卡住不动但是鼠标能动：按 Win + Ctrl + Shift + B，屏幕会黑一下、「嘀」一声，显卡驱动会重新启动，一般就好了。经常这样的，更新显卡驱动。
    6. 画面倒过来、横过来了：在「屏幕」设置里把「显示方向」改回「横向」。
    7. 调不了亮度：笔记本先试试键盘上带太阳图标的键（有的要同时按住 Fn）；「屏幕」设置里也没有亮度条的，多半是显卡驱动没装好（看上面的检查）；台式机接的显示器，亮度要用显示器自己的按钮调。
    8. 打开 HDR 以后画面发白、发灰：在「屏幕」设置里把「使用 HDR」关掉试试。颜色不对、变成黑白、发黄的，看「屏幕突然变成黑白、颜色不对」。
    9. 装显卡驱动：先用 Windows 更新（「可选更新」里的「驱动程序更新」有显卡的就勾上安装）；没有的话，笔记本、品牌机到电脑品牌官网按型号下载，组装机到显卡厂商（NVIDIA、AMD、Intel）的官网下载。装完重启电脑。

    都试过还是不行，拍一张屏幕的照片，连同电脑型号、显示器型号发给懂哥。
