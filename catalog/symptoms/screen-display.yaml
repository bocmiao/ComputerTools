causes:
  - zh-CN: 显卡驱动没装好：Windows 用的是自带的「基本显示适配器」，分辨率只有几档、调不了亮度、接不了第二个显示器，刚重装完系统时很常见
  - zh-CN: 分辨率、缩放没选「推荐」的那一项，字发虚、太大或者太小；个别老软件在高分辨率屏幕上本来就会发虚
  - zh-CN: 投影、多显示器的模式没选对（Win + P），或者线没插好、显示器的输入源不对、线插在了主板上而不是独立显卡上
  - zh-CN: 显卡驱动出错或者和某个软件不兼容，屏幕闪、突然黑一下；刷新率太低、线材不好也会闪
  - zh-CN: 不小心改了显示方向，或者按到了旋转屏幕的快捷键
maturity: semi
steps:
