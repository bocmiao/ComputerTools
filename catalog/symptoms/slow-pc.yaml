# 症状：电脑卡、风扇狂转（调研 S07）。先看 8 秒钟是谁在占用处理器和内存（system.busy：系统自己在查病毒、装更新、
# 建索引的，说清楚等它忙完就好；浏览器、别的程序占得多的，说清楚怎么办），再看几样「一直卡」的硬件原因：
# 内存太小、虚拟内存被关掉了（→ 修复 system.pagefile-auto）、电源计划把处理器压着跑（「节能」计划 → power.balanced-plan，
# 最大处理器状态被调低 → power.processor-full-speed，Windows 11 的「最佳能效」→ 设置里改）、系统装在机械硬盘上、C 盘快满了、硬盘健康。不做「一键加速」「内存释放」，不结束任何程序（计划书第五节）。
id: slow-pc
schema_version: 1
title: { zh-CN: 电脑卡、风扇狂转 }
summary:
  zh-CN: 点什么都要等半天，打字、翻网页一顿一顿的，风扇呼呼转，机身发烫。
keywords:
  - 电脑卡
  - 电脑很卡
  - 电脑好卡
  - 电脑变慢
  - 电脑反应慢
  - 电脑运行慢
  - 卡顿
  - 很卡
  - 一卡一卡
  - 风扇狂转
  - 风扇声音大
  - 风扇一直转
  - 电脑发烫
  - 电脑很烫
  - CPU占用高
  - CPU 100%
  - 内存占用高
  - 内存不够
  - 内存不足
  - 提示内存不足
  - 虚拟内存
  - 游戏闪退
  - 磁盘100%
  - 电脑加速
  - 节能模式
  - 省电模式
  - 处理器降频
  - cpu降频
causes:
  - zh-CN: 系统在后台查病毒、装更新、建搜索索引（一般过一阵就好）
  - zh-CN: 浏览器开了很多标签页，或者同时开着很多软件
  - zh-CN: 内存太小（4 GB 及以下）
  - zh-CN: 虚拟内存被「优化」软件关掉了：内存一用满就提示「内存不足」、卡死、闪退
  - zh-CN: 电源计划为了省电把处理器压着跑：用的是「节能」计划、「最大处理器状态」被「降温」软件调低了，或者 Windows 11 的电源模式是「最佳能效」
  - zh-CN: 系统装在机械硬盘上，或者 C 盘快满了
  - zh-CN: 出风口积了灰，散热不好，处理器过热降速
  - zh-CN: 中了挖矿、广告类的恶意软件
maturity: semi
steps:
  - check: system.busy
  - check: hardware.memory-size
  - check: system.pagefile
    fixes: [system.pagefile-auto]
  - check: system.power-plan
    fixes: [power.balanced-plan, power.processor-full-speed]
  - check: hardware.system-disk-type
  - check: disk.system-free-space
  - check: disk.smart-health
guide:
  zh-CN: |
    先看上面的检查结果：「谁在占用电脑」查的是这 8 秒钟里谁在忙，电脑是一阵一阵卡的，等卡的时候再查一次。

    再试试这几样：

    1. 刚开机、刚装完更新的头十几分钟，系统在后台查病毒、装更新，卡一会儿是正常的，等它忙完。
    2. 关掉不用的软件和浏览器标签页；开机就卡的，看「开机慢」，停用几个不需要一开机就运行的软件。
    3. 风扇一直狂转、机身烫手：清一清出风口的灰；笔记本放在桌子上用，垫高一点，别放在被子、腿上。笔记本插着电源比用电池时快，玩游戏、剪视频时插上电源。
    4. 不要用「一键加速」「内存释放」这类软件：它们结束的程序很快又会自己启动，还可能把系统弄坏。
    5. 用了好几年的老电脑：系统装在机械硬盘上的，换一块固态硬盘（SSD）是最见效的提速办法；内存只有 4 GB 的，加到 8 GB 或者更多。可以请懂哥帮忙看看。
    6. 不认识的程序一直占着处理器，或者什么都没开风扇也狂转，可能中了挖矿、广告类的恶意软件，请懂哥帮忙查一查。
links: ["tool:open.task-manager", "tool:settings.power", "symptom:slow-boot"]
