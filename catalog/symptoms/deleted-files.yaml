causes:
  - zh-CN: 删的时候没进回收站：按了 Shift + Delete、在 U 盘和存储卡上删的、文件太大放不进回收站
  - zh-CN: 回收站被清空了，或者被「清理垃圾」的软件清掉了
maturity: guide
guide:
  zh-CN: |
    按下面的顺序找，前面几步不费事、也不会弄丢什么：

    1. 刚在资源管理器里删的：马上按 Ctrl + Z 撤销删除。
    2. 打开桌面上的「回收站」，找到文件，右键选「还原」，它会回到原来的位置。按 Shift + Delete 删的、U 盘和存储卡上删的、太大的文件不进回收站，直接看下一步。
    3. 在原来放文件的文件夹上点右键 →「属性」→「以前的版本」：打开过「文件历史记录」或者系统保护的电脑，这里可能有以前的版本，选中打开看看，是要找的就「还原」。
    4. 在 OneDrive、百度网盘、坚果云这类网盘的同步文件夹里删的：到网盘的网页版或者客户端里找「回收站」（OneDrive 个人账户的回收站保留 30 天）。
    5. 从微信、QQ 聊天里存下来的文件：回到那条聊天里重新点开、下载（文件过期了就下不了）。

    都找不到的话，用恢复工具：

    6. 马上停止往那个盘里存东西：别在那个盘里下载、装软件，最好先少用电脑。删掉的文件占的地方随时会被新文件盖掉，盖掉就找不回来了。
    7. 用微软免费的「Windows File Recovery」找：在下面的「拼出恢复命令」里选好文件原来在哪个盘、要找哪些文件、存到哪个盘，复制拼好的命令，再点「打开 Windows File Recovery」（没装的会打开 Microsoft Store 里它的页面，要 Windows 10 2004 或者更新的版本），弹出提示时点「是」，把命令粘贴进去回车，问要不要继续时按 y。找回来的文件必须存到另一个盘（U 盘、移动硬盘或者别的分区），在那个盘新建的 Recovery_日期_时间 文件夹里。
    8. 固态硬盘（SSD）上删的文件，系统很快就会把那块地方清掉，找回来的希望很小；机械硬盘、U 盘、存储卡的机会大一些。
    9. 硬盘摔过、有咔咔的响声、电脑认不出这块盘的：别自己反复扫描（会加重损坏），直接找专业的数据恢复。

    以后防备：重要的文件打开「文件历史记录」备份到移动硬盘，或者放在网盘的同步文件夹里；在「常用设置」里打开「删除文件前先问一下」，不小心按到 Delete 也来得及反悔。
