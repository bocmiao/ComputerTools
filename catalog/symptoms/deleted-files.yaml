# 症状：误删了文件（清空了回收站、Shift + Delete、U 盘上删的），想找回来。只给指引，按「先找不费事的地方，再用恢复工具」
# 的顺序：撤销、回收站、「以前的版本」、网盘的回收站（微软：OneDrive 个人账户的回收站保留 30 天）、聊天软件里重新下载；
# 都没有的，先别再往那个盘写东西，用微软的 Windows File Recovery（winfr，Microsoft Store 免费）把文件恢复到另一个盘
# （微软《Windows File Recovery》：少用电脑，删掉的地方随时会被新文件覆盖，固态硬盘尤其如此；存到别的盘）。
# 页面上（手动步骤下面）有「拼出恢复命令」（app/src/components/FileRecovery.vue，照用户选的拼 winfr 的命令，参考了
# kil0bit-kb/winfr-pro 的做法，MIT）和打开它的小工具 system.file-recovery（没装的打开商店页面）。小药箱不替用户运行 winfr。
