causes:
  - zh-CN: 驱动程序出错（最常见）：新装或者更新了显卡、网卡驱动；安全软件、游戏加速器、反作弊程序也会装驱动
  - zh-CN: 内存条有问题、接触不好，或者超频不稳定
  - zh-CN: 硬盘有坏道、快坏了
  - zh-CN: 过热、供电不足（没有蓝屏就突然黑屏重启、关机的常见原因），笔记本电池老化
  - zh-CN: 系统文件损坏
  - zh-CN: Windows 更新装完以后自己重启（这个不是故障）
