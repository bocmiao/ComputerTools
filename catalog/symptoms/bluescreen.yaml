# 症状：电脑蓝屏、自己重启、自己关机。先看最近 7 天的崩溃和蓝屏（system.reliability-recent，有蓝屏时链接到小工具
# 「最近的蓝屏」：按终止代码说原因和办法，也分得清意外关机、Windows 更新重启），再看几样常见的硬件原因：设备和驱动、
# 硬盘健康、硬盘读写错误、笔记本电池；虚拟内存被关掉了的（蓝屏记不下原因）能一键改回自动管理。蓝屏本身没有一键修复，给图文指引。
