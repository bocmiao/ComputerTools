causes:
  - zh-CN: 设置被改了：左右键互换、滚轮一次滚 0 行、开了「单击锁定」「指针轨迹」「自动跳到默认按钮」，双击速度、指针速度调得太偏
  - zh-CN: 鼠标的微动开关用久了老化，点一下会连击两下，拖着拖着就松开了
  - zh-CN: 无线鼠标没电、接收器离得远或者没插好，蓝牙鼠标掉了配对；USB 口接触不好
