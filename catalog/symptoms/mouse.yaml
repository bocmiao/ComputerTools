guide:
  zh-CN: |
    先看上面的检查：设置被改了的，按提示改回来。

    1. 鼠标完全没反应、指针不动：先换一个 USB 口（台式机插机箱后面的口）；无线鼠标换上新电池，把接收器插到离鼠标近的口；蓝牙鼠标在「设置 → 蓝牙和设备」里删掉，重新配对。手边有别的鼠标的换一个试试，能用就是原来的鼠标坏了。笔记本可以先用触摸板操作。
    2. 想知道是鼠标坏了还是设置问题：用下面的「鼠标测试」，单击、双击、按住拖动各试几下，看它记下来的次数对不对。
    3. 单击变双击、拖着拖着就松开了：上面的检查说双击速度正常的，多半是鼠标的微动开关老化了（用了几年的鼠标很常见），换个鼠标。另外看看资源管理器的「…」→「选项」→「常规」里，「打开项目的方式」是不是选了「通过单击打开项目」，改回「通过双击打开项目」。
    4. 指针乱跳、自己漂：别在玻璃、反光的桌面上用，垫个鼠标垫或者一张白纸，擦擦鼠标底部的镜头；笔记本接了鼠标的，在「触摸板设置」里取消「连接鼠标时让触摸板保持打开状态」，免得手掌碰到触摸板。
    5. 指针太快太慢、滚轮滚得太多太少：在下面的「鼠标」设置里调「鼠标指针速度」和滚轮一次滚动的行数。
    6. 玩游戏时准星飘、甩不准：在「鼠标属性」→「指针选项」里取消「提高指针精确度」（有的版本写「提高指针精度」）试试。
    7. 装了罗技、雷蛇这些鼠标的软件的：按键、速度可能在它里面被改过，打开它恢复默认。设备管理器里「鼠标和其他指针设备」下有黄色感叹号的，看上面「设备和驱动」的检查。
