# 症状：鼠标不听使唤：左右键反了、单击变双击、拖东西松不开、指针乱跳、太快太慢、滚轮不滚、完全没反应。先看鼠标的设置
# （hardware.mouse-settings：左右键互换、滚轮 0 行、单击锁定、自动跳到默认按钮、指针轨迹、双击和指针速度太偏），再看设备和
# 驱动（hardware.device-problems）。指引：没反应的先查接收器、电池、USB 口、蓝牙配对；单击变双击分清是微动开关老化还是「通过
# 单击打开项目」的设置；指针乱跳看鼠标垫、镜头、笔记本的触摸板误触；游戏里准星飘看「提高指针精确度」（微软《更改鼠标设置》）。
# 按钮：「鼠标」设置、「鼠标属性」、工具箱里的鼠标测试（test:mouse）、设备管理器。
