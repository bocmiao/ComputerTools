# 症状：任务栏卡住、开始菜单打不开、右下角图标不见了（调研 A7–A9）。
# 查：右下角的图标、任务栏的右键菜单和设置、开始菜单有没有被策略去掉或者锁住（system.taskbar-policies，只检测）；开始菜单在这个
# 账户里装好了没有、最近开始菜单、搜索、通知中心、资源管理器有没有崩溃或者卡住（system.start-menu，按微软《Troubleshoot Start
# menu errors》的步骤）；Win 键这类系统开关有没有被停用（system.disabled-tools）。小工具「重启开始菜单和搜索」只重启开始菜单、
# 搜索和通知中心，任务栏和打开的窗口不受影响；「重启资源管理器」是再重一点的一步。
