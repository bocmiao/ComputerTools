guide:
  zh-CN: |
    先看上面的检查结果，按提示处理。检查都正常的话，按顺序试：

    1. 开始菜单、搜索打不开或者卡住：点下面的「重启开始菜单和搜索」；还不行点「重启资源管理器」（任务栏会消失几秒再回来）。
    2. 整个任务栏卡住点不动：按 Ctrl + Shift + Esc 打开任务管理器，在「进程」里找到「Windows 资源管理器」，右键选「重新启动」，和小药箱的「重启资源管理器」一样。
    3. 还不行就注销再登录，或者点「重启」。不要用「关机」再开机：开着「快速启动」时，关机再开机不会把系统全部重新加载一遍。
    4. 右下角的图标不见了：先点右下角的小箭头「^」，图标可能被收进去了，拖回任务栏就行。Windows 10 在「任务栏设置」里点「打开或关闭系统图标」，把时钟、音量、网络、电源打开；Windows 11 的音量、网络、电池图标没有开关，不见了多半是策略（看上面的检查）或者资源管理器卡住了，别的软件的图标在「任务栏设置 → 其他系统托盘图标」里打开。
    5. 时间和日期不见了：Windows 11 看看「设置 → 时间和语言 → 日期和时间」（有的版本在「任务栏设置 → 任务栏行为」）里「在系统托盘中显示时间和日期」有没有被关掉；Windows 10 打开了「使用小任务栏按钮」时只显示时间、不显示日期。
    6. 任务栏一会儿就缩没了，或者跑到了屏幕边上：在「任务栏设置」里关掉「自动隐藏任务栏」，Windows 10 在「任务栏在屏幕上的位置」里改回「底部」。
    7. 开始菜单打开是空白的、一直转圈，或者提示「关键错误：开始菜单无法工作」：点「检查并修复系统文件」（要二十分钟左右），做完重启；还不行，新建一个用户账户登录试试，新账户里正常的，就是这个账户的设置坏了。
    8. 装了美化任务栏、开始菜单的软件（StartAllBack、ExplorerPatcher、Start11 这些）以后出现的，先卸载这个软件；刚装了 Windows 更新以后出现的，看「装了更新以后出问题」。
    9. 右下角的「中」「英」输入法图标不见了，看「输入法不见了」；整个桌面和任务栏都不见了、只有鼠标，看「开机黑屏，只有鼠标」。
