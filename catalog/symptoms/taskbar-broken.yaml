causes:
  - zh-CN: 开始菜单、搜索或者资源管理器（任务栏就是它）卡住了，或者一直在崩溃
  - zh-CN: 「优化」软件、网上的教程或者病毒用策略去掉了右下角的图标、任务栏的右键菜单，锁住了任务栏和开始菜单
  - zh-CN: 开始菜单没有在这个账户里装好，或者被「精简」工具删掉了
  - zh-CN: 图标被收进了右下角的小箭头「^」里，或者任务栏被设成了自动隐藏
  - zh-CN: 刚装的更新、美化任务栏和开始菜单的软件不兼容
