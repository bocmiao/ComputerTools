# 症状：键盘按了没反应（调研 S04）。先查最常见的三样「不小心按出来的」辅助功能：筛选键、粘滞键、鼠标键
# （内置检测 system.keyboard-aids，读的是这次登录里实际生效的状态），再看设备管理器里有没有出问题的设备；
# 都没问题的，按指引排查硬件、Num Lock、Fn 锁和输入法。
# 小药箱不替用户改这三样的开关：关掉它们用「设置」里的开关或者同一个快捷键，检测结果里给入口。所以 maturity 是 semi。
id: keyboard
schema_version: 1
title: { zh-CN: 键盘按了没反应 }
summary:
  zh-CN: 键盘打不了字、按键要按住很久才出字、字母莫名变成大写，或者右边的数字键按了不出数字。
keywords:
  - 键盘没反应
  - 键盘按了没反应
  - 键盘失灵
  - 键盘打不了字
  - 键盘不能用
  - 键盘用不了
  - 键盘坏了
  - 按键没反应
  - 打字没反应
  - 打不出字
  - 按键要按很久
  - 按住才能打字
  - 筛选键
  - 粘滞键
  - 鼠标键
  - 小键盘不能用
  - 数字键不能用
  - 数字键按了没反应
  - 字母都是大写
  - 连按shift
  - shift弹窗
  - win键没反应
  - win键失灵
  - win+e没反应
  - win+d没反应
causes:
  - zh-CN: 不小心打开了「筛选键」（按住右 Shift 键 8 秒）：短按、连按都被忽略
  - zh-CN: 不小心打开了「粘滞键」（连按 5 次 Shift 键）：Shift、Ctrl、Alt 按一下就算按着，字母莫名变成大写
  - zh-CN: 按了 Caps Lock（大写锁定），打出来全是大写字母
  - zh-CN: 小键盘的 Num Lock 没开，或者打开了「鼠标键」：数字键不出数字
  - zh-CN: 笔记本按了 Fn 锁，上面一排键变了功能
  - zh-CN: 无线键盘没电、没配对好，或者 USB 口接触不良
  - zh-CN: 输入法卡住了，只在某个软件里打不了字
  - zh-CN: 游戏键盘开了「锁 Win 键」，或者 Win 键组合键被策略关掉了
maturity: semi
steps:
  - check: system.keyboard-aids
    stop_on: [advice]
  - check: hardware.device-problems
  - check: system.disabled-tools
guide:
  zh-CN: |
    先看上面的检查结果：筛选键、粘滞键、鼠标键开着的，按提示关掉就好。

    都没开的话，一样一样排除：

    1. 字母全是大写：看看是不是按了 Caps Lock（大写锁定）键，键盘上它的指示灯亮着就是开了，再按一下就好。
    2. 只有右边的数字键不出数字：按一下 Num Lock 键（键盘上的指示灯会亮），再试。
    3. 笔记本：有的机型按了 Fn 锁（比如 Fn + Esc）以后，最上面一排键变了功能，试试按住 Fn 再按，或者再按一次 Fn 锁；有的笔记本还有锁键盘的快捷键，看看说明书。
    4. 台式机的 USB 键盘：拔下来换一个 USB 口，直接插在机箱后面，不要接在扩展坞、延长线上；有别的键盘就换一个试试。
    5. 无线键盘、蓝牙键盘：换新电池或者充上电；接收器换一个 USB 口；蓝牙键盘在「设置 → 蓝牙和其他设备」里删掉，再重新配对。
    6. 只在某一个软件里打不了字、别的地方正常：多半是输入法卡住了。按 Win + 空格切换一下输入法，或者关掉这个软件重新打开；打不出中文的，看「输入法不见了、打不出中文」。
    7. 只有 Win 键、Win + E、Win + D 这些组合键没反应：游戏键盘多半有「锁 Win 键」的功能（键盘上带锁、手柄图标的键，或者 Fn + Win），按一下解开；检查结果里「被停用的系统工具」列出了「Win 键组合键」的，是被策略关掉了，按那里的说法处理。
    8. 有线键盘（USB 或者圆口的 PS/2）：开机时按 Del 或 F2 能进 BIOS 设置，说明键盘本身是好的，问题在系统里，可以请懂哥看看。蓝牙键盘进系统以前本来就用不了，开了快速启动的电脑也可能来不及按，这两种情况没法这样判断，换一个键盘试试更直接。

    急着打字的话，可以先用鼠标打开「设置 → 辅助功能 → 键盘」（小工具里的「键盘的辅助功能」），打开「屏幕键盘」，用鼠标点着打字。
