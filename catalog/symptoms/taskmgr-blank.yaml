# 症状：任务管理器的「性能」页没有图表、CPU 一直是 0%，资源监视器打不开、性能监视器没有数据。先看性能计数器有没有被关掉
# （system.perf-counters），再照微软《Manually rebuild performance counters》重建（一键处理 system.perf-counters-rebuild）。
# 还不行的，修复系统文件、看 WMI（symptom:wmi-broken）。
id: taskmgr-blank
schema_version: 1
title: { zh-CN: 任务管理器「性能」页空白、CPU 一直 0% }
category: system
summary:
  zh-CN: 任务管理器的「性能」页没有图表，CPU、磁盘一直显示 0%；资源监视器打不开，性能监视器里没有数据。
