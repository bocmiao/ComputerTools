  - zh-CN: 系统文件损坏
maturity: semi
steps:
  - check: system.perf-counters
guide:
  zh-CN: |
    1. 先看上面的检查：有计数器被关掉的，点「重建性能计数器」；没有被关掉、但「性能」页还是空的，也点「重建性能计数器」重建一次。做完重启电脑。
    2. 重启以后还是空的：点「检查并修复系统文件」，等它跑完再重启，再重建一次性能计数器。
    3. 只是任务管理器里某一项不显示（比如 GPU、磁盘）：在「性能」页的左边列表上点右键，看看是不是把它隐藏了；显卡的要装好显卡驱动。

    都不行的话，把检查结果和任务管理器的截图发给懂哥。
