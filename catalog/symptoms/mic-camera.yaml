guide:
  zh-CN: |
    先看上面的检查结果：隐私开关关着的，按提示打开，再把开会、聊天的软件关掉重开。

    开关都开着的话，一样一样排除：

    1. 在开会软件自己的设置里看看选的是哪个麦克风、摄像头（腾讯会议、钉钉在「设置 → 音频 / 视频」里）。插着耳机的，麦克风要选耳机上的那个。
    2. 笔记本的摄像头：看看摄像头旁边有没有小滑块（遮挡片）没拨开；有的机型用键盘最上面一排带摄像头图标的键（有时要和 Fn 一起按）开关摄像头。
    3. 摄像头同一时间只能给一个软件用：把别的开会软件、「相机」应用关掉，再打开要用的那个。
    4. 麦克风：打开「设置 → 系统 → 声音」，在「输入」里选你要用的麦克风，对着它说话，看音量条动不动；不动的话调高「输入音量」。
    5. 外接的 USB 摄像头、耳机：换一个 USB 口，直接插在电脑上，不要接在扩展坞、延长线上。台式机的耳机麦克风要插在粉色的孔里；只有一个插头（带三道环）的耳机要插在耳麦二合一的孔上。
    6. 都试过还不行，可能是驱动的问题，请懂哥帮忙看看。
links: ["tool:settings.sound", "tool:settings.privacy-microphone", "tool:settings.privacy-camera"]
