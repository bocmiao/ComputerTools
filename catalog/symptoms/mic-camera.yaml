# 症状：麦克风、摄像头用不了（调研 S03 的一部分）。先查 Windows 的隐私开关（最常见：「允许桌面应用访问
# 麦克风 / 相机」被关了，腾讯会议、微信、钉钉这些下载安装的软件就用不了），再看设备管理器里有没有出问题的设备；
# 其余（会议软件里选错了设备、笔记本的摄像头开关和遮挡片、被别的软件占着）给图文指引。
# 隐私开关只检测、不替用户改，结果里给「设置」里对应页面的入口。所以 maturity 是 semi。
