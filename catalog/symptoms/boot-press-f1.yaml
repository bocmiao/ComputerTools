# 症状：开机时黑屏上一行英文，要按 F1 才能继续。常见的三种：主板上的纽扣电池没电了（CMOS checksum error、CMOS battery low，
# 时间每次断电后都跳回过去）、主板没测到 CPU 风扇的转速（CPU Fan Error：风扇线插错口、水冷、低转速风扇）、BIOS 设置恢复成了
# 默认（Press F1 to Run SETUP、Defaults Loaded）。查系统时间（system.clock：电池没电时时间会跳回过去）；换电池、改插风扇线要
# 动手，只给指引；BIOS 里只说改报警那一项，写明别动硬盘模式。
