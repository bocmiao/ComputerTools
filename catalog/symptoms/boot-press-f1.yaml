causes:
  - zh-CN: 主板上的纽扣电池（多数是 CR2032）没电了：BIOS 设置和时间保存不住，每次断电以后都恢复默认
  - zh-CN: 主板没测到 CPU 风扇的转速：风扇线插在了别的风扇口上，或者用的是水冷、转速很低的风扇
  - zh-CN: BIOS 设置被恢复成了默认值，或者刚换过硬件
maturity: semi
