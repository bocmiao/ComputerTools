  - check: system.clock
guide:
  zh-CN: |
    先看开机时屏幕上那行英文写的是什么（可以用手机拍下来）：

    1. 「CMOS checksum error」「CMOS battery low」「CMOS Date/Time Not Set」，或者每次关机断电以后时间都跳回过去（上面的检查看得出来）：主板上的纽扣电池没电了。台式机先关机、拔掉电源线，打开机箱，把主板上那颗硬币大小的电池（多数是 CR2032，几块钱）换成新的；再开机按提示进 BIOS，把日期和时间改对，按 F10 保存退出。笔记本、一体机的电池在里面，请找售后或者懂哥。
    2. 「CPU Fan Error」：主板没测到 CPU 风扇的转速。先打开机箱看 CPU 风扇转不转：不转的别再开机用，处理器会过热，要修或者换风扇。风扇在转的，多半是风扇线插在了写着 SYS_FAN、CHA_FAN 的口上，关机拔掉电源线以后改插到写着 CPU_FAN 的口；用水冷、转速很低的风扇的，进 BIOS 在硬件监控（Hardware Monitor、PC Health Status）里把 CPU 风扇的低转速报警（CPU Fan Speed Low Limit、CPU Fan Fail Warning 这类名字）调低或者关掉。
    3. 「Press F1 to Run SETUP」「Defaults Loaded」「Load default settings」这类只出现一次的：BIOS 设置恢复成了默认，按 F1 进 BIOS，直接按 F10 保存退出就好。每次开机都这样的，还是看第 1 条换电池。
    4. 按 F1 能进 Windows 的，进去以后用「同步时间」把时间对好；一关机时间又不对，就是电池没电了。

    进了 BIOS 只改上面说的那一项，别动别的设置：尤其是硬盘模式（SATA Mode、AHCI、RAID），改了开机会蓝屏、进不了系统。
