# 症状：电脑没声音（调研 S03 的一部分）。现在能查的是 Windows 的音频服务（停了能一键重启，被禁用能一键恢复、能撤销）
# 和设备管理器里的声卡；最常见的几个原因——输出设备跑到了显示器或蓝牙耳机上、静音、某个软件被单独调小——
# 要用 Core Audio 的 COM 接口才读得到（脚本不用 Add-Type 就调不了），现在先给图文指引和「设置」入口。
id: no-sound
schema_version: 1
title: { zh-CN: 电脑没声音 }
summary:
  zh-CN: 放视频、听歌没有声音，喇叭图标上有红叉，或者只有某个软件没声音。
keywords:
  - 没声音
  - 电脑没声音
  - 电脑没有声音
  - 突然没声音了
  - 喇叭有红叉
  - 喇叭红叉
  - 音箱没声音
  - 耳机没声音
  - 声音出不来
  - 扬声器没声音
  - 视频没声音
  - 放歌没声音
  - 声卡
  - 音频服务
  - 未安装任何音频输出设备
  - 没有音频设备
causes:
  - zh-CN: 声音跑到了别的设备上（接了显示器、电视或者蓝牙耳机以后常见）
  - zh-CN: 静音了，或者某个软件被单独调小、静音了
  - zh-CN: 音箱、耳机没插好，或者音箱没开电源
  - zh-CN: Windows 的音频服务停了，或者被「优化」软件关掉了
  - zh-CN: 声卡驱动出了问题
maturity: semi
steps:
  - check: audio.service
    stop_on: [advice]
  - check: hardware.device-problems
guide:
  zh-CN: |
    先看上面的检查结果，按提示处理。

    检查都正常的话，一样一样排除：

    1. 看看右下角的喇叭图标：有没有静音（图标上带个 ×），音量是不是调到了最小。
    2. 声音可能跑到别的设备上去了：点一下右下角的喇叭图标，Windows 11 点音量条右边的「>」，Windows 10 点音量上面的设备名，选你要用的音箱或耳机。接了显示器、电视（HDMI）或者蓝牙耳机以后最常见。
    3. 只有某一个软件没声音、别的正常：打开「音量合成器」（小工具里有），看看这个软件是不是被单独调小或者静音了；网页、视频没声音的，看看浏览器标签页上的小喇叭有没有被点成静音。
    4. 音箱、耳机：插头插紧（台式机插在绿色的孔里），音箱打开电源、旋钮调大；换一个孔试试；蓝牙耳机断开再重新连接。
    5. 还是不行，点「重启音频服务」，再不行就重启电脑；设备管理器里声卡带感叹号的，请懂哥帮忙装驱动。

    还可以用微软自带的「声音疑难解答」自动查一遍，能修的它直接修（点下面的按钮；它在 Windows 的「获取帮助」应用里，要联网）。

    修好以后，点下面的「测一测喇叭、耳机」，听听左边、右边是不是都响。
links: ["test:speaker", "tool:settings.volume-mixer", "tool:audio.restart-service", "tool:troubleshoot.audio"]
