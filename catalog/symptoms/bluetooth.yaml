guide:
  zh-CN: |
    先看上面的检查结果：蓝牙服务被关掉的点修复；没有蓝牙、被禁用、没驱动的照提示处理。

    其他情况：

    1. 蓝牙开关是灰的、点不动：点右下角的网络图标，把「飞行模式」关掉；笔记本键盘上有飞机或者无线图标的键（常要和 Fn 一起按），按一下试试；还不行就重启电脑。
    2. 搜不到耳机、鼠标：先让它进入配对模式（耳机一般是放回充电盒、打开盖子长按盒子上的按钮，或者长按耳机的电源键，直到指示灯快速闪烁；看说明书），再在「设置 → 蓝牙和其他设备」里点「添加设备」→「蓝牙」。设备离电脑近一点；耳机正连着手机的，先在手机上断开。
    3. 以前连过、现在连不上：在「设置 → 蓝牙和其他设备」里找到这个设备，点「删除设备」，再按第 2 条重新配对。
    4. 连上了没声音：点右下角的喇叭图标，在声音输出里选这个耳机。耳机出现两个名字的，选不带「Hands-Free」「免提」的那个，音质好。
    5. 耳机能听歌、麦克风用不了（微信语音对方听不到）：在「设置 → 系统 → 声音」的输入里选这个耳机（带「Hands-Free」「免提」的）。用耳机的麦克风时音质会变差，是蓝牙本身的限制；对音质要求高的，用电脑自带或者单独的麦克风。
    6. 鼠标一顿一顿、耳机断断续续：USB 3.0 的口（常是蓝色的）和插在上面的 U 盘、移动硬盘会干扰蓝牙，把蓝牙适配器换到离它们远一点的口，或者用一根 USB 延长线；路由器能用 5G 的 WiFi 就连 5G 的。再打开「设备管理器」→「蓝牙」→ 蓝牙适配器 →「属性」→「电源管理」，取消「允许计算机关闭此设备以节约电源」。
    7. 台式机没有蓝牙：买一个 USB 蓝牙适配器，选写着「免驱」、蓝牙 5.0 以上的。

    都不行的话，到电脑品牌的官网按型号下载最新的蓝牙驱动重新装，或者请懂哥帮忙。

    还可以用微软自带的「蓝牙疑难解答」自动查一遍，能修的它直接修（点下面的按钮；它在 Windows 的「获取帮助」应用里，要联网）。
