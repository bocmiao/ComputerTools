# 症状：蓝牙用不了、连不上蓝牙耳机和鼠标。先看有没有蓝牙适配器、有没有被禁用、驱动装没装（hardware.bluetooth），
# 再看蓝牙服务有没有被「优化」软件关掉（hardware.bluetooth-services → 修复 hardware.enable-bluetooth-services），
# 最后看设备管理器里别的出错的设备。别的情况给图文指引：飞行模式、蓝牙开关、配对模式、删掉重新配对、连上了没声音
# （选输出设备）、耳机麦克风用不了、断断续续（USB 3.0 干扰、省电设置）。
