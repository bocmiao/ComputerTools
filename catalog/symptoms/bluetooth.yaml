causes:
  - zh-CN: 电脑本来就没有蓝牙（很多台式机没有），或者蓝牙在设备管理器里被禁用了、驱动没装
  - zh-CN: 蓝牙服务被「优化」类软件关掉了
  - zh-CN: 开着飞行模式，或者蓝牙开关没打开
  - zh-CN: 耳机、鼠标没进入配对模式，或者正连着手机
  - zh-CN: 连上了，但声音还在从电脑的喇叭出来（没选对输出设备）
  - zh-CN: USB 3.0 的口、U 盘、移动硬盘干扰了蓝牙，或者蓝牙适配器被省电设置关掉了
maturity: semi
steps:
