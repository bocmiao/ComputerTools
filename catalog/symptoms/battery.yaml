  - zh-CN: 电脑厂商的电池养护功能：为了让电池更耐用，充到 60%、80% 就不充了（「已接通电源，未充电」）
  - zh-CN: 充电器功率不够：用了手机充电器、小功率的 Type-C 充电器，或者插在扩展坞、显示器上充电
  - zh-CN: 屏幕太亮、电源模式选了「最佳性能」，或者有软件在后台一直占着处理器
