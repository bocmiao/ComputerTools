# 症状：笔记本电池不耐用、充不进电。查电池老化了多少（hardware.battery-health）和接着电源时有没有在充电
# （hardware.battery-charging：厂商的电池养护功能充到 60%、80% 就停、充电器功率不够、电脑没认出充电器）。
# 没有一键修复：电池老化只能换；养护功能在各品牌自己的软件或 BIOS 里，小药箱不去改（也改不了）。
# 手动步骤：续航短的几种常见原因（亮度、电源模式、费电的软件，链接小工具「电池使用情况」）、各品牌的养护开关在哪、
# 充电器功率、电池鼓包。台式机上两项检查都是 na（不显示）。
