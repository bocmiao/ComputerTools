guide:
  zh-CN: |
    先看上面两项检查：电池老化了多少，接着电源的时候有没有在充电（充不进电的，查的时候插着充电器）。

    充满电用不了多久（续航短）：
    1. 电池健康度低（比如只剩一半）的，是电池老了，只能找售后换电池，别的办法作用不大。电池一般用两三年、充放电几百次以后会明显变差。
    2. 看看哪个软件最费电：打开小工具「电池使用情况」。开着很多网页的浏览器、视频、游戏、下载软件、网盘同步都很费电，用不上的就关掉。
    3. 屏幕亮度最费电：按键盘上的亮度键（有的要同时按 Fn），或者在右下角的快捷设置里把亮度调低一些。
    4. 电源模式：Windows 11 在「设置 → 系统 → 电源和电池」里把「电源模式」选成「平衡」（小工具「电源和睡眠」能直接打开这一页）；Windows 10 点右下角的电池图标，把滑块往左拖。「最佳性能」只适合插着电源的时候用。
    5. 打开「节电模式」（Windows 11 新版叫「节能」）：Windows 11 在「电源和电池」里，Windows 10 在「设置 → 系统 → 电池」里，可以设成电量低到多少时自动打开。
    6. 电脑卡、风扇一直呼呼转的，是有程序一直占着处理器，也特别费电，看看症状「电脑卡、风扇狂转」。
    7. 暂时不用就合上盖子让它睡眠；要放好几天不用的，关机。

    插着电源却充不进电：
    1. 电量停在 60%、80% 左右，右下角写着「已接通电源，未充电」的，多半是电脑厂商的电池养护功能，不是坏了；经常插着电源用的电脑开着它更好。想充满的话，在厂商自带的软件里关掉它（出门前临时关掉也行）：
       - 联想：Lenovo Vantage 或「联想电脑管家」里的「养护模式」（ThinkPad 是「电池充电阈值」）
       - 华硕：MyASUS 里的「电池健康充电」，选「满电模式」
       - 戴尔：Dell Power Manager（或 Dell Optimizer）里的电池设置，选「标准」
       - 惠普：开机时按 F10 进 BIOS，找「电池运行状况管理器」（Battery Health Manager）
       - 华为、荣耀：「电脑管家」里的「智能充电」
       - 微软 Surface：Surface 应用里的「智能充电」，或者 UEFI 里的「电池限制模式」（Battery Limit）
    2. 插着电源电量还往下掉，或者充得特别慢：充电器的功率不够。换回原装充电器，或者瓦数够大的（充电器上写着 65W、100W 这样的）；Type-C 充电的要用支持 PD 快充的充电器和线；插在扩展坞、显示器上充电的，功率也可能不够。
    3. 电脑根本认不出充电器（右下角的电池图标上没有插头）：两头都拔下来重新插紧，换个插座，看看充电器上的指示灯亮不亮；Type-C 充电的，要插在旁边有闪电或者电源标志的那个口。还不行的，换个充电器试试，多半是充电器、线或者充电口坏了。
    4. 电量一直是 0%，怎么也充不进：电池多半坏了（或者放了太久没用，电放光了），找售后看看。

    电池鼓起来了（外壳鼓包，触控板、键盘被顶起来，盖子合不上）：马上停止充电，别再用了，尽快送售后换电池；不要自己拆，也不要去按压。
