# 症状：提示「回收站已损坏」（调研 P1）。修法照微软《The Recycle Bin is corrupted》：删掉那个盘根目录下的 $Recycle.Bin，
# 重启以后 Windows 重新建一个（原文是在管理员命令提示符里运行 RD <盘>\$Recycle.bin /s /q）。页面上有「清空并重建回收站」
# （界面按症状 id 放进来，见 app/src/views/SymptomsView.vue；后端 medkit_core::recycle_bin）：列出各个盘的回收站里有多少
# 东西，选一个盘确认以后删掉。一再损坏的多半是盘本身有问题，所以先查硬盘读写错误（含文件系统损坏）和硬盘健康，只查不改。
id: recycle-bin-corrupted
schema_version: 1
title: { zh-CN: 提示「回收站已损坏」 }
summary:
  zh-CN: 删文件、打开回收站或者开机时弹出「C:\ 上的回收站已损坏。是否清空该驱动器上的回收站?」，点了「是」还是一再弹出来；或者回收站打不开、清空不了。
keywords:
  - 回收站已损坏
  - 回收站损坏
  - 回收站坏了
  - 是否清空该驱动器上的回收站
  - 清空该驱动器上的回收站
  - 是否要清空此驱动器的回收站
  - 回收站一直提示损坏
  - 回收站老是提示
  - 回收站打不开
  - 打不开回收站
  - 回收站清空不了
  - 回收站无法清空
  - 回收站清空失败
  - 清空回收站没反应
  - 回收站删不掉
  - 回收站里的文件删不掉
  - 回收站里的东西删不掉
  - 删除文件提示回收站
  - $Recycle.Bin
  - recycle bin
  - empty the recycle bin for this drive
causes:
  - zh-CN: 删东西的时候断电、强制关机，回收站里的记录没写完
  - zh-CN: 移动硬盘没点「安全弹出」就拔掉了，或者盘上有坏道、文件系统出了错
  - zh-CN: 清理、优化软件或者杀毒软件动过回收站文件夹（每个盘根目录下隐藏的 $Recycle.Bin）
maturity: semi
steps:
  - check: disk.error-events
  - check: disk.smart-health
guide:
  zh-CN: |
    1. 先点提示框里的「是」：Windows 会清空这个盘的回收站、重新建好，多数时候这样就好了。回收站里有要留的东西，先点「否」，打开回收站，把要留的右键「还原」出来，再点「是」。
    2. 点了「是」以后还是一再提示，或者回收站打不开、清空不了：用上面的「清空并重建回收站」，选提示里说的那个盘（提示里写着「D:\」就是 D 盘），清空以后重启电脑。这是微软给的办法（在管理员命令提示符里运行 RD D:\$Recycle.bin /s /q 再重启），效果一样。
    3. 只在移动硬盘上提示的：先在任务栏右下角点「安全删除硬件并弹出媒体」把它弹出，再插上试试；还是提示就照第 2 步清空它的回收站。以后拔之前都先弹出。
    4. 重启以后还是提示，或者上面的检查查出了硬盘读写错误、文件系统损坏：盘本身可能有问题。先把重要的文件复制出来，再右键这个盘 →「属性」→「工具」→「检查」，让 Windows 修一修文件系统；硬盘健康报警的，尽早换盘。
