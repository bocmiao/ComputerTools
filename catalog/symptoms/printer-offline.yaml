# 症状：打印机显示脱机、打印没反应。先看打印服务（printer.spooler），再看打印机有没有脱机、被勾上「脱机使用打印机」
# 「暂停打印」（printer.offline → 小工具 printer.resume）。别的情况给图文指引：开机和连线、网络打印机的 IP 地址变了、
# 显示脱机其实能打印（SNMP 状态误报）、队列卡住（清空打印队列）、删掉重新添加。
id: printer-offline
schema_version: 1
title: { zh-CN: 打印机显示脱机 }
summary:
  zh-CN: 打印机图标上写着「脱机」「脱机使用打印机」或者「已暂停」，点打印没反应，文档一直排在队列里。
keywords:
  - 打印机脱机
  - 打印机显示脱机
  - 打印机离线
  - 脱机使用打印机
  - 打印机脱机怎么办
  - 打印机已暂停
  - 打印机暂停
  - 打印没反应
  - 点打印没反应
  - 打印机没反应
  - 打印机连不上
  - 网络打印机脱机
  - 打印机状态错误
causes:
  - zh-CN: 打印机没开、没连好：电源、USB 线、网线，或者 WiFi 断了
  - zh-CN: 不小心勾上了「脱机使用打印机」或者「暂停打印」
  - zh-CN: 网络打印机的 IP 地址变了（路由器重启以后重新分配），电脑还在找原来的地址
  - zh-CN: 连的是别的电脑共享的打印机，那台电脑关机了
  - zh-CN: 打印机其实好好的，是 Windows 查询打印机状态时出了错（SNMP 状态误报）
maturity: semi
steps:
  - check: printer.spooler
  - check: printer.offline
guide:
  zh-CN: |
    先看上面的检查结果：被勾上「脱机使用打印机」「暂停打印」的，点「让打印机恢复工作」。

    其他情况：

    1. 先看打印机本身：开着没有、屏幕上有没有报错（缺纸、卡纸、没墨）；USB 线两头插紧；网络打印机看看连的是不是和电脑同一个路由器、同一个 WiFi。关掉打印机等半分钟再打开，常常就好了。
    2. 网络打印机以前能用、突然脱机：多半是它的 IP 地址变了。在打印机的屏幕上看，或者打印一张「网络配置页」，找到现在的 IP 地址；然后在「打印机和扫描仪」里删掉这台打印机，点「添加设备」→「我需要的打印机不在列表中」→ 按 IP 地址添加。以后不想再变，请懂哥在路由器上给打印机固定一个 IP 地址。
    3. 显示「脱机」，但其实打得出来，或者别的电脑都能打：可能是 Windows 查询状态时出了错。打开「打印机属性」→「端口」，选中打勾的那个端口 →「配置端口」，取消勾选「已启用 SNMP 状态」，点「确定」。
    4. 连的是别的电脑共享的打印机：那台电脑要开着，两台电脑能互相访问；报错 0x00000709、0x0000011b 的，看「打印机连不上或不打印」里的办法。
    5. 队列里有卡住的文档，删不掉：用小工具「清空打印队列」，再重新打印。
    6. 都不行：在「打印机和扫描仪」里删掉这台打印机，重启电脑，再重新添加（驱动到打印机品牌的官网下载）。
links: ["tool:printer.resume", "tool:settings.printers", "tool:printer.clear-queue", "symptom:printer-share"]
