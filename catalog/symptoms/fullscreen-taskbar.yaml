# 症状：视频、游戏全屏了，任务栏还在下面挡着（调研 P2「全屏游戏时任务栏不隐藏」）。原因和办法照微软问答里的几个帖子和国内的排障文章：
# 有程序在任务栏上闪烁提醒时任务栏一直显示（Win11 22H2 起能关掉闪烁：检测 system.taskbar-flashing，修复 taskbar.no-flashing）、
# 资源管理器卡住（重启它）、任务栏上挂着温控软件的温度、网速插件、网页视频双击只是放大不是全屏、最后才是「自动隐藏任务栏」。
id: fullscreen-taskbar
schema_version: 1
title: { zh-CN: 全屏看视频、玩游戏时任务栏不隐藏 }
category: desktop
summary:
  zh-CN: 视频、游戏已经全屏了，屏幕最下面的任务栏还在，挡住字幕、进度条和游戏界面。
keywords:
  - 全屏任务栏不隐藏
  - 全屏任务栏还在
  - 全屏任务栏不消失
  - 全屏有任务栏
  - 全屏看视频任务栏
  - 看视频任务栏不隐藏
  - 玩游戏任务栏不隐藏
  - 游戏全屏任务栏
  - 任务栏挡住
  - 任务栏挡住字幕
  - 挡住字幕
  - 任务栏还在
  - 任务栏不自动隐藏
  - 任务栏一直显示
  - 任务栏图标闪烁
  - 任务栏图标变橙色
  - 任务栏闪烁
causes:
  - zh-CN: 有程序在任务栏上闪烁提醒（来了消息、下载完了），闪着的时候任务栏会一直显示
  - zh-CN: 任务栏上挂着显示温度、网速、天气的插件（电脑管家、温控软件装的），把任务栏顶着
  - zh-CN: 资源管理器（任务栏归它管）卡住了
  - zh-CN: 网页视频双击画面只是把窗口放大，不是真的全屏
maturity: semi
steps:
  - check: system.taskbar-flashing
    fixes: [taskbar.no-flashing]
guide:
  zh-CN: |
    1. 看看任务栏上有没有在闪、变成橙色的按钮：点一下它，看完提醒，再回到视频或者游戏里，任务栏就会退下去。上面的检查说「任务栏闪烁提醒」开着、又不需要这种提醒的，点修复关掉（Windows 11）。
    2. 用鼠标点一下全屏的画面，让它回到最前面。网页视频要点播放器右下角的「全屏」按钮，或者按 F11；双击画面常常只是把窗口放大。
    3. 点下面的「重启资源管理器」：任务栏会闪一下重新出来，打开的窗口、正在放的视频都不受影响。
    4. 任务栏上显示温度、网速、天气的小插件（电脑管家、温控软件装的），先把它关掉或者退出那个软件再试。
    5. 还是不行：点下面的「任务栏设置」，在「任务栏行为」里勾上「自动隐藏任务栏」，任务栏平时收起来，鼠标移到屏幕最下面才出来。
links: ["tool:system.restart-explorer", "tool:settings.taskbar"]
