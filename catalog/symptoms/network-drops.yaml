guide:
  zh-CN: |
    先看上面的检查结果：网卡的省电设置勾着的点修复，重启电脑以后生效。

    其他情况，从最简单的开始：

    1. 先看是不是只有这台电脑掉线：手机连同一个 WiFi 也掉的，问题在路由器、光猫或者宽带：把它们断电 30 秒再插上；还常掉的，打运营商客服电话。
    2. WiFi：离路由器近一点，少隔几堵墙；路由器支持 5G 的，连名字带 5G 的那个 WiFi（离得近时更稳定）；2.4G 的在路由器管理页面里把「信道」从自动改成 1、6、11 里的一个试试。
    3. 网线：把两头拔下来重新插紧，看网口的灯是不是一直亮着；换一根网线、换路由器上的另一个口试试。
    4. 睡眠、合上盖子再打开以后没网：先在任务栏的网络图标里把 WiFi 关掉再打开；还不行，用小工具「网络连接（网卡）」，在这个网卡上点右键「禁用」再「启用」。关机再开机以后没网、点「重启」才好的，关掉「快速启动」（小药箱「常用设置 → 电源」里就有）。
    5. 到电脑品牌的官网按型号下载最新的无线网卡、有线网卡驱动装上（刚出问题前更新过驱动的，在设备管理器里「回退驱动程序」）。
    6. 网卡的高级设置里还有省电项：用小工具「网络连接（网卡）」，在网卡上点右键「属性」→「配置」→「高级」，把「节能以太网」「绿色以太网」「省电模式」这类改成「关闭」。

    都不行的话，可能是网卡或者路由器坏了，请懂哥帮忙。

    还可以用微软自带的「网络和 Internet 疑难解答」自动查一遍，能修的它直接修（点下面的按钮；它在 Windows 的「获取帮助」应用里，要联网）。
links: ["tool:open.network-connections", "tool:troubleshoot.network", "tool:web.oem-drivers"]
