guide:
  zh-CN: |
    先看上面的检查结果：它会告诉你这台电脑有没有独立显卡、独立显卡能不能用。再按下面几步试：

    1. 笔记本先插上电源再玩：用电池时很多笔记本会限制独立显卡，帧数会低很多。Windows 11 在「设置 → 系统 → 电源」里把「电源模式」设成「最佳性能」；游戏本自带的控制中心（联想的 Legion Zone、华硕的奥创中心 Armoury Crate 这类）里选「性能」「野兽」这样的模式。
    2. 让游戏用独立显卡：点下面的「图形设置」按钮（Windows 11 里叫「显示卡」），在「添加应用」那里点「浏览」，找到游戏的程序（.exe）加进来，把它的「GPU 首选项」设成「高性能」（Windows 10 是点游戏下面的「选项」→「高性能」→「保存」），然后把游戏关掉重新打开。不知道游戏的程序在哪的：在桌面的游戏图标上点右键 →「打开文件所在的位置」，选中的那个就是。现在的 Windows 以这里的设置为准，NVIDIA 控制面板里的「首选图形处理器」只在这里没设时才管用。
    3. 看游戏到底用的是哪块显卡：玩着游戏按 Ctrl + Shift + Esc 打开任务管理器（简略模式先点「详细信息」），在「进程」页的表头上点右键，勾上「GPU 引擎」，游戏那一行会写「GPU 0 - 3D」或者「GPU 1 - 3D」；再到「性能」页看 GPU 0、GPU 1 分别是哪块显卡。
    4. 游戏本的控制中心里有「独显直连」「独显模式」「独显输出」这类开关的，打开它（一般要重启）帧数会更高，就是更费电。
    5. 台式机：显示器的线要插在独立显卡的接口上（机箱背面下方横着的那一排），不要插在主板的接口上（上方和 USB 口挨在一起的那一块）。打开 NVIDIA 控制面板提示「您当前未使用连接到 NVIDIA GPU 的显示器」，多半就是插错了。
    6. 更新显卡驱动：笔记本到电脑品牌官网、台式机到 NVIDIA 或 AMD 官网，按型号下载最新的显卡驱动；刚更新驱动就变卡的，在设备管理器里回退驱动。
    7. 都做了还卡：可能是显卡本身性能不够，把游戏的画质、分辨率调低；或者机身很烫、风扇狂转，散热不好让显卡降频了，看「电脑卡、风扇狂转」。
