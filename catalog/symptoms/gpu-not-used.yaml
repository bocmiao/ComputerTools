# 症状：玩游戏卡、帧数低，明明有独立显卡却好像没用上。先看这台电脑有哪几块显卡、独显能不能用、台式机的显示器是不是插在
# 主板上（display.gpus），再看电源计划有没有把电脑压着跑（system.power-plan，修复和「电脑卡」一样）。
# 让某个游戏用独显，Windows 10 2004 起由 Windows 的「图形设置」决定（NVIDIA 的说明：它比 NVIDIA 控制面板里的「首选图形
# 处理器」优先），小药箱给打开这一页的按钮（settings.graphics），不替用户写 UserGpuPreferences。
# 任务管理器里看游戏用的哪块显卡：「GPU 引擎」一栏写着「GPU 1 - 3D」这样的，GPU 编号按显卡在 PCI 上的位置排，在「性能」页
# 里对得上是哪块（微软 DirectX 博客《GPUs in the Task Manager》，要 WDDM 2.0 以上的驱动）。
# NVIDIA 控制面板提示「NVIDIA 显示设置不可用，您当前未使用连接到 NVIDIA GPU 的显示器」：台式机多半是显示器线插在主板上。
