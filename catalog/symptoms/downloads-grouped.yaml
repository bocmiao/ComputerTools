# 症状：「下载」文件夹里的文件按「今天」「昨天」「上周」「很久以前」分组了（Windows 11 的「下载」默认按修改日期分组）。只给图文
# 指引，照微软问答里的办法：在「下载」里「分组依据 → （无）」，再到「文件夹选项 → 查看」点「应用到文件夹」，让所有「下载」类型的
# 文件夹都一样；浏览器、微信这些软件的「另存为」「打开」窗口各记各的，要在那个窗口里再改一次（微软问答的志愿版主说明）。
# 先找过能复用的：Win11Debloat、winutil 都没有这一项；winutil 相近的「关闭文件夹类型自动识别」会清空所有文件夹记住的视图，太猛，
# 不用。改注册表里的视图缓存（Shell\Bags）的办法效果要看资源管理器的缓存，CI 上验证不了，所以不做一键修改。
