maturity: guide
guide:
  zh-CN: |
    这是 Windows 11「下载」文件夹默认的样子，不是电脑出了问题，改一下显示方式就行，文件不会动：

    1. 打开「下载」文件夹，在空白的地方点右键 →「分组依据」→「（无）」。也可以点上面的「排序」→「分组依据」→「（无）」。
    2. 想让别的「下载」类型的文件夹也不分组：在这个文件夹里点上面的「…」（查看更多）→「选项」，打开「文件夹选项」，切到「查看」，点「应用到文件夹」，再点「是」「确定」。Windows 10 在上面的「查看」→「选项」里。
    3. 浏览器、微信、QQ 这些软件的「另存为」「打开」窗口会各记各的：在那个窗口里的空白处同样点右键 →「分组依据」→「（无）」改一次，以后这个软件就记住了。
    4. 想按时间找最新下载的文件：点上面的「排序」→「修改日期」，再选「降序」，最新的就在最上面。
