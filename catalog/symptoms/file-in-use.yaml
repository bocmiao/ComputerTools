# 症状：删文件、改名、移动时提示「文件已在另一程序中打开」（报错截图对症状时 20 条常见报错里没对上的一条）。
# 页面上放工具箱里已有的「文件删不掉：是谁占着」（界面按症状 id 放进来，见 app/src/views/SymptomsView.vue；后端用 Windows 的
# 重启管理器查，只查不改）。资源管理器自己占着的，结果里直接给「重启资源管理器」。U 盘弹不出来是另一件事，给按钮。
id: file-in-use
schema_version: 1
title: { zh-CN: 删不掉、改不了名：提示「文件已在另一程序中打开」 }
category: files
summary:
  zh-CN: 删除、重命名、移动文件或文件夹时提示「操作无法完成，因为文件已在另一程序中打开」「文件夹正在使用」，或者「进程无法访问此文件，因为另一个程序正在使用此文件」。
keywords:
  - 文件已在另一程序中打开
  - 文件已在另一个程序中打开
  - 操作无法完成，因为文件已在
  - 因为其中的文件夹或文件已在另一程序中打开
  - 文件夹已在另一程序中打开
  - 文件正在使用
  - 文件夹正在使用
  - 另一个程序正在使用此文件
  - 进程无法访问此文件
  - 文件被占用
  - 文件夹被占用
  - 被占用删不掉
  - 文件删不掉
  - 删不掉文件
  - 文件夹删不掉
  - 无法删除文件
  - 改不了名
  - 重命名失败
  - 文件移动不了
  - file in use
  - the action can't be completed because the file is open in another program
causes:
  - zh-CN: 文件还开在某个软件里（Word、Excel、看图软件、播放器、压缩软件），或者软件关了窗口却还在后台运行
  - zh-CN: 资源管理器自己在用：正在生成缩略图，或者右边的「预览窗格」开着这个文件
  - zh-CN: 网盘同步、下载工具、杀毒软件正在读写或者扫描它
  - zh-CN: 命令行窗口、别的资源管理器窗口停在这个文件夹里
maturity: guide
guide:
  zh-CN: |
    用上面的「文件删不掉：是谁占着」选中删不掉的文件（或者整个文件夹），看是哪个程序在用，再照它下面的说明处理：

    1. 是自己开着的软件：在那个软件里关掉这个文件，或者把软件整个退出（有的软件关了窗口还在右下角运行，要在右下角的图标上右键「退出」）。
    2. 是资源管理器：点结果下面的「重启资源管理器」；预览窗格开着的，先在资源管理器的「查看」里把它关掉。
    3. 是网盘、下载工具、杀毒软件：等它忙完，或者先暂停同步、下载。
    4. 查不出来、还是删不掉：重启电脑以后先删它，别打开别的软件。

    U 盘、移动硬盘「弹不出来」提示「设备正在使用中」，用下面的「U 盘弹不出是谁占着」查。
links: ["tool:hardware.usb-eject-blockers"]
