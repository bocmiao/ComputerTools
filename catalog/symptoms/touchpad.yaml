# 症状：笔记本触摸板没反应、失灵（调研 A14）。只给指引：快捷键和「设置」里的开关照华硕的中文排障说明，驱动照微软《修复 Windows
# 中的触摸板问题》（在「人机接口设备」「鼠标和其他指针设备」里找触摸板，更新或者重装驱动）。查设备管理器有没有出问题的设备。
# 「设置」里触摸板开关对应的注册表值微软说只读、不要直接改，所以不做修复，给打开「触摸板设置」的按钮。
id: touchpad
schema_version: 1
title: { zh-CN: 笔记本触摸板没反应 }
summary:
  zh-CN: 笔记本的触摸板用手指划了没反应，鼠标指针不动，或者一插上鼠标触摸板就不能用了。
keywords:
  - 触摸板没反应
  - 触摸板失灵
  - 触摸板不能用
  - 触摸板用不了
  - 触摸板没用了
  - 触控板没反应
  - 触控板失灵
  - 触控板不能用
  - 笔记本鼠标不动
  - 触摸板关了
  - 触摸板锁了
  - 触摸板开关
  - 插上鼠标触摸板不能用
causes:
  - zh-CN: 不小心按到了关触摸板的快捷键（一般是 F6、F9 这类，有的要加 Fn）
  - zh-CN: 「设置」里的触摸板开关被关了，或者设成了接上鼠标就关掉触摸板
  - zh-CN: 厂商的电脑管家里把触摸板锁了
  - zh-CN: 触摸板驱动坏了、没装好，或者在 BIOS 里被关掉了
  - zh-CN: 触摸板本身坏了、排线松了
maturity: semi
steps:
  - check: hardware.device-problems
guide:
  zh-CN: |
    1. 先按一下键盘上画着触摸板图标的键（一般是 F6、F9 这类，有的要同时按 Fn），看屏幕上有没有「触摸板已启用」这类提示。
    2. 点下面的「触摸板设置」，确认「触摸板」开关是开着的；接了鼠标触摸板就不能用的，勾上「连接鼠标时让触摸板保持打开状态」。
    3. 厂商的电脑管家（华硕的 MyASUS、联想电脑管家、惠普的这类）里看看有没有把触摸板锁了。
    4. 驱动：点下面的「可选更新」看有没有触摸板驱动；或者打开设备管理器，在「人机接口设备」「鼠标和其他指针设备」里找到触摸板，右键「卸载设备」以后重启，Windows 会重新装驱动。上面的检查说有设备出问题的，也在设备管理器里看。
    5. 还不行：可能是在 BIOS 里被关掉了（一般叫 Internal Pointing Device），或者触摸板坏了、排线松了，请懂哥或者售后看看。急用的先插一个 USB 鼠标。
links: ["tool:settings.touchpad", "tool:settings.optional-updates", "tool:open.device-manager"]
