# 症状：WiFi 不见了、飞行模式关不掉。先看飞行模式开着没有（network.airplane-mode），再看 WiFi 和飞行模式用到的服务
# 有没有被「优化」软件关掉（network.wireless-services → 修复 network.enable-wireless-services），再看无线网卡有没有被禁用
# （network.wifi-adapter → 修复 network.enable-wifi-adapter），最后看设备管理器里出错的设备（没装好驱动的无线网卡在这里）。
# 别的情况给图文指引：重启、快捷键和物理开关、驱动（刚重装、大更新以后）、卸载设备让 Windows 重装、网络重置、台式机没有无线网卡。
# 「上不了网」（network）管的是连不上网；这里管的是 WiFi 这一项整个不见了、飞行模式开关不听使唤。
