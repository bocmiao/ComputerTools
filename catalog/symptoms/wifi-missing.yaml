guide:
  zh-CN: |
    先看上面的检查结果：服务被关掉、网卡被禁用的点修复；飞行模式开着、没装好驱动的照提示处理。

    其他情况，从最简单的开始：

    1. 重启一次电脑（笔记本最好关机以后拔掉电源，等一会儿再开机）。很多时候 WiFi 就回来了。
    2. 笔记本键盘上画着飞机或者信号的键（有的要和 Fn 一起按）按一下；老笔记本的侧面、前面可能有无线网络的拨动开关，拨到「开」。
    3. 刚重装完系统、刚更新完系统以后 WiFi 没了：多半是无线网卡的驱动没装上或者坏了。打开「Windows 更新」检查更新，再看看「高级选项 → 可选更新」里有没有网卡驱动；没有的话，到电脑品牌的官网按型号下载无线网卡驱动（WLAN 驱动）。电脑没网下载不了的，用数据线把安卓手机连上电脑，在手机的设置里打开「USB 网络共享」，电脑就能用手机的流量上网；插网线也行。
    4. 让 Windows 重新装一遍网卡：打开「设备管理器」，展开「网络适配器」，在名字里带 Wireless、Wi-Fi、WLAN 或者 802.11 的那个上点右键 →「卸载设备」（不要勾「删除此设备的驱动程序」），再重启电脑，Windows 会自动把它装回来。
    5. 还不行，用 Windows 自带的「网络重置」：Windows 11 在「设置 → 网络和 Internet → 高级网络设置 → 网络重置」，Windows 10 在「设置 → 网络和 Internet → 状态」页的最下面。它会把所有网卡和网络设置恢复成刚装好系统时的样子，保存过的 WiFi 密码要重新输入（可以先用小药箱小工具里的「查看 WiFi 密码」记下来），VPN、加速器要重新装，做完会重启电脑。
    6. 台式机没有无线网卡：买一个 USB 无线网卡（几十块钱，选写着「免驱」的，插上就能用）。

    都不行的话，可能是无线网卡坏了，或者在 BIOS 里被关掉了，请懂哥或者电脑的售后看看。

    还可以用微软自带的「网络和 Internet 疑难解答」自动查一遍，能修的它直接修（点下面的按钮；它在 Windows 的「获取帮助」应用里，要联网：没有 WiFi 的话先插网线或者用手机的 USB 共享网络）。
