# 症状：浏览器主页被改了（一打开就是 2345、hao123 这类导航网站）。
# 先查最常见、小药箱能修的：浏览器快捷方式后面被加了网址（security.browser-shortcuts → 修复 security.browser-shortcuts-clean，
# 只去掉网址，能撤销）；再查 hosts 有没有把常用网站改指到别处（network.hosts → network.hosts-cleanup）。
# 浏览器自己的设置（主页、启动时打开的网页、默认搜索引擎）、扩展、被策略锁住的主页，小药箱不改：给图文指引（各浏览器的「重置设置」、
# 看扩展、卸载捆绑软件、用 Windows 安全中心扫描）。浏览器设置里写着「由你的组织管理」的，请懂哥看。
id: browser-hijacked
schema_version: 1
title: { zh-CN: 浏览器主页被改了 }
category: software
summary:
  zh-CN: 一打开浏览器就是 2345、hao123 之类的导航网站；在浏览器里改回主页，过一会儿又变回去了。
keywords:
  - 主页被改
  - 主页被篡改
  - 首页被改
  - 首页被篡改
  - 浏览器主页被改
  - 浏览器首页被改
  - 主页改不回来
  - 浏览器被劫持
  - 主页被劫持
  - 打开浏览器就是2345
  - 打开浏览器就是hao123
  - 2345导航
  - hao123
  - 导航网站
  - 浏览器自动打开网页
