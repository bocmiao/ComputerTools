causes:
  - zh-CN: 装软件时捆绑装上了「导航」「主页保护」一类的软件，它在浏览器快捷方式的后面加了自己的网址（最常见，在浏览器设置里怎么改都没用）
  - zh-CN: 捆绑软件还在电脑上，改回来以后过几天又被改了
  - zh-CN: 浏览器装了不认识的扩展，它改了主页和搜索引擎
  - zh-CN: 有软件用「策略」锁住了浏览器的主页（浏览器设置里会写着「由你的组织管理」）
maturity: semi
steps:
  - check: security.browser-shortcuts
    fixes: [security.browser-shortcuts-clean]
  - check: network.hosts
    fixes: [network.hosts-cleanup]
  - check: security.default-browser
guide:
  zh-CN: |
    先看上面的检查结果：浏览器快捷方式后面被加了网址的，点「去掉浏览器快捷方式后面被加的网址」，只去掉网址，能撤销。改完以后，从桌面、任务栏打开浏览器就不会再先打开导航网站了。上面说默认浏览器不是你平时用的那个（被改成了别的浏览器）的，点下面的「默认应用」改回来。

    然后把改它的软件找出来，不然过些天又会被改回去：

    1. 打开小工具「装了哪些程序」，看看最近装了哪些不认识的软件（名字里常有「导航」「主页」「浏览器保护」「上网助手」「看图」「壁纸」「压缩」这类字眼），到「设置 → 应用」里卸载掉。
    2. 在浏览器里把主页、启动时打开的网页和默认搜索引擎改回来：Chrome 在「设置 → 重置设置 → 将设置还原为原始默认设置」，Edge 在「设置 → 重置设置 → 将设置还原为其默认值」，都只清掉主页、搜索引擎、扩展的开关这些，不删书签和保存的密码。360、QQ 这些浏览器在它自己的设置里有「锁定主页」，改回来以后锁上。
    3. 看看浏览器的扩展（地址栏里输入 chrome://extensions 或者 edge://extensions），不认识的、不记得装过的，删掉。
    4. 用 Windows 安全中心全盘扫描一次（「设置 → 隐私和安全性 → Windows 安全中心 → 病毒和威胁防护 → 扫描选项 → 完全扫描」）。

    浏览器设置里写着「由你的组织管理」、主页那一项是灰的改不了：是有软件用策略锁住了主页。单位、学校的电脑是正常的，找管理员；自己的电脑请懂哥帮忙看看。
links: ["tool:system.installed-programs", "tool:settings.default-apps"]
