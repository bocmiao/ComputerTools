# 症状：命令提示符里提示「不是内部或外部命令」（调研 3.1、3.4「上不了网」里的「ping、ipconfig 失效」）。
# 查系统的 Path、PATHEXT 环境变量（system.command-path → 修复 system.command-path-repair：少了的 Windows 文件夹加回最前面、
# 类型改回 REG_EXPAND_SZ、PATHEXT 补上 .EXE 这些）。只有某个软件的命令（python、java、adb）找不到的，是它的文件夹不在 Path 里，
# 给「环境变量」的入口和图文指引。
id: command-not-found
schema_version: 1
title: { zh-CN: 命令提示符里提示「不是内部或外部命令」 }
category: system
summary:
  zh-CN: 在命令提示符（cmd）或者 PowerShell 里输入 ping、ipconfig，或者装好的 python、java、adb，提示「不是内部或外部命令，也不是可运行的程序或批处理文件」。
keywords:
  - 不是内部或外部命令
  - 不是内部或外部命令也不是可运行的程序
  - 也不是可运行的程序或批处理文件
  - ping不是内部或外部命令
  - ipconfig不是内部或外部命令
  - cmd命令用不了
  - 命令提示符用不了
  - python不是内部或外部命令
  - java不是内部或外部命令
  - javac不是内部或外部命令
  - adb不是内部或外部命令
  - pip不是内部或外部命令
  - git不是内部或外部命令
  - 环境变量
  - 环境变量被删了
  - 环境变量改坏了
  - 配置环境变量
  - path环境变量
  - 系统变量path
  - path被覆盖
  - pathext
  - is not recognized as an internal or external command
  - 无法将项识别为 cmdlet
causes:
  - zh-CN: 装软件、照着网上的教程配置环境变量时，把系统的 Path 整个覆盖了，Windows 自带的文件夹没了（ping、ipconfig 都找不到）
  - zh-CN: Path 的类型被改成了普通字符串，里面的 %SystemRoot% 不再被换成 Windows 文件夹
  - zh-CN: PATHEXT 被改了，少了 .EXE，命令提示符认不出程序
  - zh-CN: 新装的软件没有把自己的文件夹加进 Path（python、java、adb 最常见）
  - zh-CN: 改完环境变量没有把命令提示符关掉重开
maturity: semi
steps:
  - check: system.command-path
    fixes: [system.command-path-repair]
guide:
  zh-CN: |
    先看上面的检查结果：系统的 Path 被改坏了的，点「修好系统的 Path 环境变量」，新打开的命令提示符里就能用了。

    检查都正常、只有某个软件的命令（python、java、adb、git 这些）提示「不是内部或外部命令」的，是这个软件所在的文件夹不在 Path 里：

    1. 很多软件安装时有一个「Add to PATH」（加入环境变量）的选项：重新运行安装程序，勾上它就行（Python 的安装界面最下面就有）。
    2. 也可以自己加：点下面的「环境变量」，在下面的「系统变量」里选中 Path，点「编辑」→「新建」，填上这个软件的 exe 所在的文件夹（比如 C:\Program Files\Java\jdk-21\bin），一路点「确定」。不要点「编辑文本」把整行改掉，也不要用 setx 命令改 Path：超过 1024 个字会被截断，Windows 自带的文件夹就丢了。
    3. 改完要把命令提示符关掉重新打开才生效；VS Code 这类软件里的终端，要把软件整个关掉重开。
    4. 在 PowerShell 里运行当前文件夹里的程序，要在前面加 .\（比如 .\adb devices），不加会提示「无法将项识别为 cmdlet」，这不是出错。
links: ["tool:open.environment-variables"]
