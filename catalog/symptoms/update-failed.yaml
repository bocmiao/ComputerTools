causes:
  - zh-CN: 更新被「关更新」的软件或者网上的教程关掉了（服务被禁用、改了策略、一暂停就是好几年）
  - zh-CN: 有更新在等重启，没重启之前别的更新装不上
  - zh-CN: C 盘空间不够
  - zh-CN: 连不上微软的更新服务器（开着「梯子」、加速器，或者系统时间不对）
  - zh-CN: 卸载了的代理软件、加速器还把系统服务用的代理（WinHTTP 代理）指向这台电脑上已经不在运行的程序，更新下载不了
  - zh-CN: 下载下来的更新文件坏了
  - zh-CN: Windows 存放系统组件的地方（组件存储）坏了，比如上次更新没装完，或者被「清理」软件删过 WinSxS 里的文件
  - zh-CN: 第三方杀毒软件、「电脑管家」、备份软件挡住或者占着更新要用的文件
  - zh-CN: 升级大版本时，某个驱动或者软件不兼容
maturity: semi
steps:
  - check: update.blocked
    fixes: [update.enable-services]
  - check: network.hosts
    fixes: [network.hosts-cleanup]
  - check: network.winhttp-proxy
    fixes: [network.winhttp-proxy-off]
  - check: system.pending-reboot
  - check: update.history
  - check: disk.system-free-space
  - check: system.clock
guide:
  zh-CN: |
    先看上面的检查结果，按提示处理。

    还是装不上的话，按这个顺序试：

    1. 重启一次电脑：点「开始 → 电源 → 更新并重启」（没有这一项就点「重启」），重启完再到「Windows 更新」里点「重试」。
    2. 卡在「正在配置更新」「请勿关闭计算机」的界面：先耐心等，大的更新要一两个小时；超过半天一点都不动，再长按电源键关机、重新开机，系统一般会自己退回去。
    3. C 盘至少留出 10 GB 的空间，升级大版本（比如 Windows 11 的新版本）要 20 GB 以上。
    4. 下载老是失败、同一个更新反复装不上：用小工具「重置更新组件」把更新的下载缓存换成新的（旧的改名留着，不删除），再检查更新。也可以运行 Windows 自带的疑难解答：Windows 11 在「设置 → 系统 → 疑难解答 → 其他疑难解答」里点「Windows 更新」旁边的「运行」；Windows 10 在「设置 → 更新和安全 → 疑难解答 → 其他疑难解答」里。
    5. 开着「梯子」、加速器、代理软件的，先关掉再更新；开着第三方杀毒软件、「电脑管家」的，先暂时退出，装好以后再打开。
    6. 错误代码是 0x80073712、0x800F081F、0x800F0831 这类（组件存储坏了）：用小工具「检查并修复系统文件」修一遍、重启以后再试。还不行，Windows 11 可以用小工具「恢复（重装当前版本的 Windows）」，点「使用 Windows 更新修复问题」旁边的「立即重新安装」，应用、文件和设置都保留。
    7. 升级大版本老是失败、退回原来的版本：先更新显卡驱动、暂时卸载第三方杀毒软件再试；急着升级的，可以用微软官网的「Windows 11 安装助手」，或者请懂哥帮忙。
    8. 不要用「一键关闭更新」这类软件，也不要删 C:\Windows\WinSxS、C:\Windows\Installer 里的文件：它们正是更新装不上的常见原因。

    还可以用微软自带的「Windows 更新疑难解答」自动查一遍；下载一直卡住的，再用「后台智能传输服务（BITS）疑难解答」查一查（点下面的按钮；它们在 Windows 的「获取帮助」应用里，要联网）。
