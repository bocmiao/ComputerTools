# 症状：系统更新失败、卡住（计划书 4.2「系统更新失败」；建议 3，和建议 17 里跟更新有关的部分）。
# 先看更新是不是被关掉了（服务被禁用能一键恢复、能撤销；策略、登录账户、超长暂停说清楚怎么改回来——小药箱不写更新策略），
# 再看 hosts 文件有没有屏蔽更新用的网站（能一键删掉那几行、能撤销），是不是在等重启、最近哪个更新没装上（错误代码翻成大白话）、C 盘空间、系统时间。
# 下载的更新文件坏了的，用小工具「重置更新组件」（停服务、缓存目录改名不删除、再启动服务）。
id: update-failed
schema_version: 1
title: { zh-CN: 系统更新失败、卡住 }
summary:
  zh-CN: Windows 更新装不上、报错代码，一直卡在「正在下载」「正在安装」，或者更新被关掉了、打不开。
