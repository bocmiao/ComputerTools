# 症状：电脑老弹广告、弹窗。先查 Windows 自己的推荐和推广（system.windows-ads，六样各有一个能撤销的关闭设置），再查浏览器
# 快捷方式有没有被加网址（一打开浏览器就是导航网站，常和弹窗一起出现）。别的软件弹的广告没法一键修：页面上有「弹窗是哪个
# 软件的」（界面按症状 id 放进来，见 app/src/views/SymptomsView.vue）找出是哪个程序弹的、属于哪个已安装的软件，
# 还列出开机启动项（和「开机慢」同一个）能直接停用。手动步骤：卸载、关掉软件里的资讯弹窗、网站通知、以后怎么装软件。
