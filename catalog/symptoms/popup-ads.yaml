causes:
  - zh-CN: 装软件时顺带装上的「全家桶」：在下载站点了「高速下载」，或者安装时没有取消勾选推荐的软件
  - zh-CN: 软件自带的「资讯」「热点」弹窗：压缩、看图、输入法、杀毒、驱动、清理这类免费软件里常见
  - zh-CN: 网站的通知：以前在某个网页上点过「允许」，浏览器会一直在右下角弹它的推送
  - zh-CN: Windows 自己的推荐：时不时弹提示，锁屏、开始菜单、「设置」、资源管理器里夹带推广，还会悄悄装推荐的应用
  - zh-CN: 开机自己启动的软件越多，弹窗越多
maturity: semi
steps:
  - check: system.windows-ads
    fixes:
      - ads.tips-off
      - ads.lockscreen-tips-off
      - ads.start-recommendations-off
      - ads.settings-suggestions-off
      - ads.silent-app-installs-off
      - explorer.hide-sync-ads
  - check: security.browser-shortcuts
    fixes: [security.browser-shortcuts-clean]
guide:
  zh-CN: |
    先用上面的「弹窗是哪个软件的」找出是谁弹的：等弹窗出来，点「开始找」，在倒数完之前把鼠标移到弹窗上停住（不用点它）。知道是哪个软件以后：

    1. 不认识、用不上的软件：在「设置 → 应用 → 已安装的应用」里卸载。卸载时每一步都看清楚：有的卸载程序把「保留」「取消」做得很显眼，要找「继续卸载」「残忍卸载」这类按钮。
    2. 还要用的软件：打开它的设置（常在右上角的菜单里），找「资讯」「热点」「弹窗推荐」「消息中心」「开机启动」这类选项，都关掉。
    3. 开机自己启动的：在上面的「管理开机启动项」里把用不上的停用（只是不让它开机自己启动，软件还在，能恢复）。停用了还是照样弹、「弹窗是哪个软件的」找出来的程序在开机启动项里找不到的，多半藏在计划任务里：点下面的「计划任务里的第三方任务」，隐藏的、用脚本运行的排在最前面，在「任务计划程序」里右键「禁用」（能再启用）。
    4. 右下角那种通知（通知最上面写着软件或者浏览器的名字）：是浏览器发的，多半是以前在某个网站上点过「允许」通知，在浏览器的设置里搜「通知」，把那个网站删掉或者改成「阻止」；是别的软件发的，在「设置 → 系统 → 通知」里把它关掉。
    5. Windows 自己的推荐和广告：上面的检查报了的，按列出的修复一项一项关掉，都能撤销。

    以后装软件：尽量从软件的官网或者 Microsoft Store 下载，别点下载站的「高速下载」「安全下载」按钮；安装时选「自定义安装」，把顺带勾上的其他软件、「设为主页」都取消勾选。

    关掉以后还是弹，弹的是色情、赌博这类广告，或者浏览器的主页、搜索被改了改不回来：可能中了流氓软件或病毒，用杀毒软件做一次全面扫描（Windows 自带的「Windows 安全中心 → 病毒和威胁防护」就可以）。
