# 症状：电脑一会儿不动就黑屏、睡着了、要重新输密码；笔记本接着显示器合上盖子，电脑就停了（调研 A17）。先查插电时关屏幕和
# 睡眠的等待时间、屏幕保护程序、单位设的「多久不动就锁屏」策略（system.power-timeouts，短的给修复 power.longer-timeouts），
# 再查合上盖子时做什么（system.lid-action，台式机不适用；修复 power.lid-close-do-nothing）。
# 「动态锁」「状态感知」（微软《在 Windows 11 中管理状态感知设置》）、醒来要不要输密码只给指引，不改。
