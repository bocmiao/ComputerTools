causes:
  - zh-CN: 电源设置里「关闭屏幕」「睡眠」的时间太短（有的电脑出厂只有几分钟）
  - zh-CN: 开着屏幕保护程序，还勾着「在恢复时显示登录屏幕」
  - zh-CN: 单位或者安全软件设了「多久不动就锁屏」的安全策略
  - zh-CN: 笔记本合上盖子默认会睡眠，接着外接显示器也一样
  - zh-CN: Windows 11 的「动态锁」「状态感知」在你走开时锁屏、关屏幕
maturity: semi
steps:
