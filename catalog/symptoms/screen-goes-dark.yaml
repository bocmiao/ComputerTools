guide:
  zh-CN: |
    先看上面的检查结果，时间太短的点修复就行。想自己细调的：

    1. 关屏幕、睡眠的时间：点下面的「电源和睡眠」，Windows 11 在「屏幕、睡眠和休眠超时」里，Windows 10 在「屏幕」「睡眠」下面，插着电源和用电池时分开设。下载、跑程序要一整晚的，把「睡眠」设成「从不」。
    2. 醒来要输密码：点下面的「登录选项」，把「如果你已离开，Windows 应在何时要求你重新登录」改成「从不」（只在自己家里、不会有别人乱动的电脑上这样做）。
    3. 屏幕保护程序：点下面的「锁屏界面和屏幕保护程序」，在最下面的「屏幕保护程序」里把「等待」调长、取消「在恢复时显示登录屏幕」，或者选「无」。
    4. Windows 11：「登录选项」里的「动态锁」（带着配对的手机走远了就锁屏）；带人体感应的笔记本还有「状态感知」（在「设置 → 系统 → 电源和电池 → 屏幕和睡眠」里，离开电脑就关屏幕、锁屏），不需要的关掉。
    5. 笔记本接显示器合上盖子：上面的检查说合上盖子会睡眠的，点它下面的修复；也可以在控制面板「电源选项 → 选择关闭笔记本计算机盖的功能」里改。
    6. 单位的电脑多久不动就锁屏，是管理员按规定设的，请找单位的电脑管理员。
