causes:
  - zh-CN: 不小心按到了 Ctrl + Alt + 方向键：有的电脑（Intel 显卡）的显卡驱动把它当成转屏的快捷键
  - zh-CN: 「显示设置」里的「显示方向」被改成了纵向或者翻转
  - zh-CN: 平板、二合一电脑拿斜了，画面跟着自动转了
maturity: guide
guide:
  zh-CN: |
    1. 先试快捷键：同时按 Ctrl + Alt + ↑（向上的方向键），画面转回来就好了。只有一部分电脑（Intel 显卡、开着热键的）有这个快捷键，没反应就看下一步。
    2. 点下面的「打开「屏幕」设置」（或者在桌面空白处点右键 →「显示设置」），在「显示方向」里选「横向」，再点「保留更改」：15 秒内不点会自己变回去。鼠标的方向跟着屏幕反了，慢慢挪就行。
    3. 接了好几个显示器的：先在设置最上面点选转了方向的那个屏幕，再改它的「显示方向」。
    4. 平板、二合一电脑：画面会跟着拿的方向自动转。按 Win + A 打开快速设置，点「旋转锁定」把方向锁住。
    5. 老是误按到转屏快捷键：Intel 显卡的，在「英特尔显卡控制中心」的「系统 → 热键」里把热键关掉。
