# 症状：屏幕画面倒过来了、横过来了。只给图文指引：常见的是按到了显卡驱动的转屏快捷键（Intel 显卡的 Ctrl + Alt + 方向键），
# 或者平板、二合一电脑自动旋转了。改回来在「设置 → 系统 → 屏幕 → 显示方向」，平板在快速设置（Win + A）里锁定旋转。
