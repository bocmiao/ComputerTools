# 症状：照片、计算器、截图工具这些 Windows 自带的应用（应用商店里的那种）打不开、闪退、一直转圈。办法照微软《修复 Windows 中
# 的应用和程序》：「设置 → 应用 → 高级选项」里先修复、再重置；常见的几个应用直接给打开它「高级选项」页的按钮
# （ms-settings:appsfeatures-app?<包系列名>，微软《Launch Windows Settings》）。没有按钮的（截图工具、画图、记事本、Windows 安全
# 中心）教路径：截图工具在微软官方文档里查不到包系列名，Windows 安全中心在 Windows 10、11 上的包名不一样（微软《Customize the
# Start layout》），所以不做固定的按钮。GitHub 上一键重置所有应用、重建应用数据库的脚本太猛，不用。
id: builtin-app-broken
schema_version: 1
title: { zh-CN: 照片、计算器这些自带的应用打不开 }
category: software
summary:
  zh-CN: Windows 自带的照片、计算器、截图工具、相机、媒体播放器这些应用，点了没反应、一打开就闪退，或者一直停在启动画面上转圈。
