causes:
  - zh-CN: 应用自己的数据坏了（常见于系统或者应用更新以后）
  - zh-CN: 应用没有更新完，和现在的 Windows 版本对不上
  - zh-CN: 系统时间不对，应用的许可证验证不过
  - zh-CN: 应用被「优化」软件、精简过的系统删掉了
  - zh-CN: 系统文件坏了
maturity: semi
steps:
  - check: system.clock
guide:
  zh-CN: |
    1. 先重启一次电脑：应用卡在后台的时候，关掉重开也打不开，重启以后常常就好了。
    2. 照片、计算器、相机、媒体播放器（Windows 10 上叫 Groove 音乐）、应用商店：点下面对应的「高级选项」按钮，先点「终止」，再点「修复」（不删数据），然后打开试试；还不行点「重置」（会清掉这个应用自己的设置和登录，照片、音乐这些文件不会删）。
    3. 截图工具、画图、记事本、Windows 安全中心这些下面没有按钮的：打开「设置 → 应用 → 安装的应用」（Windows 10 是「应用和功能」），找到它，点右边的「…」或者名字下面的「高级选项」，一样先修复、再重置。Windows 10 上的「Windows 安全中心」没有这一页：先看是不是装了别的杀毒软件（装了以后病毒防护会交给它），再用「检查并修复系统文件」。
    4. 打开 Microsoft Store，在「库」里点「获取更新」，把这个应用更新到最新。应用商店也打不开的，看「应用商店打不开」。
    5. 提示「此应用无法打开」、「你需要一个新应用来打开此 ms-… 链接」的，多半是应用被「优化」软件、精简过的系统删掉了：到 Microsoft Store 里搜这个应用重新装上。
    6. 还不行：用「检查并修复系统文件」修一遍，重启以后再试。
