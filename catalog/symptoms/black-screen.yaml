# 症状：开机（登录以后）黑屏，只有鼠标，没有桌面和任务栏。先看登录以后启动的程序有没有被病毒、锁机软件改掉（system.winlogon →
# 修复 system.winlogon-defaults），再看最近有没有程序崩溃（资源管理器反复崩溃会这样，system.reliability-recent），最后看设备和驱动
# （显卡驱动出错，hardware.device-problems）。
# 用户多半是在别的电脑、手机上看这个指引，或者已经用任务管理器把桌面叫出来了：指引按「不用鼠标也能做」的顺序写，
# 先快捷键、再任务管理器、再安全模式和卸载更新。
id: black-screen
schema_version: 1
title: { zh-CN: 开机黑屏，只有鼠标 }
summary:
  zh-CN: 开机、登录以后屏幕一直是黑的，只有一个鼠标箭头能动，没有桌面图标和任务栏；或者桌面、任务栏时有时无，一会儿就消失。
keywords:
  - 开机黑屏
  - 黑屏只有鼠标
  - 开机黑屏有鼠标
  - 黑屏有鼠标
  - 黑屏只有光标
  - 登录后黑屏
  - 进不了桌面
  - 桌面不显示
  - 桌面没了
  - 没有任务栏
  - 任务栏不见了
  - 任务栏消失
  - 桌面黑屏
  - 更新后黑屏
  - 黑屏转圈
  - 资源管理器没启动
  - explorer没启动
  - explorer.exe
  - 锁机
  - 桌面被替换
causes:
  - zh-CN: 资源管理器（explorer.exe，桌面和任务栏就是它）没启动起来或者一直崩溃，常见于刚装的更新、显卡驱动、软件出了问题
  - zh-CN: 病毒、锁机软件把登录以后启动的程序换掉了
  - zh-CN: 画面输出到了另一个屏幕（连过投影仪、第二个显示器）
  - zh-CN: 系统还在装更新、准备桌面，还没好
maturity: semi
steps:
  - check: system.winlogon
    fixes: [system.winlogon-defaults]
  - check: system.reliability-recent
  - check: hardware.device-problems
guide:
  zh-CN: |
    黑屏的时候，按下面的顺序试（不用鼠标也能做）：

    1. 先等几分钟：刚更新完、第一次开机时，黑屏转圈可能是在准备桌面。
    2. 按 Win + Ctrl + Shift + B（Win 是画着 Windows 标志的键）：会重新加载显卡驱动，屏幕闪一下、响一声。
    3. 按 Win + P，再按几次方向键选「仅电脑屏幕」、按回车：连过投影仪、第二个显示器的，画面可能跑到别处去了。
    4. 按 Ctrl + Shift + Esc 打开任务管理器，点「运行新任务」（Win10 在「文件」菜单里），输入 explorer.exe，回车。桌面出来了，说明是资源管理器没启动：打开小药箱查一下上面几步（登录以后启动的程序有没有被改掉、最近有没有程序一直崩溃）。
    5. 任务管理器也打不开：按 Ctrl + Alt + Del，点右下角的电源图标，按住 Shift 再点「重启」，依次选「疑难解答 → 高级选项 → 启动设置 → 重启」，重启以后按 4 进「安全模式」。安全模式里正常的，多半是显卡驱动或者开机自动启动的软件：卸载最近装的显卡驱动、软件。
    6. 刚装了更新以后出现的：在第 5 步的「高级选项」里选「卸载更新」，先卸载最近的质量更新；还不行，选「系统还原」回到出问题之前。
    7. 查出登录以后启动的程序被改过的，改完以后用「Windows 安全中心」全盘扫描一次病毒。

    都不行的话，先把重要文件备份出来（可以用 U 盘启动盘），再请懂哥帮忙。
