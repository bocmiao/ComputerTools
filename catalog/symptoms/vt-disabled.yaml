# 症状：安卓模拟器很卡、打不开，提示「请开启 VT」「虚拟化技术未开启」；WSL 2、虚拟机报 0x80370102 这类错误。
# 查 hardware.virtualization（只读）；VT 只能在 BIOS（UEFI）里开，指引按微软《Enable virtualization on Windows》：从「设置 → 系统
# → 恢复 → 高级启动」进 UEFI 固件设置（各品牌都一样），再补上各品牌开机按的键。WSL 2 还要「虚拟机平台」这个 Windows 功能。
