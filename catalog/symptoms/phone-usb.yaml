# 症状：手机用数据线连上电脑只充电，「此电脑」里看不到手机，照片、文件拷不出来。多半是手机上没选「传输文件」、数据线只能
# 充电；也查设备管理器（hardware.device-problems：手机这类便携设备出问题时算在 peripheral 里，只计数、不列名字）。苹果手机
# 要在手机上点「信任」；Windows N 版没装「媒体功能包」时认不出手机（微软《Media Feature Pack list for Windows N editions》：
# 没有它时 Windows 便携设备不能浏览文件）。只给指引，不改设置。
id: phone-usb
schema_version: 1
title: { zh-CN: 手机连电脑只充电，传不了照片和文件 }
summary:
  zh-CN: 手机用数据线插上电脑，只显示在充电，「此电脑」里看不到手机，照片、文件拷不出来。
