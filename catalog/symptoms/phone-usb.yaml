causes:
  - zh-CN: 手机上 USB 的用途是「仅充电」，没改成「传输文件」
  - zh-CN: 数据线只能充电、不能传数据，或者 USB 口、扩展坞接触不好
  - zh-CN: 手机锁着屏，或者苹果手机上没点「信任」
  - zh-CN: 电脑上手机的驱动出了问题；版本号带 N 的 Windows 没装「媒体功能包」
maturity: semi
steps:
  - check: hardware.device-problems
guide:
  zh-CN: |
    1. 先解锁手机。安卓手机插上以后，下拉手机顶上的通知栏，点「USB 用于充电」「正在通过 USB 充电」这条通知，改成「传输文件」（有的写「文件传输」「MTP」）。没有这条通知的，在手机的「设置」里搜「USB」找一找。
    2. 换一根数据线再试：很多线只能充电，不能传数据（买手机时送的线一般可以）。台式机插到机箱后面的 USB 口上，别插扩展坞、USB 集线器、键盘上的口。
    3. 苹果手机：插上以后解锁手机，弹出「要信任此电脑吗？」点「信任」，再输入锁屏密码；照片在「此电脑」的「Apple iPhone → Internal Storage → DCIM」里。要备份、传别的文件，到 Microsoft Store 装苹果的「Apple 设备」应用（老版本的 Windows 装 iTunes）。
    4. 手机插着，上面的检查说「蓝牙耳机、手机、网络打印机这类连接过的设备里，有几项显示有问题」的：点下面的按钮打开设备管理器，在「便携设备」里找到手机（带黄色感叹号，名字一般是手机型号或者「MTP」），右键选「卸载设备」，拔下手机再插上，让 Windows 重新装驱动。
    5. 版本号带 N 的 Windows（比如「Windows 11 专业版 N」，欧洲买的电脑常见）：没装「媒体功能包」时认不出手机里的文件，在「设置 → 应用 → 可选功能」里添加「媒体功能包」，装完重启。
    6. 还不行：手机厂商一般有自己传文件的办法（华为的「华为分享」、小米的「小米互传」这类），急用的几张照片也可以先用微信、QQ 的「文件传输助手」传。
