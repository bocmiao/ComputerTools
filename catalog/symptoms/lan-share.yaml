causes:
  - zh-CN: Windows 把网络当成了「公用网络」，不让别的电脑看到这台，也不去找别的电脑
  - zh-CN: 「网络发现」「文件和打印机共享」没打开，或者 2017 年「永恒之蓝」时按教程关掉了 445 端口、Server 服务
  - zh-CN: 共享要用的系统服务被「优化」软件关掉了
  - zh-CN: 输入的账户密码不对：要输入对方电脑的账户和密码，微软账户是邮箱和微软账户的密码，不是开机 PIN 码
  - zh-CN: Win11 24H2 起默认不让「来宾」不输密码进共享、还要求 SMB 签名，老的 NAS、路由器上的共享、只支持 SMB1 的设备打不开
  - zh-CN: 两台电脑不在同一个网络里（一台连的是访客 WiFi，或者路由器开了「AP 隔离」）
maturity: semi
steps:
  - check: network.network-category
    fixes: [network.private-network]
  - check: network.sharing-services
    fixes: [network.enable-sharing-services]
  - check: network.sharing-firewall
  - check: network.smb-client
guide:
  zh-CN: |
    先看上面的检查结果：网络类型不对、服务被关掉的点修复；防火墙、老设备的问题照提示处理。共享的那台电脑上也要打开小药箱查一遍。

    其他情况：

    1. 直接用 IP 地址打开：按 Win + R，输入 \\对方电脑的 IP 地址（像 \\192.168.1.5），回车。对方的 IP 在那台电脑的「设置 → 网络和 Internet → 属性」里的「IPv4 地址」。用 IP 能打开、用名字打不开的，多半是「网络发现」没开，或者两台电脑不在同一个网络里。
    2. 弹出「输入网络凭据」：输入对方电脑的账户和密码，不是自己这台的。对方用微软账户登录的，用户名是微软账户的邮箱（或手机号），密码是微软账户的密码，不是开机用的 PIN 码；本地账户就是那台电脑的用户名和开机密码。对方电脑没设开机密码的，Windows 不允许空密码从网络登录，给它设一个密码。
    3. 以前输错过密码、Windows 记住了错的：打开「控制面板 → 凭据管理器 → Windows 凭据」，删掉对方电脑、NAS 那一条，再打开一次。
    4. 两台电脑要连同一个路由器：一台连「访客 WiFi」、或者路由器开了「AP 隔离」「客户端隔离」时，互相是看不到的。
    5. 对方电脑上共享文件夹：在那个文件夹上点右键 →「属性」→「共享」→「共享」，把要访问的账户加进去；在「高级共享设置」里打开「网络发现」「文件和打印机共享」，「密码保护的共享」保持打开。
    6. NAS、路由器上的 U 盘共享：到它的管理页面里升级固件，打开 SMB2、SMB3，建一个带密码的账户来登录。Win11 24H2 起 Windows 默认要求共享支持「SMB 签名」、不让「来宾」进，老设备做不到就会打不开；实在升级不了，用设备自带的 App 或者网页传文件。不建议为了它在电脑上打开 SMB1、来宾登录、关掉签名：这些都会让勒索病毒更容易进来。
    7. 装了 360、火绒这类安全软件的，看看它的防火墙里有没有拦截「局域网共享」「445 端口」的设置。

    常用的文件夹可以「映射网络驱动器」：在「此电脑」上点右键 →「映射网络驱动器」，文件夹填 \\IP 地址\共享名，勾上「登录时重新连接」，以后在「此电脑」里就能直接打开。
links: ["tool:open.advanced-sharing"]
