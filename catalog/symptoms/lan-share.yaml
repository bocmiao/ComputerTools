# 症状：共享文件夹打不开、「网络」里看不到别的电脑（0x80070035、0x80004005、来宾访问被阻止）。
# 按这个顺序查：网络是不是被当成了公用网络（network.network-category → 修复 network.private-network）、共享用的服务有没有被关掉
# （network.sharing-services → 修复 network.enable-sharing-services）、防火墙放不放行（network.sharing-firewall，只查不改）、
# 最近有没有因为对方只支持 SMB1、只让来宾进而被拒绝（network.smb-client，只查不改：打开 SMB1、来宾登录、关签名都在降低安全）。
# 指引里讲最常见的坑：用 IP 地址直接打开、输入对方电脑的账户密码（微软账户用邮箱和微软账户密码，不是 PIN）、清掉记错的凭据、
# 两台电脑不在同一个网络、NAS 和路由器要升级或建账户、共享文件夹的权限。
id: lan-share
schema_version: 1
title: { zh-CN: 共享文件夹打不开、看不到别的电脑 }
summary:
  zh-CN: 打开别的电脑、NAS、路由器上的共享文件夹时提示「找不到网络路径」（0x80070035）、「未指定的错误」（0x80004005）、「你不能访问此共享文件夹」；或者「网络」里看不到别的电脑，别人也看不到这台。
