# 症状：屏幕突然变成黑白、颜色反了、黑底亮字、发黄偏色。先看 Windows 的「颜色滤镜」「对比度主题」开着没有（display.colors →
# 修复 display.color-filter-off；对比度主题只能在「设置」里关）。别的情况给图文指引：夜间模式和护眼软件（发黄）、显卡控制面板
# 里被调低的饱和度、显示器自己的色彩模式、视频线没插紧（偏色）。
id: screen-colors
schema_version: 1
title: { zh-CN: 屏幕突然变成黑白、颜色不对 }
category: display
summary:
  zh-CN: 屏幕突然变成黑白（灰色）、颜色像底片一样反了、窗口变成黑底亮色的字，或者整个屏幕发黄、发红、偏色。
keywords:
  - 屏幕变黑白
  - 屏幕黑白
  - 电脑屏幕变成黑白
  - 屏幕变灰色
  - 屏幕灰色
  - 屏幕没有颜色
  - 屏幕颜色不对
  - 颜色不对
  - 颜色反了
  - 颜色反转
  - 屏幕反色
  - 像底片一样
  - 黑底白字
  - 黑色背景
  - 高对比度
  - 对比度主题
  - 颜色滤镜
  - 屏幕发黄
  - 屏幕发红
  - 屏幕偏色
  - 屏幕发紫
  - 屏幕发绿
  - win+ctrl+c
causes:
  - zh-CN: 不小心按到了「颜色滤镜」的快捷键 Win + Ctrl + C，屏幕变成黑白或者颜色反了
  - zh-CN: 不小心打开了「对比度主题」（高对比度），常是按到了左 Alt + 左 Shift + Print Screen
  - zh-CN: 开着「夜间模式」或者护眼软件，屏幕发黄
  - zh-CN: 显卡控制面板里的颜色、饱和度被调低了
  - zh-CN: 显示器自己的色彩模式被改了，或者视频线没插紧、坏了（常见的是偏红、偏绿、偏紫）
maturity: semi
steps:
  - check: display.colors
    fixes: [display.color-filter-off]
guide:
  zh-CN: |
    先看上面的检查结果：颜色滤镜、对比度主题开着的，照提示用快捷键或者「设置」马上关掉。

    其他情况：

    1. 屏幕发黄、偏暖：多半是「夜间模式」开着（或者到了它自动打开的时间），点小工具里的「夜间模式」关掉；装了护眼软件的，在护眼软件里关掉。
    2. 显卡控制面板里的颜色被调了：NVIDIA 显卡打开「NVIDIA 控制面板 → 显示 → 调整桌面颜色设置」，把「数字振动控制」改回 50%；Intel 显卡打开「英特尔显卡控制中心 → 显示 → 颜色」，点「恢复默认」；AMD 显卡打开「AMD Software → 显示」，把「饱和度」改回 100。
    3. 只有某一个软件里是黑白的：是那个软件自己的设置（比如阅读模式、护眼模式），到它的设置里关掉。
    4. 显示器的问题：按显示器上的菜单键，看看「色彩模式」「图像模式」是不是被改成了「黑白」「阅读」「护眼」，或者直接「恢复出厂设置」。
    5. 整个屏幕偏红、偏绿、偏紫，一碰视频线就变：多半是视频线（特别是老的蓝色 VGA 线）没插紧或者坏了，两头插紧、拧上螺丝，或者换一根线。
    6. 开机时的品牌标志、BIOS 画面也是黑白、偏色的：和 Windows 无关，是显示器、视频线或者显卡的问题，请懂哥或者售后看看。

    想确认屏幕本身有没有坏点、有没有哪种颜色显示不出来，点下面的「测一测屏幕坏点」，全屏依次看纯色。
