# 症状：鼠标一顿一顿、USB 设备老是断开又连上。先看「USB 选择性暂停」（hardware.usb-suspend → 修复 power.usb-suspend-off），
# 再看设备管理器里出错的设备（USB 控制器、集线器的驱动问题，hardware.device-problems）。
# 别的情况给图文指引：换主板后面的 USB 口、不用集线器和延长线、无线鼠标换电池和挪近接收器、USB 3.0 口和 U 盘干扰 2.4G 无线、
# 设备管理器里 USB 集线器的省电勾、供电不足的移动硬盘。
id: usb-disconnects
schema_version: 1
title: { zh-CN: 鼠标卡顿、USB 设备老断开 }
category: hardware
summary:
  zh-CN: 鼠标一顿一顿、偶尔不动，键盘偶尔没反应；U 盘、移动硬盘、USB 网卡用着用着就断开，还会听到「叮咚」的插拔声。
keywords:
  - 鼠标卡顿
  - 鼠标一卡一卡
  - 鼠标一顿一顿
  - 鼠标延迟
  - 鼠标偶尔不动
  - 鼠标断连
  - 无线鼠标卡
  - 键盘偶尔没反应
  - usb断开
  - usb老是断开
  - usb自动断开
  - usb设备断开又连上
  - 叮咚声
  - 老是有插拔声音
  - 移动硬盘断开
  - 移动硬盘老掉
  - u盘老是断开
  - usb网卡掉线
  - usb选择性暂停
causes:
  - zh-CN: 「USB 选择性暂停」开着，Windows 为了省电暂停了 USB 设备，有的设备醒不过来
  - zh-CN: USB 口接触不好、用了集线器或者延长线，供电不够（移动硬盘最常见）
  - zh-CN: 无线鼠标、键盘电量低，或者接收器离得太远、被 USB 3.0 的口和 U 盘干扰
  - zh-CN: USB 控制器、芯片组的驱动有问题
maturity: semi
steps:
  - check: hardware.usb-suspend
    fixes: [power.usb-suspend-off]
  - check: hardware.device-problems
guide:
  zh-CN: |
    先看上面的检查结果：「USB 选择性暂停」开着的点修复，马上生效。

    其他情况：

    1. 台式机把鼠标、键盘、移动硬盘插到主机背后的 USB 口（直接接在主板上），不要插前面板、显示器上的口，也不用 USB 集线器和延长线。
    2. 无线鼠标、键盘：先换电池或者充电；接收器离鼠标近一点，别和 U 盘、移动硬盘挤在相邻的口上（USB 3.0 的口和设备会干扰 2.4G 无线）；实在不行用一根 USB 延长线把接收器放到桌面上。
    3. 移动硬盘老掉：多半是供电不够，换一个口、换一根短一点的线，或者用带外接电源的硬盘盒；听到咔咔声、老是掉的，赶紧把数据拷出来。
    4. 设备管理器里还有一个省电的勾：展开「通用串行总线控制器」，在每个「USB 根集线器」上点右键 →「属性」→「电源管理」，取消「允许计算机关闭此设备以节约电源」。
    5. 到电脑品牌的官网按型号下载最新的芯片组驱动、USB 驱动装上。

    换了几个口、几个设备都这样，请懂哥看看主板和电源。

    鼠标点一下变成两下、滚轮乱跳，多半是鼠标的按键老化了，不是断开：点下面的「测一测鼠标按键」看看。
