# 症状：开机慢。目前有三个检测（开机用时、系统盘类型、内存大小），还没有启动项管理的修复，
# 所以 maturity 是 guide。以后加上「禁用启动项」（和任务管理器同样的 StartupApproved 机制）再升级。
id: slow-boot
schema_version: 1
title: { zh-CN: 开机慢 }
summary:
  zh-CN: 开机要等好几分钟，进了桌面还卡半天，点什么都没反应。
keywords:
  - 开机慢
  - 开机很慢
  - 开机特别慢
  - 启动慢
  - 电脑启动很慢
  - 开机要好几分钟
  - 开机一直转圈
  - 开机卡
  - 开机后很卡
  - 刚开机很卡
  - 开机黑屏很久
  - 开机自启动太多
causes:
  - zh-CN: 开机自动启动的软件太多（聊天、网盘、下载、各种助手）
  - zh-CN: 系统装在机械硬盘上
  - zh-CN: 内存太小（4 GB 及以下）
  - zh-CN: 刚装完系统更新，第一次开机要做收尾工作
  - zh-CN: 硬盘快满了，或者硬盘有坏道
maturity: guide
steps:
  - check: boot.last-boot-duration
  - check: hardware.system-disk-type
  - check: hardware.memory-size
guide:
  zh-CN: |
    先管住开机自动启动的软件：

    1. 按 Ctrl + Shift + Esc 打开任务管理器，点左边的「启动应用」（Windows 10 是上面的「启动」选项卡）。
    2. 看「启动影响」一栏，标着「高」的最拖慢开机。不需要一开机就用的，右键选「禁用」。
    3. 杀毒软件、输入法、声卡和触控板的驱动程序不要禁用；不认识的先在网上搜一下名字再决定。
    4. 「禁用」只是不再自动启动，软件本身还在，想用的时候照样能打开；以后想恢复，在同一个地方右键「启用」就行。
    5. 很多软件在自己的设置里也有「开机自动启动」的选项（比如微信、QQ、网盘、音乐软件），在那里关掉更彻底。

    再看硬件：

    - 系统装在机械硬盘上的，换一块固态硬盘是提升最大的办法，一两百元，开机能从一两分钟缩短到二三十秒。
    - 内存只有 4 GB 的，加到 8 GB 或以上。
    - 刚装完 Windows 更新后第一次开机慢是正常的，多重启一两次再看。
