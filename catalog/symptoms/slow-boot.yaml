# 症状：开机慢。界面上的「管理开机启动项」可以逐项停用、恢复注册表 Run 项和「启动」文件夹里的启动项，
# 开关和任务管理器的「启动应用」是同一个（StartupApproved，见 docs/architecture.md 第 9 节），只停用不删除，能撤销；
# 应用商店的应用在 Windows 的启动应用设置里管；任务计划仍需单独检查。
id: slow-boot
schema_version: 1
title: { zh-CN: 开机慢 }
summary:
  zh-CN: 开机要等好几分钟，进了桌面还卡半天，点什么都没反应。
keywords:
  - 开机慢
  - 开机很慢
  - 开机特别慢
  - 启动慢
  - 电脑启动很慢
  - 开机要好几分钟
  - 开机一直转圈
  - 开机卡
  - 开机后很卡
  - 刚开机很卡
  - 开机黑屏很久
  - 开机自启动太多
causes:
  - zh-CN: 开机自动启动的软件太多（聊天、网盘、下载、各种助手）
  - zh-CN: 系统装在机械硬盘上
  - zh-CN: 内存太小（4 GB 及以下）
  - zh-CN: 刚装完系统更新，第一次开机要做收尾工作
  - zh-CN: 硬盘快满了，或者硬盘有坏道
maturity: semi
steps:
  - check: boot.last-boot-duration
  - check: hardware.system-disk-type
  - check: hardware.memory-size
guide:
  zh-CN: |
    先看上面的「管理开机启动项」，不需要一开机就用的软件可以逐项点「停用自启」；想反悔，点「恢复自启」或到「修改日志」恢复。这里的开关和任务管理器的「启动应用」是同一个，在任务管理器里也能改回来。

    标着「建议保留」的（杀毒软件、输入法、声卡和触控板驱动这类）不要随意停用；不认识的先查清用途。从应用商店装的软件，点「管理其他启动应用」在 Windows 设置里管。也可以按 Ctrl + Shift + Esc 打开任务管理器，看「启动影响」一栏，标着「高」的最拖慢开机。很多软件在自己的设置里也有「开机自动启动」的选项，在那里关掉更彻底。

    再看硬件：

    - 系统装在机械硬盘上的，换一块固态硬盘是提升最大的办法，一两百元，开机能从一两分钟缩短到二三十秒。
    - 内存只有 4 GB 的，加到 8 GB 或以上。
    - 刚装完 Windows 更新后第一次开机慢是正常的，多重启一两次再看。
