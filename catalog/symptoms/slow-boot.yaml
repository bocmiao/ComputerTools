# 症状：开机慢。可逐项停用注册表 Run 启动项并从修改日志恢复；
# Windows 启动应用设置可管理列表外的启动项目；任务计划仍需单独检查。
id: slow-boot
schema_version: 1
title: { zh-CN: 开机慢 }
summary:
  zh-CN: 开机要等好几分钟，进了桌面还卡半天，点什么都没反应。
keywords:
  - 开机慢
  - 开机很慢
  - 开机特别慢
  - 启动慢
  - 电脑启动很慢
  - 开机要好几分钟
  - 开机一直转圈
  - 开机卡
  - 开机后很卡
  - 刚开机很卡
  - 开机黑屏很久
  - 开机自启动太多
causes:
  - zh-CN: 开机自动启动的软件太多（聊天、网盘、下载、各种助手）
  - zh-CN: 系统装在机械硬盘上
  - zh-CN: 内存太小（4 GB 及以下）
  - zh-CN: 刚装完系统更新，第一次开机要做收尾工作
  - zh-CN: 硬盘快满了，或者硬盘有坏道
maturity: semi
steps:
  - check: boot.last-boot-duration
  - check: hardware.system-disk-type
  - check: hardware.memory-size
guide:
  zh-CN: |
    先看上面的「管理开机启动项」，不需要一开机就用的软件可以逐项点「停用自启」；想反悔，点「恢复自启」或到「修改日志」恢复。

    这里列的是注册表 Run 项。点「管理其他启动应用」可打开 Windows 自带的启动应用设置，停用或恢复列表外的软件；也可以按 Ctrl + Shift + Esc 打开任务管理器，查看「启动影响」一栏。杀毒软件、输入法、声卡和触控板驱动不要随意停用；不认识的先查清用途。很多软件也可以在自己的设置里关闭「开机自动启动」。

    再看硬件：

    - 系统装在机械硬盘上的，换一块固态硬盘是提升最大的办法，一两百元，开机能从一两分钟缩短到二三十秒。
    - 内存只有 4 GB 的，加到 8 GB 或以上。
    - 刚装完 Windows 更新后第一次开机慢是正常的，多重启一两次再看。
