# 症状：软件报 WMI 错误、「无效类」，「系统信息」打不开，「WMI Provider Host」一直占着处理器。先做 WMI 自检（system.wmi）。
# 指引照微软《winmgmt》《WMI: Repository Corruption, or Not?》（先查一致不一致，不一致先 salvage；不要一上来就删仓库、不要把所有
# .mof 重新编译一遍）和《Troubleshoot WMI high CPU usage issues》（WMI Provider Host 占处理器多半是有软件、服务一直在查询）。
id: wmi-broken
schema_version: 1
title: { zh-CN: 软件报 WMI 错误、「系统信息」打不开 }
category: system
summary:
  zh-CN: 装软件、玩游戏、打开「系统信息」时报「WMI 错误」「无效类」「无法连接到 WMI」，错误代码 0x80041010、0x80041002；或者任务管理器里「WMI Provider Host」一直占着处理器。
