# 症状：上不了网。
# 目前只自动检查「代理残留」这一环（network.proxy-dead → 修复 network.proxy-off，局域网和拨号、VPN 连接都查），其余环节
# （网卡、IP、网关、DNS、系统时间……，见计划书 4.2）还没有检测，先用图文指引，所以 maturity 是 semi。
# 关键词里保留用户的口语「梯子」，界面文字里写「代理软件」。
id: network
schema_version: 1
title: { zh-CN: 上不了网 }
summary:
  zh-CN: 网页打不开、微信能用但浏览器不行、Wi-Fi 连上了却没网。
keywords:
  - 没网
  - 断网
  - 上不了网
  - 连不上网
  - 网络连不上
  - 网页打不开
  - 浏览器打不开网页
  - 微信能用网页打不开
  - QQ能上网页打不开
  - wifi连不上
  - wifi连上了没网
  - 显示无Internet
  - 右下角小地球
  - 网络图标有个叉
  - 代理服务器出现问题
  - 无法访问此页面
  - 梯子卸载后上不了网
  - 加速器卸载后没网
  - 网速很慢
causes:
  - zh-CN: 代理设置残留：代理软件、加速器卸载或崩溃后，系统代理还指着本机一个已经没人用的端口（微信、QQ 往往还能用，网页却打不开）
  - zh-CN: 路由器或光猫死机、没给电脑分到地址，重启一下常常就好
  - zh-CN: 宽带欠费，或者运营商那边的线路出了故障
  - zh-CN: 开了飞行模式、关了 Wi-Fi 开关，或者网卡驱动出了问题
  - zh-CN: DNS 出错：能登微信，但网页一个都打不开
  - zh-CN: 系统时间不对：所有 https 网站都会报证书错误
maturity: semi
steps:
  - check: network.proxy-dead
    stop_on: [advice, manual]
    fixes: [network.proxy-off]
guide:
  zh-CN: |
    小药箱会先帮你查「代理残留」。其他原因可以按下面的顺序自己排查，从最简单的开始：

    1. 先看是不是只有这台电脑上不了网：用手机连同一个 Wi-Fi 试试。手机也上不了，问题在路由器或宽带，不在电脑，直接从第 3 步开始。
    2. 看网线和电脑的网络开关：网线两头插紧；点任务栏右下角的网络图标，确认没有开「飞行模式」，Wi-Fi 是打开的。有的笔记本有 Wi-Fi 快捷键（一般是 Fn 加某个带信号图案的键）。
    3. 看路由器和光猫的指示灯：正常时灯是亮着或闪烁的。光猫上「LOS」或「光信号」灯亮红色、闪红色，说明光纤线路断了，只能找运营商。
    4. 重启路由器和光猫：拔掉电源，等 30 秒再插上，等两三分钟、灯稳定下来以后再试。很多时候这样就好了。
    5. 电脑上：重启一次电脑；装过代理软件或加速器的，先把它打开再正常退出，或者在它的设置里关掉「系统代理」。
    6. 还是不行，打运营商客服电话，报上宽带账号或装机地址，让他们查线路：电信 10000、移动 10086、联通 10010。
