# 症状：上不了网。按链路顺序查，断在哪一环就停在哪一环（计划书 4.2）：
#   1. network.connectivity：网卡和驱动、飞行模式、网线 / WiFi、有没有从路由器拿到地址、路由器通不通、宽带（断在宽带就给运营商电话）；
#   2. network.dns：能不能查到网站的地址（网络本身不通时不怪 DNS）；
#   3. network.proxy-dead：代理残留（→ 修复 network.proxy-off，局域网和拨号、VPN 连接都查）；
#   4. system.clock：系统时间跳回了过去（主板电池没电时常见），所有 https 网站都会报证书错误。放在最后：时间不对不影响前三步，
#      网络、DNS、代理都正常时，它常常就是网页打不开的原因。
# 前两步查出要用户动手的问题（advice / manual）就停；没查清楚（unknown，比如路由器和 DNS 都通、Windows 却说没网，
# 常常就是代理残留或者要网页登录）就接着往下查。
# 还没有做的环节：hosts、Winsock / LSP、重置 Winsock 和 TCP/IP、打开网络登录页，以及时间快了（查不出来），先写在图文指引里，
# 所以 maturity 仍是 semi。
# 关键词里保留用户的口语「梯子」，界面文字里写「代理软件」。
id: network
schema_version: 1
title: { zh-CN: 上不了网 }
summary:
  zh-CN: 网页打不开、微信能用但浏览器不行、Wi-Fi 连上了却没网。
keywords:
  - 没网
  - 断网
  - 上不了网
  - 连不上网
  - 网络连不上
  - 网页打不开
  - 浏览器打不开网页
  - 微信能用网页打不开
  - QQ能上网页打不开
  - wifi连不上
  - wifi连上了没网
  - 显示无Internet
  - 右下角小地球
  - 网络图标有个叉
  - 代理服务器出现问题
  - 无法访问此页面
  - 梯子卸载后上不了网
  - 加速器卸载后没网
  - 网速很慢
  - 飞行模式关不掉
  - 没有wifi选项
  - 找不到网卡
  - 网卡驱动
  - 重装系统后没网
  - 网线插了没反应
  - 宽带连不上
  - 找不到服务器的IP地址
  - DNS_PROBE_FINISHED_NXDOMAIN
causes:
  - zh-CN: 网卡驱动没装好（刚重装完系统时最常见），或者网卡被禁用了
  - zh-CN: 开了飞行模式、关了 WiFi，或者网线没插好
  - zh-CN: 路由器或光猫死机、没给电脑分到地址，重启一下常常就好
  - zh-CN: IP 地址或 DNS 是手动设置的，和现在的网络对不上（比如电脑是从单位拿回家的）
  - zh-CN: 宽带欠费，或者运营商那边的线路出了故障
  - zh-CN: 酒店、学校、商场的 WiFi 要先在网页上登录
  - zh-CN: DNS 出错：能登微信，但网页一个都打不开
  - zh-CN: 代理设置残留：代理软件、加速器卸载或崩溃后，系统代理还指着本机一个已经没人用的端口（微信、QQ 往往还能用，网页却打不开）
  - zh-CN: 系统时间不对：所有 https 网站都会报证书错误
maturity: semi
steps:
  - check: network.connectivity
    stop_on: [advice, manual]
  - check: network.dns
    stop_on: [advice, manual]
  - check: network.proxy-dead
    stop_on: [advice, manual]
    fixes: [network.proxy-off]
  - check: system.clock
    stop_on: [advice]
guide:
  zh-CN: |
    小药箱会按顺序查网卡、飞行模式、网线和 WiFi、路由器、宽带、DNS、代理残留和系统时间。都查过了还是上不了网，可以按下面的顺序自己试，从最简单的开始：

    1. 先看是不是只有这台电脑上不了网：用手机连同一个 WiFi 试试。手机也上不了，问题在路由器或宽带，不在电脑，直接看第 2 步和第 6 步。
    2. 重启路由器和光猫：拔掉电源，等 30 秒再插上，等两三分钟、指示灯稳定下来以后再试。光猫上「LOS」或「光信号」灯亮红色、闪红色，说明光纤线路断了，只能找运营商。
    3. 电脑上：重启一次电脑；装过代理软件或加速器的，先把它打开再正常退出，或者在它的设置里关掉「系统代理」。
    4. 看看任务栏右下角的日期和时间对不对（小药箱只查得出时间跳回了过去，时间快了查不出来）。不对的话，打开「设置 → 时间和语言 → 日期和时间」，打开「自动设置时间」；时间不对时，几乎所有网站都会报证书错误。
    5. 还不行，可以用 Windows 自带的「网络重置」：Windows 11 在「设置 → 网络和 Internet → 高级网络设置 → 网络重置」，Windows 10 在「设置 → 网络和 Internet → 状态」页的最下面。它会把所有网卡和网络设置恢复成刚装好系统时的样子，VPN、代理软件、虚拟机的虚拟网卡要重新装，WiFi 密码要重新输入，做完会重启电脑。拿不准的话请懂哥帮忙。
    6. 宽带的问题打运营商客服电话，报上宽带账号或装机地址，让他们查线路、看看是不是欠费了：电信 10000、移动 10086、联通 10010。
