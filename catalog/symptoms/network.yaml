guide:
  zh-CN: |
    小药箱会先查 Winsock 网络组件有没有被改坏，再按顺序查网卡、飞行模式、网线和 WiFi、路由器、宽带、DNS、代理残留和系统时间。都查过了还是上不了网，可以按下面的顺序自己试，从最简单的开始：

    1. 先看是不是只有这台电脑上不了网：用手机连同一个 WiFi 试试。手机也上不了，问题在路由器或宽带，不在电脑，直接看第 2 步和第 6 步。
    2. 重启路由器和光猫：拔掉电源，等 30 秒再插上，等两三分钟、指示灯稳定下来以后再试。光猫上「LOS」或「光信号」灯亮红色、闪红色，说明光纤线路断了，只能找运营商。
    3. 电脑上：重启一次电脑；装过代理软件或加速器的，先把它打开再正常退出，或者在它的设置里关掉「系统代理」。
    4. 连的是酒店、学校或商场的 WiFi、连上后仍无法上网的，可以点「打开网络登录页」试试；出现登录页时，先确认是当前网络提供方的页面，再输入信息。看看任务栏右下角的日期和时间对不对（小药箱只查得出时间跳回了过去，时间快了查不出来）。不对的话，打开「设置 → 时间和语言 → 日期和时间」，打开「自动设置时间」；时间不对时，几乎所有网站都会报证书错误。
    5. 还不行，可以用 Windows 自带的「网络重置」：Windows 11 在「设置 → 网络和 Internet → 高级网络设置 → 网络重置」，Windows 10 在「设置 → 网络和 Internet → 状态」页的最下面。它会把所有网卡和网络设置恢复成刚装好系统时的样子，VPN、代理软件、虚拟机的虚拟网卡要重新装，WiFi 密码要重新输入，做完会重启电脑。拿不准的话请懂哥帮忙。
    6. 宽带的问题打运营商客服电话，报上宽带账号或装机地址，让他们查线路、看看是不是欠费了：电信 10000、移动 10086、联通 10010。

    还有几种常见的情况：

    - ping 网址时提示「传输失败。常见故障。」，或者关掉 VPN、加速器以后就上不了网：多半是 VPN、加速器、安全软件装的网络组件出了问题。先打开它，在它自己的设置里点「修复」「恢复网络」，或者正常退出、卸载，再重启电脑；上面的 Winsock 检查查出问题的，用它下面的「重置 Winsock」；还不行用第 5 步的「网络重置」。
    - 插着网线又连着 WiFi、或者开着 VPN 时，ipconfig 里会有两个「默认网关」，一般没关系；上不了网时先断开其中一个（拔掉网线，或者关掉 WiFi、断开 VPN）试试。
    - 只有某一个网站提示「重定向次数过多」（ERR_TOO_MANY_REDIRECTS），别的网站正常：多半是这个网站的 Cookie 乱了，在浏览器里清除这个网站的 Cookie，或者换一个浏览器试试；系统时间不对也会这样。
    - 在命令提示符里输入 ping、ipconfig 提示「不是内部或外部命令」：不是网络的问题，看「命令提示符里提示「不是内部或外部命令」」。
