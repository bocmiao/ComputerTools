causes:
  - zh-CN: 要连的那台电脑是家庭版（包括「家庭中文版」），家庭版不能被远程桌面连；或者它没打开远程桌面
  - zh-CN: 要连的那台电脑关机了、睡着了，或者两台电脑不在同一个网络里（在家连单位的电脑，要单位开 VPN）
  - zh-CN: 用户名、密码填得不对：PIN 码、指纹不能用来登录远程桌面，用微软账户登录的要填微软账户的密码
  - zh-CN: 两台电脑有一台很久没更新，提示「CredSSP 加密数据库修正」
  - zh-CN: 「远程桌面服务」被「优化」软件关掉了、被单位的策略关掉了，或者被防火墙、安全软件拦住了
maturity: semi
steps:
  - check: network.remote-desktop
guide:
  zh-CN: |
    先看上面的检查：它查的是「别的电脑能不能连进这台电脑」。你是在这台电脑上去连别的电脑（比如在家连单位的电脑）的，上面的结果说的不是那台电脑，要在那台电脑上打开小药箱查一遍，或者照下面对着那台电脑检查。

    1. 先弄清楚：Windows 自带的远程桌面只能连专业版、企业版、教育版的电脑，家庭版（包括「家庭中文版」）不能被连，只能去连别人。要连的电脑得开着、没睡着：要从别处连的，在那台电脑的「设置 → 系统 → 电源」里把插着电源时的「睡眠」改成「从不」。
    2. 在要连的那台电脑上打开远程桌面：「设置 → 系统 → 远程桌面」，打开「远程桌面」开关（Windows 10 上叫「启用远程桌面」），点「确认」。同一页上能看到这台电脑的名字，记下来。
    3. 在要去连的这台电脑上点下面的「远程桌面连接」（或者按 Win + R，输入 mstsc 回车），在「计算机」里填那台电脑的名字（用名字连不上就填它的 IP 地址），点「连接」。那台电脑的端口改过的，名字后面要加上「:端口」。
    4. 提示「你的凭据不工作」「登录没有成功」：用户名、密码要填那台电脑上的账户。家里的电脑不能用 PIN 码、指纹、人脸登录远程桌面，要用密码；那台电脑是用微软账户登录的，用户名一般填微软账户的邮箱，密码填微软账户的密码（一直只用 PIN 码登录的，先在那台电脑上用密码登录一次）。不是管理员的账户，要在那台电脑的远程桌面设置里点「远程桌面用户」把它加上。之前保存错了密码的，在「远程桌面连接」里点「显示选项」，把保存的凭据删掉再连。
    5. 提示「出现身份验证错误。要求的函数不受支持……这可能是由于 CredSSP 加密数据库修正」：两台电脑里有一台很久没装更新了。把两台电脑都装上最新的 Windows 更新再连，这是微软给的办法。网上教的把「加密数据库修正」改成「易受攻击」会让电脑容易被攻击，别这么改。
    6. 提示「远程桌面由于以下原因之一无法连接到远程计算机」：那台电脑没打开远程桌面、关机或者睡着了、不在同一个网络里，或者被防火墙拦住了。在那台电脑上用小药箱查一下上面这一项；装了火绒、360 这类安全软件的，看看它有没有拦住远程桌面。
    7. 不在同一个网络里（比如在家连单位的电脑）：远程桌面默认只能在同一个局域网里连，要从外面连，请单位的网管开 VPN。别自己在路由器上把 3389 端口映射到外网，微软也不建议这样做，很容易被人试密码、中勒索病毒。只是临时请人帮忙操作的，用「远程求助（快速助手）」更省事。
    8. 连上以后，那台电脑上原来登录着的人会被退回锁屏：Windows 专业版同一时间只让一个人用，这是正常的。

    都试过还是不行，把报错的截图、两台电脑的 Windows 版本（「设置 → 系统 → 系统信息」里能看到）发给懂哥或者单位的网管。
