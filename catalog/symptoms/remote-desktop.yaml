# 症状：远程桌面连不上（Windows 自带的「远程桌面」，mstsc）。先查这台电脑能不能被连进来（network.remote-desktop，只读）：
# 小药箱在谁身上跑就查谁，从这台电脑去连别的电脑的，要到那台电脑上查。指引照微软的说明：
# - 《在电脑上启用远程桌面》：家庭版不能用作远程桌面主机；「设置 → 系统 → 远程桌面」打开；管理员和「远程桌面用户」里的账户能连；
# - 《如何使用远程桌面》：远程桌面页上看电脑名称，用「远程桌面连接」连；
# - 《Remote Desktop can't connect to the remote computer》：「远程桌面由于以下原因之一无法连接到远程计算机」的原因（没打开、
#   关机、网络不通、端口、防火墙、杀毒软件）；
# - 《Error CredSSP encryption oracle remediation》：两台电脑都装上 CredSSP 更新（最新的 Windows 更新）；把「加密数据库修正」
#   改成「易受攻击」的办法会降低安全性，不教；
# - 《Remote Desktop sign-in with Windows Hello for Business》：用 PIN、指纹登录远程桌面要单位部署证书，家里的电脑要用密码；
# - 《允许从网络外部访问电脑》：不建议把电脑直接接入 Internet（端口转发），最好用 VPN。
# 按钮：远程桌面设置页、远程桌面连接（mstsc）、远程求助（快速助手）、服务。
