# 症状：Word、Excel 打不开、闪退、装不上（借鉴 Mocreak 的 Office 修复、冲突检测、完全卸载，全部用微软官方的办法）。
# 先查装了哪些 Office、有没有两套冲突（system.office-installs）。指引照微软的说明：
# - 《修复 Office 应用程序》：「应用和功能」里 Office 的「修改」，即点即用版先「快速修复」、不行「联机修复」（按钮 system.office-repair）；
# - 《在 Windows 电脑上以安全模式打开 Office 应用》：按住 Ctrl 双击，或者 Win + R 输入 winword /safe、excel /safe；
# - 错误代码 30015-6：先重启电脑，再联机修复；0xc0000142：先更新 Office，再联机修复，再装 Windows 更新；
# - 《从电脑卸载 Microsoft 365 或 Office》：卸不掉、卸不干净用微软的卸载支持工具（按钮 web.office-uninstall）；
# - 《在电脑上下载、安装或重新安装 Microsoft 365 或 Office》：用买 Office 的账户登录下载（按钮 web.office-install）。
# 标题栏显示「未经授权的产品」、提示要激活的，只说明是授权的问题、教用自己的账户登录；小药箱不做激活，也劝别用「激活工具」。
