# 症状：软件界面、解压出来的文件名、老游戏里的中文变成乱码。先看「非 Unicode 程序的语言」是不是中文（system.system-locale，只查不改），
# 再看中文系统上是不是勾了「Beta 版：使用 Unicode UTF-8」（system.code-page → 修复 system.utf8-beta-off）。
# 别的情况给图文指引：压缩包的文件名编码、txt 文件的编码、某一个软件自己的语言设置、字体被删（方框、问号）。
id: garbled-text
schema_version: 1
title: { zh-CN: 软件、文件名显示乱码 }
category: system
summary:
  zh-CN: 软件的界面和菜单、解压出来的文件名、老游戏里的中文变成「锟斤拷」「娴嬭瘯」这样的乱码，或者变成问号、方框。
