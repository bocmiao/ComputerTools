causes:
  - zh-CN: 勾上了「Beta 版：使用 Unicode UTF-8 提供全球语言支持」（有的游戏、开发工具的教程让勾的），老一点的中文软件和压缩包里的中文文件名就变成乱码
  - zh-CN: 「非 Unicode 程序的语言」不是中文（在国外买的电脑、装的英文版 Windows）
  - zh-CN: 压缩包是在苹果电脑、手机或者 Linux 上打包的，老的解压软件认不出文件名用的编码
  - zh-CN: 文本文件的编码和打开它的软件对不上
  - zh-CN: 系统自带的中文字体被「清理」软件删掉了，中文显示成方框
maturity: semi
steps:
  - check: system.system-locale
  - check: system.code-page
    fixes: [system.utf8-beta-off]
guide:
  zh-CN: |
    先看上面的检查结果：勾了 UTF-8 的点修复，系统区域不是中文的照提示改；改完都要重启电脑。

    其他情况：

    1. 只有压缩包里的文件名乱码：换一个新一点的解压软件（7-Zip、Bandizip 这类），或者在解压软件的设置里把「文件名编码」「代码页」换成「简体中文（GBK）」或者「UTF-8」再试。
    2. 记事本打开 txt 是乱码：点「文件 → 打开」，选中这个文件以后，在右下角的「编码」里换成「ANSI」或者「UTF-8」再打开；别的编辑器也有「编码」菜单。
    3. 只有某一个软件乱码、别的都正常：看看这个软件自己的设置里有没有「语言」，改成简体中文；或者到官网下载最新版。老游戏乱码的，也可以找它的简体中文版。
    4. 中文显示成方框、问号，而且很多软件都这样：可能是系统自带的中文字体被「清理」软件删了。打开「设置 → 个性化 → 字体」，看看有没有「微软雅黑」「宋体」；没有的话，用小工具「检查并修复系统文件」把系统自带的文件修回来。
    5. 网页乱码：现在的浏览器都会自动识别；个别老网站乱码，换一个浏览器试试，或者请网站修一下。
