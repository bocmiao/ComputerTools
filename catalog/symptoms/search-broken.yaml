# 症状：搜不到文件（开始菜单、资源管理器里搜索很慢、搜不出来）。先查 Windows 搜索服务有没有被「优化」软件关掉
# （system.windows-search → 修复 system.enable-windows-search，能撤销）。别的原因给图文指引：文件放在没建索引的位置
# （「搜索 Windows」里改成「增强」或者加上那个文件夹）、索引坏了（「索引选项」里重建）、开始菜单的搜索框卡住了
# （重启资源管理器）。微软《Fix problems in Windows Search》里的其他办法（重置搜索、重新注册应用包）要懂哥来做。
