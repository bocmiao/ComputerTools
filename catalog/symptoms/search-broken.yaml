causes:
  - zh-CN: Windows 搜索服务被「优化」软件关掉了：没有了搜索索引，搜起来又慢又搜不全
  - zh-CN: 要找的文件放在没建索引的位置（Windows 默认只给「用户」文件夹、开始菜单这些地方建索引，D 盘这些不在里面）
  - zh-CN: 刚装好系统、刚恢复搜索服务，索引还没建好；或者索引坏了
  - zh-CN: 开始菜单的搜索框卡住了，点了打不了字
maturity: semi
steps:
  - check: system.windows-search
    fixes: [system.enable-windows-search]
guide:
  zh-CN: |
    先看上面的检查结果：搜索服务被关掉了的，点「恢复 Windows 搜索服务」，重启电脑以后，Windows 会在后台重新建索引。建好之前搜索还是慢，一般要几十分钟到几个小时（电脑空闲时建得快）。

    其他情况：

    1. 搜不到放在 D 盘、E 盘这些地方的文件：Windows 默认只给「用户」文件夹、开始菜单这些地方建索引。打开「设置 → 隐私和安全性 → 搜索 Windows」（Windows 10 在「设置 → 搜索 → 搜索 Windows」），把「查找我的文件」改成「增强」（整个电脑都建索引），或者在下面加上常用的文件夹。
    2. 以前搜得到、现在搜不到了，或者搜出来的结果不对：打开小工具「索引选项」，点「高级」→「重建」。重建要一段时间，这期间搜索会慢。
    3. 开始菜单的搜索框点了没反应、打不了字：打开小工具「重启资源管理器」试试，不行就重启电脑。
    4. 只想在某个文件夹里找：在资源管理器里打开那个文件夹，在右上角的搜索框里搜。没建索引也能搜到，只是慢一些。

    都不行的话，微软还有重置搜索的办法，要改的东西多一些，请懂哥帮忙。
links: ["tool:open.indexing-options", "tool:system.restart-explorer"]
