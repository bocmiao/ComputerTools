# 症状：任务管理器、注册表编辑器、命令提示符打不开，提示「已被系统管理员停用」；或者「运行」、控制面板、右键菜单、
# 关机按钮不见了。先看是不是策略停用的（system.disabled-tools），再看是不是被「映像劫持」了（security.ifeo-hijack），
# 最后看是不是单位管理的电脑（system.managed-device：是的话这些多半是管理员有意设置的）。
# 都只检测、说明（策略、映像劫持都不改，计划书第五节）；指引里写清楚先杀毒、再怎么改回来。
