causes:
  - zh-CN: 病毒、流氓软件改了策略，让人打不开任务管理器、注册表编辑器，没法查、没法关掉它
  - zh-CN: 病毒用「映像劫持」把任务管理器、杀毒软件换成了别的程序，或者在登录界面的「粘滞键」上留了后门
  - zh-CN: 用过「锁定电脑」「优化」「家长控制」这类工具，或者别人有意设置的
  - zh-CN: 单位、学校管理的电脑，管理员统一设置的
  - zh-CN: 用 Process Explorer 这类软件替换了任务管理器，后来又把它删了
maturity: semi
steps:
  - check: system.disabled-tools
  - check: security.ifeo-hijack
  - check: system.managed-device
guide:
  zh-CN: |
    先看上面的检查结果。单位、学校管理的电脑，这些是管理员有意设置的，不要自己改，找管理员。

    个人电脑上出现这些，按这个顺序处理：

    1. 先杀毒：打开「Windows 安全中心 → 病毒和威胁防护」，点「扫描选项」，做一次「完全扫描」；再选「Microsoft Defender 脱机扫描」（电脑会重启，在开机前扫，能查出藏得深的病毒）。装了别的杀毒软件却打不开的，也说明很可能中了毒。
    2. 杀完毒以后重启电脑，再打开小药箱查一次：策略、映像劫持还在的，病毒走了但留下的设置没有清掉。
    3. 策略停用的：专业版按 Win + R 输入 gpedit.msc 打开「本地组策略编辑器」，在「用户配置 → 管理模板」下面找到对应的项（「系统 → Ctrl+Alt+Del 选项 → 删除“任务管理器”」「系统 → 阻止访问注册表编辑工具」「“开始”菜单和任务栏 → 从“开始”菜单中删除“运行”菜单」这些），改回「未配置」。家庭版没有组策略编辑器，请懂哥按上面检查结果详情里列出的值，在注册表里删掉它们。
    4. 映像劫持的：请懂哥在注册表 HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options 下面，找到被劫持的程序名，删掉它下面的 Debugger 值。登录界面的「粘滞键」「轻松使用」被换掉的，处理完再改一次登录密码。
    5. 只是任务管理器打不开、检查都正常：按 Ctrl + Alt + Del，看看那个界面上有没有「任务管理器」；还不行，用小工具「检查并修复系统文件」。

    实在弄不干净、又有重要资料的，先把资料备份出来，再请懂哥帮忙或者重装系统。
