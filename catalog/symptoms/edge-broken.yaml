# 症状：Edge 浏览器打不开、一打开就闪退、网页一直崩溃（「此页面存在问题」，错误代码 STATUS_ACCESS_VIOLATION、
# STATUS_INVALID_IMAGE_HASH 这些）。先看最近有没有程序频繁崩溃（system.reliability-recent）。指引照微软《What to do if
# Microsoft Edge isn't working》：重启、更新、清除浏览数据、停用扩展、查病毒、更新安全软件、修复（按钮 system.edge-repair：
# 运行 Edge 登记的「修改」，是 Edge 更新程序的联机修复）、还不行就从官网下载安装程序装在原来的上面（按钮 web.edge-download）。
# STATUS_INVALID_IMAGE_HASH 多半是安全软件往浏览器里注入的东西不兼容：只教更新、卸载那个软件；网上教的改策略关掉「渲染器
# 代码完整性」会降低安全性，不教、不改。
id: edge-broken
schema_version: 1
title: { zh-CN: Edge 浏览器打不开、闪退、网页崩溃 }
category: software
summary:
  zh-CN: 点了 Edge 没反应、一打开就闪退；网页一打开就显示「此页面存在问题」，错误代码是 STATUS_ACCESS_VIOLATION、STATUS_INVALID_IMAGE_HASH、Out of Memory 这些。
keywords:
