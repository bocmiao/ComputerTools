id: printer-share
schema_version: 1
title: { zh-CN: 打印机连不上或不打印 }
category: printer
summary:
  zh-CN: 打印任务卡住、打印机无响应，或者共享打印机连不上。
keywords: [打印机, 打印不了, 打印任务卡住, 打印队列, 打印队列删不掉, 打印任务删不掉, 一直显示正在打印, 打印机一直在排队, 共享打印机, 打印机连不上, 默认打印机老变, 默认打印机被改, 默认打印机变成pdf, 打印跑到别的打印机, "0x000006ba", "0x00000bcb", "0x000006d9", "0x000003e3", "0x00000040", 无法保存打印机设置, 需要安装驱动程序, 打印后台处理程序服务没有运行]
causes:
  - { zh-CN: 打印服务停止或打印任务卡住 }
  - { zh-CN: 打印机断电、缺纸、卡纸、USB 或网络连接断开 }
  - { zh-CN: 共享主机未开机，或者两台电脑的打印通信方式不兼容 }
maturity: semi
steps:
  - check: printer.spooler
    stop_on: [advice, manual]
  - check: printer.offline
  - check: network.network-category
    fixes: [network.private-network]
  - check: network.sharing-services
    fixes: [network.enable-sharing-services]
  - check: printer.default-managed
guide:
  zh-CN: |
    先检查打印机是否开机、缺纸或卡纸；USB 线和 Wi-Fi / 网线是否连好。共享打印机还要确认主机已经开机。

    打印任务卡住、队列里的文档删不掉、一直显示「正在打印」却出不来：打开小工具「清空打印队列」，清掉以后重新打印。

    打印机显示「脱机」「已暂停」的，看上面的检查结果，或者在症状列表里选「打印机显示脱机」。

    如果错误码是 0x00000709，在症状列表里选“连接共享打印机报 0x00000709”，到连接方电脑上处理。
    如果错误码是 0x0000011b，选“共享打印机报 0x0000011b”，到共享打印机的主机上处理。

    共享打印机连不上、在「网络」里看不到共享主机的，两台电脑上都看一下「网络类型」「局域网共享用到的服务」这两步；防火墙、输入账户密码这些，见症状「共享文件夹打不开、看不到别的电脑」。

    打印机本身有网口或 Wi-Fi 时，优先在每台电脑上直接按它的 IP 地址添加打印机，省去电脑之间的共享环节。

    其他常见的错误代码：

    1. 0x000006ba（RPC 服务器不可用）：连不上主机的打印服务。先在主机上看上面「打印服务」的检查结果；Windows 11 22H2 以后的电脑之间默认用 RPC over TCP 连接，被防火墙挡住也会这样，按「连接共享打印机报 0x00000709」的办法处理。
    2. 0x00000bcb：从 2021 年 8 月的更新起，普通用户不能通过共享自动安装打印机驱动。用管理员账户在这台电脑上先装好同型号的驱动（到打印机品牌的官网下载），再连接共享打印机。网上让改 RestrictDriverInstallationToAdministrators 的办法会降低安全性，微软不建议。
    3. 0x000006d9：在主机上共享打印机时提示「无法保存打印机设置」：主机的 Windows Defender 防火墙服务没有运行（常被「优化」软件关掉）。在主机上打开小工具「服务管理」，找到「Windows Defender Firewall」，启动类型改成「自动」，再点「启动」。
    4. 0x000003e3：多半是旧的打印机和驱动留下的残留：删掉这台打印机，在「打印机和扫描仪 → 打印服务器属性 → 驱动程序」里删掉它的驱动，再重新添加。
    5. 0x00000040（指定的网络名不再可用）：看上面「局域网共享用到的服务」这一步，或者改成按打印机的 IP 地址添加。
    6. 0x80070035、0x80004005：找不到或者进不去主机，见症状「共享文件夹打不开、看不到别的电脑」。

    还可以在连接打印机的电脑上用微软自带的「打印机疑难解答」自动查一遍（点下面的按钮；它在 Windows 的「获取帮助」应用里，要联网）。
links: ["tool:printer.clear-queue", "tool:open.services", "tool:troubleshoot.printer", "symptom:printer-offline", "symptom:lan-share", "symptom:printer-709"]
