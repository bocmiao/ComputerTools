guide:
  zh-CN: |
    先看上面的检查：信号弱、加密方式老、网卡省电的，照提示处理。

    1. 先分清是 WiFi 慢还是宽带慢：手机连同一个 WiFi、站在路由器旁边测一下网速。手机在路由器旁边也慢，或者电脑插网线也慢，是宽带或者路由器的问题：把路由器、光猫断电 30 秒再插上；还慢，打运营商客服电话。
    2. 离路由器近一点，少隔几堵墙；路由器放在屋子中间、高一点的地方，别塞在柜子里、电视后面，天线竖起来。
    3. 路由器同时有两个 WiFi 的（名字后面带「5G」的是 5 GHz）：离得近时连 5 GHz 的，更快、干扰更少；隔了好几堵墙时连 2.4 GHz 的，穿墙更好。
    4. 周围 WiFi 很多（小区、写字楼）时，2.4 GHz 容易互相干扰：登录路由器的管理页面（地址和密码一般印在路由器背面），把 2.4 GHz 的「信道」从「自动」改成 1、6、11 里的一个试试。
    5. 上面的检查说加密方式老（WEP、TKIP），或者 Windows 提示这个 WiFi「不安全」：在路由器的「无线设置」里把安全模式改成「WPA2-PSK」、加密算法选「AES」（新路由器选「WPA3」），保存以后重新输一次 WiFi 密码。改完速度也会快起来。
    6. 只有这台电脑慢、别的设备都快：到电脑品牌的官网按型号下载最新的无线网卡驱动装上。房子大、有几个房间信号都差的，加一个 Mesh 路由器或者无线扩展器。

    都试过还是慢，把上面「WiFi 连接情况」的结果发给懂哥或者运营商的客服。
