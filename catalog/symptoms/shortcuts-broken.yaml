# 症状：「此电脑」右键「管理」打不开，任务栏上固定的图标、Win + X 菜单打不开，快捷方式固定不到任务栏。
# 最常见的原因是按「去掉快捷方式小箭头」的教程删掉了 lnkfile 的 IsShortcut（system.shortcut-flag → 修复
# system.restore-shortcut-flag）。别的情况给图文指引：图标缓存坏了（小工具「重建图标和缩略图缓存」）、快捷方式指向的程序被卸载或
# 挪走了、所有 exe 都打不开（exe 的打开方式被改坏，小药箱自己也打不开，只能请懂哥）。
id: shortcuts-broken
schema_version: 1
title: { zh-CN: 右键「管理」、任务栏图标打不开 }
summary:
  zh-CN: 「此电脑」右键点「管理」提示「该文件没有与之关联的应用来执行该操作」；任务栏上固定的图标、Win + X 菜单点了没反应；快捷方式固定不到任务栏和开始菜单。
keywords:
  - 此电脑管理打不开
  - 右键管理打不开
  - 计算机管理打不开
  - 该文件没有与之关联的应用
  - 没有与之关联的应用来执行该操作
  - 任务栏图标打不开
  - 任务栏图标点了没反应
  - 固定到任务栏没有了
  - 不能固定到任务栏
  - win+x没反应
  - win+x菜单打不开
  - 快捷方式打不开
  - 去掉小箭头
  - 快捷方式小箭头
  - 小箭头
  - isshortcut
causes:
  - zh-CN: 按网上「去掉快捷方式小箭头」的教程删掉了快捷方式的系统标记
  - zh-CN: 图标缓存坏了，任务栏上的图标变白、变成空白
  - zh-CN: 快捷方式指向的程序被卸载了或者挪了地方
maturity: semi
steps:
  - check: system.shortcut-flag
    fixes: [system.restore-shortcut-flag]
guide:
  zh-CN: |
    先看上面的检查结果：快捷方式的系统标记被删掉的点修复，恢复以后重启资源管理器（或者注销再登录）。

    其他情况：

    1. 任务栏上的图标变成白色、空白：用小工具「重建图标和缩略图缓存」。
    2. 只有某一个快捷方式打不开：在它上面点右键 →「属性」看「目标」，那个程序可能已经卸载了或者挪了地方；从开始菜单重新找到它，再固定到任务栏。
    3. 想去掉快捷方式上的小箭头：不要照网上的教程删 IsShortcut，那样就会出现上面这些问题。小箭头只是个标志，不影响使用。
    4. 所有 exe 程序都打不开（双击没反应，或者被记事本、别的软件打开）：exe 的打开方式被改坏了，这时候小药箱自己也打不开，请懂哥帮忙修复 exe 文件的关联。
