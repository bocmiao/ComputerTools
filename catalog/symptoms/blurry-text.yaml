  - check: hardware.device-problems
guide:
  zh-CN: |
    先看上面的检查：分辨率不是推荐的、显卡驱动没装好的，先按提示改好，大部分发虚就好了。

    1. 所有的字都发虚：点下面的「屏幕」按钮，「显示分辨率」选后面写着「推荐」的那一项。嫌字小的别调低分辨率，改同一页的「缩放」（比如 125%、150%）。
    2. 只有个别软件糊，别的都清楚：多半是这个软件太老，不会自己放大。右键它的快捷方式 →「属性」→「兼容性」→「更改高 DPI 设置」，勾上「替代高 DPI 缩放行为」，下面选「系统（增强）」，点「确定」以后重新打开它。还是糊的，改成「应用程序」再试：字会变清楚，但可能变小，可以在软件自己的设置里调大。
    3. 接了外接显示器、扩展坞，或者改了缩放以后才变糊的：注销再登录一次（或者重启电脑）。以后不想这样，在「屏幕」设置的「缩放」（Windows 10 是「高级缩放设置」）里，打开「让 Windows 尝试修复应用，使其不模糊」。
    4. 字的边上有彩色毛边、看着发虚：点下面的「ClearType 文本调谐器」，勾上「启用 ClearType」，一页一页点看着最清楚的那段字，最后点「完成」。
    5. 只是网页里的字糊或者太小：在浏览器里按 Ctrl + 0 恢复默认大小，按住 Ctrl 转鼠标滚轮调大小。
    6. 外接显示器糊，笔记本屏幕是清楚的：先看上面分辨率的检查；再换一根线、换一个接口（HDMI、DP），在显示器自己的菜单里把「锐利度」调回默认。显示器本身分辨率不高的（比如 27 寸的 1920×1080），字本来就没有笔记本屏幕细。

    都试过还是不行，拍一张屏幕的照片（能看清发虚的字），连同电脑型号、显示器型号发给懂哥。
