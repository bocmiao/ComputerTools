# 症状：字发虚、软件界面模糊（调研 P2「DPI 修复」）。先查分辨率是不是推荐的（display.resolution）和显卡驱动
# （hardware.device-problems）。别的给指引，出处：
# - 微软《更改 Windows 中的屏幕分辨率和布局》：分辨率用标着「推荐」的，比屏幕本身低的分辨率字不清楚；字太小改「缩放」。
# - Windows 开发者博客《Improving the high-DPI experience in GDI based Desktop Apps》（2017）：老程序不支持高 DPI，Windows 只能
#   把它整个拉大，看起来发虚；右键 →「属性」→「兼容性」→「更改高 DPI 设置」，勾上「替代高 DPI 缩放行为」，选「系统（增强）」。
#   选「应用程序」时 Windows 不拉伸它，字清楚但可能变小（微软 Learn《High DPI Desktop Application Development on Windows》）。
# - Windows Insider 博客 Build 17063（2017）：接上、拔掉扩展坞，远程桌面，改了显示设置以后有的程序会变糊，要注销再登录；
#   「高级缩放设置」里的「修复应用中的缩放」可以让 Windows 试着自己修。
# - 微软问答里 ClearType 文本调谐器的用法（按钮 open.cleartype）。
# 不做「一键修复」：替代高 DPI 缩放行为是按程序设的，要用户挑是哪个程序；「修复应用中的缩放」的注册表值没有官方说明。
