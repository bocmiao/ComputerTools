causes:
  - zh-CN: 分辨率不是显示器推荐的那一项（常见的是嫌字小把分辨率调低了），画面被拉伸
  - zh-CN: 显卡驱动没装好，分辨率只有几档，选不到推荐的
  - zh-CN: 老软件不支持高分辨率屏幕的缩放（125%、150% 这些），Windows 只能把它整个拉大，看起来就糊
  - zh-CN: 接了外接显示器、扩展坞，或者改了缩放以后没有重新登录，有的软件还按原来的比例画
  - zh-CN: ClearType（让字的边缘平滑的设置）被「优化」软件关掉了，或者没调好
maturity: semi
steps:
