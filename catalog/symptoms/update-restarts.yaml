# 症状：装了更新以后出问题（变卡、打印机用不了、蓝屏、软件打不开），或者 Windows 老是自己重启装更新、打断正在做的事。
# 查：更新重启前的提醒和使用时段（能一键打开提醒、自动使用时段）、有没有等着重启的更新、最近的更新。小工具「最近装的更新」
# 按天列出装了什么，「更新历史记录（卸载更新）」卸掉出问题的那个。不「关」更新：只用系统自带的暂停和使用时段。
