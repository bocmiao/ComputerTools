guide:
  zh-CN: |
    装了更新以后出问题的：

    1. 点下面的「最近装的更新」，看看出问题那天之前装了哪个更新（记下名字里的 KB 号）。
    2. 点「更新历史记录（卸载更新）」，在最下面的「卸载更新」里找到带同一个 KB 号的更新，点「卸载」，重启电脑。
    3. 有的累积更新不能卸载：Windows 11 可以在「恢复」里点「使用 Windows 更新修复问题」旁边的「立即重新安装」（应用、文件和设置都保留）；或者用系统还原退回到装更新之前的还原点。
    4. 卸载以后，在「Windows 更新」里点「暂停更新」一两周，等微软发补丁修好了再装。不要用「关更新」的软件永久关掉更新，那样安全补丁也装不上了，以后还可能更新失败。

    老是自己重启装更新的：

    5. 点上面检查结果里的按钮，打开「需要重启时通知我」、让「使用时段」按你用电脑的习惯自动调整；也可以点「使用时段」自己把时间设成你平时用电脑的时间（最长 18 个小时）。
    6. 看到「需要重启」的提示时，可以在「Windows 更新」里选一个你不用电脑的时间重启（「计划重启」）。
    7. 急着用电脑、这几天不想被打扰的，在「Windows 更新」里点「暂停更新」（最多能暂停几周），到期以后记得让它装上。
