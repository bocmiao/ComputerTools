# 症状：C 盘满了。检测结果可打开「清理旧临时文件」工具；台式机的休眠文件可以一键缩小（disk.reduce-hiberfile，
# 笔记本、没有休眠文件的电脑由检测 disk.hiberfile 挡住）；其余占用仍给图文指引，所以 maturity 是 semi。
# 存储感知只给「设置」里的入口（小工具 settings.storage-sense）：它默认会删回收站里放了 30 天以上的文件，要用户自己选。
# 待真机验证：微信 4.x 早期版本的设置里去掉了「更改存储位置」，后来的版本是否在「设置 → 文件管理 / 存储空间」
# 里加回来了，需要在最新版上确认菜单名称，再改下面第 2 条治本步骤的写法。
# 搬文件夹的几条提醒（每个文件夹单独新建、不要选盘符根目录、D 盘必须是本机硬盘、只有 C 盘的跳过、先关 OneDrive 备份）
# 都是「位置 → 移动」常见的坑：选了同一个文件夹会混在一起，选了 U 盘拔掉后文件就「不见了」。
id: disk-full
schema_version: 1
title: { zh-CN: C 盘满了 }
summary:
  zh-CN: C 盘变红、提示磁盘空间不足、系统更新装不上、软件打不开。
keywords:
  - C盘满了
  - C盘红了
  - C盘变红
  - C盘空间不足
  - C盘爆满
  - 磁盘空间不足
  - 磁盘已满
  - 系统盘满了
  - 存储空间不足
  - 电脑提示空间不足
  - C盘越来越小
  - 微信占用C盘
  - 空间不够装不了软件
  - 更新提示空间不足
causes:
  - zh-CN: 微信、QQ 的聊天图片、视频和文件默认存在 C 盘，用久了能占几十 GB
  - zh-CN: 下载文件夹和桌面上堆了大文件（它们都在 C 盘）
  - zh-CN: 系统更新留下的缓存，以及重装或升级后留下的旧系统文件夹 Windows.old
  - zh-CN: 临时文件、回收站、休眠文件占了不少空间
  - zh-CN: C 盘分区本来就分得太小
maturity: semi
steps:
  - check: disk.system-free-space
  - check: disk.hiberfile
    fixes: [disk.reduce-hiberfile]
  - check: disk.old-drivers
    fixes: [disk.remove-old-drivers]
guide:
  zh-CN: |
    先看看是什么占了 C 盘：小药箱的「C 盘被什么占了」会列出临时文件、更新缓存、休眠文件、回收站、Windows.old、桌面和下载、微信和 QQ 的文件各占多少（只看不删），再告诉你最大的几块该在哪里清理。

    再治标，腾出空间：

    1. 可以先用小药箱的「清理旧临时文件」删除系统和当前登录用户临时目录中超过 7 天的文件；它不碰下载、桌面、文档和回收站。也可以打开「设置 → 系统 → 存储」，点「临时文件」，勾选要删的项目，再点「删除文件」。注意：「下载」这一项是你自己下载的东西，没看过的先别勾。
    2. 也可以用「磁盘清理」：在开始菜单搜索「磁盘清理」，选 C 盘，点「清理系统文件」，勾选「Windows 更新清理」「临时文件」等再确定。
    3. 旧系统文件夹 Windows.old（在清理列表里叫「以前的 Windows 安装」）：删之前先打开 C:\Windows.old\Users 看看，里面有没有你自己的桌面、文档（没格式化就重装系统时，旧文件只在这里）。确认没有要的东西再删，删了就找不回来了。
    4. 回收站：先打开看看里面有没有还要的东西，再清空。
    5. 旧版驱动：显卡、声卡驱动每更新一次都会在 C 盘留下旧版本，上面「旧版驱动占的空间」那一项查出来占得多的，点它的按钮删掉没在用的旧版本（现在用着的驱动不动，删之前先建还原点）。
    6. 休眠文件：台式机可以用上面「休眠文件」那一项的按钮，把它换成只给快速启动用的精简版，大约能腾出内存两成那么大的空间（不能再用「休眠」，睡眠和快速启动照常）。笔记本、平板要靠它在电量快用完时保存正在做的事，不建议缩小。

    再治本，让 C 盘以后不再变满：

    1. 打开「存储感知」：点小药箱的「存储感知」（或者打开「设置 → 系统 → 存储 → 存储感知」）把它打开，系统会定期自动清理用不上的临时文件。注意「回收站」那一项：默认会删掉在回收站里放了 30 天以上的文件，回收站里还有想要的东西，就改成「从不」；「下载」那一项保持「从不」。

    第 2 到第 4 步都是把东西搬到别的盘。先打开「此电脑」确认：D 盘必须是这台电脑自带的硬盘分区，不能是 U 盘、移动硬盘或者存储卡（拔掉以后，搬过去的桌面文件就「不见了」，装在上面的软件也打不开）。电脑只有一个 C 盘的，这几步不适用，跳过就行。

    2. 微信：打开微信「设置」，在「文件管理」或「存储空间」里找到存储位置，点「更改」换到 D 盘（先把微信更新到最新版；换位置时微信会自动迁移，期间不要关电脑）。QQ、网盘、下载软件同理，在它们自己的设置里找「存储位置」或「下载目录」。
    3. 把新内容默认存到 D 盘：Windows 11 打开「设置 → 系统 → 存储 → 高级存储设置 → 新内容的保存位置」，Windows 10 打开「设置 → 系统 → 存储 → 更改新内容的保存位置」，把应用、文档、音乐、照片、视频都改到 D 盘。
    4. 把桌面、文档、下载文件夹整体搬到 D 盘：
       - 先在 D 盘上给每个文件夹各新建一个空文件夹，比如「D:\桌面」「D:\文档」「D:\下载」。不要几个文件夹选同一个（会混在一起，很难再分开），也不要直接选 D 盘本身（整个 D 盘都会变成桌面）。
       - 开了 OneDrive 备份桌面、文档的（文件夹图标上有云朵或绿色对勾），要先在 OneDrive 的设置里关掉这几个文件夹的备份再搬。关掉时 OneDrive 会问文件留在哪里，拿不准就请懂哥帮忙，不要自己乱点。
       - 在资源管理器里右键「下载」→「属性」→「位置」→「移动」，选刚才新建的「D:\下载」，确定后按提示把原有文件一起移过去。桌面、文档也一样，各自选自己的那个文件夹。
