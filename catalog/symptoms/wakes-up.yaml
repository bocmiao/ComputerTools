# 症状：电脑自己开机、睡着了又自己醒。查唤醒定时器（system.wake-timers → 修复 power.wake-timers-off），小工具「谁把电脑
# 叫醒的」看最近是被什么叫醒的。别的情况给图文指引：鼠标、键盘、网卡叫醒（设备管理器的电源管理）、Windows 更新（活跃
# 时间）、关机后自己开机（BIOS 的定时开机、网络唤醒、来电自启动）、其实是重启了（蓝屏、更新）、快速启动。
