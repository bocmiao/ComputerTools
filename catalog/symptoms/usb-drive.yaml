# 症状：U 盘插上没反应（「此电脑」里看不到、没有盘符、存不进去）。先查 U 盘驱动有没有被禁用（hardware.usb-driver →
# 修复 hardware.enable-usb-storage），再查组策略、自动装载、写保护、藏起来的盘符和插着的 U 盘有没有盘符
# （hardware.usb-storage → 修复 hardware.usb-automount-on、hardware.usb-write-protect-off），最后看设备管理器里有没有
# 出错的设备（hardware.device-problems：「未知 USB 设备（设备描述符请求失败）」这类）。别的情况给图文指引：换口换线、
# 提示要格式化（先别格式化，用「检查」修）、U 盘自己坏了变只读、手机连电脑只充电、移动硬盘供电不够、
# 文件被病毒藏起来（工具箱）、弹不出来（小工具）。
id: usb-drive
schema_version: 1
title: { zh-CN: U 盘插上没反应 }
summary:
  zh-CN: U 盘、移动硬盘、读卡器插上电脑以后「此电脑」里看不到，或者能看到却打不开、存不进去（提示「磁盘被写保护」「需要格式化」）。
