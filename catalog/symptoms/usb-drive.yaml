causes:
  - zh-CN: U 盘驱动被「U 盘锁」「优化」这类软件禁用了（单位的电脑也可能是管理员故意关的）
  - zh-CN: U 盘没分到盘符：Windows 的「自动装载」被关掉了，或者分区坏了、还没分区
  - zh-CN: Windows 里的「U 盘写保护」被打开了，所有 U 盘都只能看、存不进去
  - zh-CN: 接触不良或者供电不够：机箱前面的口、延长线、USB 集线器；移动硬盘尤其要电
  - zh-CN: U 盘自己坏了：认不出来，或者变成只读、提示要格式化
maturity: semi
steps:
  - check: hardware.usb-driver
    fixes: [hardware.enable-usb-storage]
  - check: hardware.usb-storage
    fixes: [hardware.usb-automount-on, hardware.usb-write-protect-off]
  - check: hardware.device-problems
  - check: hardware.class-filters
    fixes: [hardware.class-filters-repair]
guide:
  zh-CN: |
    先把 U 盘插上，再点上面的检查。查出能修的点修复；修完按提示把 U 盘拔下来再插上，或者重启电脑。

    其他情况：

    1. 插上一点反应都没有：换一个 USB 口（台式机插机箱后面的口，前面的口常常接触不好），别接延长线、USB 集线器；U 盘有指示灯的看看亮不亮。换一台电脑也没反应的，多半是 U 盘坏了。
    2. 右下角弹出「无法识别的 USB 设备」，或者设备管理器里有「未知 USB 设备（设备描述符请求失败）」：是 U 盘和电脑没「谈」好，一般是接触不良、供电不够或者 U 盘坏了。换个口、换根线；移动硬盘用它自带的双头线，或者接在机箱后面的口上。
    3. 「此电脑」里能看到，一打开就提示「需要格式化」「文件或目录损坏且无法读取」：先别点格式化（会清掉里面的文件）。在 U 盘上点右键 →「属性」→「工具」→「检查」，修复以后一般就能打开了；还是不行、里面又有要紧的文件，请懂哥帮忙找回来以后再格式化。
    4. 只有这一个 U 盘存不进去（提示「磁盘被写保护」）：SD 卡、有的 U 盘侧面有一个写保护的小开关，拨到另一边；没有开关、换台电脑也一样的，多半是 U 盘用坏了，坏了的 U 盘会自己变成只读，赶紧把里面的文件拷出来。
    5. 手机用数据线连上电脑只充电：在手机上下拉通知栏，点「USB 用于」这类提示，选「传输文件」。换一根能传数据的线（有的线只能充电）。
    6. U 盘里的文件不见了、变成了快捷方式：用工具箱里的「U 盘里的文件不见了」。
    7. 用完弹不出来，提示「设备正在使用中」：用小工具「U 盘弹不出：是谁占着」。
    8. 移动硬盘插上以后「咔咔」响、一会儿有一会儿没有：可能是供电不够，也可能是硬盘快坏了。先换口、换线；还是这样的别再用它，尽快把文件拷出来。

    都不行的话，把 U 盘拿到另一台电脑上试试，分清是电脑的问题还是 U 盘的问题，再请懂哥帮忙。
