# 症状：右下角显示「无 Internet」、小地球，其实能上网。Windows 自己的联网检测（NCSI）没走通：先看网络本身通不通
# （network.connectivity），再看联网检测有没有被关掉、改掉（network.ncsi-settings → 修复 network.ncsi-defaults；组策略只说明），
# 再看代理软件、加速器留下的失效代理（network.proxy-dead → 修复 network.proxy-off），最后看 DNS（检测用的网址要查得到）。
# 微软的排查顺序（《NCSI troubleshooting guidance》）：浏览器打开检测地址、查代理、看 NCSI 日志；不要用关掉主动检测来「解决」。
# 「上不了网」（network）管的是真的上不了网；这里管的是能上网、只是显示不对（以及跟着它以为没网的 Office、应用商店）。
