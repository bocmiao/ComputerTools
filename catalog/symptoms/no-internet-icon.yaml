  - check: network.dns
guide:
  zh-CN: |
    先看上面的检查结果：联网检测被改掉、代理残留的点修复；网络本身有问题的照提示处理。

    其他情况：

    1. 网页、微信都能正常用的话，网络本身没问题，只是这个显示不准。不影响用的可以不管；Office、应用商店、微软账户说没联网的，按下面几步试。
    2. 关掉代理软件、加速器、VPN（在它的设置里关掉「系统代理」，或者正常退出它），再断开 WiFi 重新连一次。代理软件、加速器开着「TUN 模式」「虚拟网卡模式」时，右下角也可能一直显示小地球，关掉这个模式再看。
    3. 用浏览器打开 http://www.msftconnecttest.com/connecttest.txt ：页面上只有一行「Microsoft Connect Test」就是正常的；跳到了登录页面，先登录（酒店、学校的 WiFi）；打不开，多半是代理或者防火墙拦住了，按第 2 步处理。
    4. 断开网络再连一次，或者重启电脑；Windows 在网络变化时才会重新检测。
    5. 还不行，用 Windows 自带的「网络重置」：Windows 11 在「设置 → 网络和 Internet → 高级网络设置 → 网络重置」，Windows 10 在「设置 → 网络和 Internet → 状态」页的最下面。VPN、代理软件、虚拟机的虚拟网卡要重新装，WiFi 密码要重新输入，做完会重启电脑。

    不要照网上的教程去关掉联网检测或者改注册表里的检测地址：微软明确说不要这样「解决」，改完以后更多软件会以为没联网。
