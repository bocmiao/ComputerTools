causes:
  - zh-CN: 开着代理软件、加速器、VPN，或者它们退出时没把系统代理改回去，Windows 的联网检测走不通
  - zh-CN: Windows 自带的联网检测被「优化」软件或者网上的「解决无 Internet」教程关掉、改掉了
  - zh-CN: 组策略关掉了联网检测（单位的电脑常见）
  - zh-CN: 酒店、学校、商场的 WiFi 要先在网页上登录，或者宽带欠费被转到了缴费页面
  - zh-CN: DNS 有问题，检测用的网址查不到
maturity: semi
steps:
