# 症状：桌面图标不见了。先查「显示桌面图标」是不是没勾上（system.desktop-icons → 修复 desktop.show-desktop-icons，
# 能撤销）；别的原因给图文指引：只是「此电脑」「回收站」不见了（桌面图标设置、常用设置里的「桌面显示「此电脑」」）、
# 任务栏也一起不见了（资源管理器卡住，重启资源管理器）、自己放在桌面上的文件不见了（桌面被 OneDrive 接管，文件在
# OneDrive 的「桌面」文件夹里；用临时配置文件登录了）、Windows 10 的平板模式。桌面等文件夹指向的位置没了的，查
# system.shell-folders（修复 system.shell-folders-default：改回默认位置，不搬文件，能撤销）；用临时配置文件登录的查
# system.temp-profile（只查不改，详见症状 temp-profile）。
id: desktop-icons-missing
schema_version: 1
title: { zh-CN: 桌面图标不见了 }
category: desktop
summary:
  zh-CN: 桌面上的图标一下子全没了，或者「此电脑」「回收站」、自己放在桌面上的文件找不到了。
keywords:
  - 桌面图标不见了
  - 桌面图标没了
  - 桌面图标消失
  - 桌面图标全没了
  - 桌面什么都没有
  - 桌面空白
  - 桌面空了
  - 桌面文件不见了
  - 桌面上的文件没了
  - 桌面文件消失
  - 此电脑图标不见了
  - 我的电脑不见了
  - 计算机图标不见了
  - 回收站不见了
  - 显示桌面图标
  - 桌面图标隐藏
  - 位置不可用
  - 桌面位置不可用
  - desktop不可用
  - 桌面引用了一个不可用的位置
  - 桌面路径
  - 桌面位置
  - 文档位置不可用
  - 下载文件夹打不开
causes:
  - zh-CN: 不小心取消了「显示桌面图标」（桌面右键 →「查看」里）：图标全藏起来了，文件都还在
  - zh-CN: 「此电脑」「回收站」这些系统图标没有勾选显示
  - zh-CN: 资源管理器卡住、崩溃了（任务栏常常也一起不见了）
  - zh-CN: 桌面被 OneDrive 接管了：文件跑到了 OneDrive 里的「桌面」文件夹，登录别的账号、退出 OneDrive 以后桌面上就空了
  - zh-CN: 开机时提示「你已使用临时配置文件登录」：自己的桌面、文档这次没加载出来
  - zh-CN: 桌面被挪到了 D 盘、移动硬盘或者 OneDrive，那边现在没了，提示「位置不可用」
maturity: semi
steps:
  - check: system.desktop-icons
    fixes: [desktop.show-desktop-icons]
  - check: system.shell-folders
    fixes: [system.shell-folders-default]
  - check: system.temp-profile
guide:
  zh-CN: |
    先看上面的检查结果：「显示桌面图标」没勾上的，点「显示桌面图标」就回来了（也可以自己在桌面空白处点右键 →「查看」→「显示桌面图标」）。

    其他情况：

    1. 只是「此电脑」「回收站」不见了：在「常用设置」里打开「桌面显示「此电脑」」；别的图标到「设置 → 个性化 → 主题 → 桌面图标设置」里勾上。
    2. 任务栏也一起不见了，或者桌面点了没反应：打开小工具「重启资源管理器」（用 Ctrl + Shift + Esc 打开任务管理器，也能在里面重启「Windows 资源管理器」）。
    3. 自己放在桌面上的文件不见了：打开资源管理器，看左边 OneDrive 里有没有「桌面」文件夹，文件多半在那里（微软的说明：桌面备份到 OneDrive 以后，位置不对时桌面会显示成另一个文件夹）。找不到的话，在资源管理器右上角的搜索框里搜文件名。
    4. 开机时提示「你已使用临时配置文件登录」（上面的检查会查出来）：这时别往桌面上存东西，先重启电脑；重启以后还是这样，看「提示『你已使用临时配置文件登录』」。
    5. Windows 10 上整个桌面变成了一块块的开始屏幕：点右下角的通知中心，关掉「平板模式」。
links: ["tool:system.restart-explorer", "symptom:temp-profile"]
